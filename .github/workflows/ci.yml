name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    name: guards (banned vocab + preview syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Banned vocabulary (no new TEI/PR99)
        run: bash scripts/check-vocab.sh

      - name: Preview JS syntax (apps/preview is outside lint/test coverage)
        run: |
          status=0
          while IFS= read -r f; do
            node --check "$f" || status=1
          done < <(find apps/preview -name '*.js' -not -path '*/node_modules/*')
          exit $status

  workspaces:
    # `npm test` 走 `--workspaces --if-present`，而 root workspaces 自 2026-10-30
    # 起含 `api` —— 名字要跟著實際跑的東西走，否則下一個人會以為 api 沒有測試
    # （那正是 2026-10-29 那一刀的處境）。
    name: packages + domain + api (test & typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # 🔴 tsc 綠**證明不了**這件事：根 node_modules 有那個套件，所以本機與 CI
      # 都解析得到，而 lambda 的 bundle 以 api/package.json 當邊界。#304 就是這樣
      # 讓 /api/alert 在正式站回了 10 天的 500。排在 typecheck 之前，因為它比
      # typecheck 便宜而且它擋的東西 typecheck 永遠看不到。
      - name: api/ 的執行期 import 必須宣告在 api/package.json
        run: node scripts/check-api-deps.mjs

      - name: Typecheck (engine, scan, shared, domain, api)
        run: |
          npx tsc --noEmit -p packages/engine
          npx tsc --noEmit -p packages/scan
          npx tsc --noEmit -p packages/shared
          npx tsc --noEmit -p domain
          npx tsc --noEmit -p api

      - name: Run tests
        run: npm test

  mobile:
    name: apps/mobile (test & typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

  # ═══════════════════════════════════════════════════════════
  # preview harness（Playwright）
  #
  # 🔴 這個 job 存在的理由：apps/preview 長期是 CI 盲區，而那個盲區咬過兩次 ——
  #   1. #231 改了 Hero 無讀數文案沒改斷言 → preview-strip-color 在 main 上
  #      紅著 44/45 好幾天沒人發現。
  #   2. #229/#231/#232 讓 Hero 讀數爆版三次都沒紅，最後是 founder 用手機發現的。
  # 唯一的硬阻礙本來只是六行寫死的 Playwright 絕對路徑（已改成 scripts/lib/playwright.mjs）。
  #
  # ⚠️ 字型是真正要小心的地方：harness 量文字寬度與行數，而 ubuntu runner 預設
  # **沒有中文字型**，Latin 的 sans-serif 也可能解析到 DejaVu（實測「Neutral」
  # 在 DejaVu 下 152px vs 容器 124px，而環心只有 ~128px）。所以這裡明確裝
  # fonts-wqy-zenhei 跟開發容器對齊，harness 自己還有一條字型金絲雀會當場抓到飄移。
  #
  # ⚠️ preview-scan-stardust.mjs **刻意還沒收進來**：它的註解寫明倚賴容器
  # 「連不到 cdnjs」（three.js 載不進來、走 stub），而 CI 連得到，前提整個反過來。
  # 要進 CI 得先處理那個相依，不能直接丟。
  # ═══════════════════════════════════════════════════════════
  preview:
    name: preview harness (playwright)
    # 🔴 **釘住 image，不用 ubuntu-latest。** 2026-10-29 16:13 這個 job 紅了，
    # 而同一天 03:47 同一份 workflow 是綠的 —— 中間變的是 runner：
    #   ERROR: Playwright does not support chromium on ubuntu26.04-x64
    # `ubuntu-latest` 滾到 26.04，而 package.json 釘的 playwright 1.56.1 不認得它，
    # `playwright install --with-deps` 直接失敗（連一條斷言都還沒跑到）。
    #
    # 升 Playwright 也能解，但那會換掉瀏覽器版本 —— 而**這個 job 的基準是綁在
    # image 上的**：上面那段字型註解就是為此存在（DejaVu vs WenQuanYi 會讓
    # 版面斷言假紅）。換 image 等於同時換字型與渲染基準，是另一刀，要自己的驗證。
    # 這裡只做一件事：把環境釘回那個被驗證過的版本。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # 跟開發容器同一套字型 —— 不釘的話版面斷言會假紅（見上方註解）
      #
      # 🔴 **這一步會把整個 job 殺掉，而且是在任何一條測試跑之前。**
      # 2026-11-11 實例（#308）：runner 解不到 azure.archive.ubuntu.com，
      # `apt-get install` 回 100，`shell: bash -e` → job 當場結束。
      # 畫面上看起來像 harness 壞了，實際上 Playwright 連啟動都沒有，
      # 而那個 PR 只動了一個 preview 的 html 檔。那次故障**持續超過一小時**
      # （14:07 與 15:15 兩次 run 的 log 一模一樣）。
      #
      # ⚠️ **重試擋的是短暫失敗，不是那一次。** 三次 15/30s 退避總共撐 45 秒 ——
      # 對一小時的故障無效。放它進來是因為短暫失敗本來就更常見，而且便宜；
      # **不要**把它當成「那個故障修好了」。
      #
      # ⚠️ **不可以改成「失敗也繼續」**（`|| true`、`continue-on-error`）。
      # 字型裝不起來的話 harness 會在**錯的字型**下量文字寬度與行數 ——
      # 那正是假綠與假紅的來源，字型金絲雀（scripts/lib/playwright.mjs 檔頭）
      # 就是為了擋這件事。所以只加重試，不加容忍。
      #
      # 🔴 **失敗的路徑也要留下資料。** 下面的盤點印在安裝**之前**，所以就算
      # 三次都失敗、job 紅掉，log 裡仍然有「這台 runner 本來就有哪些字型」——
      # 那份清單是判斷「能不能乾脆不裝、直接用 runner 既有字型」的唯一依據。
      # 沒有它，下一個人只能再猜一次。
      #
      # 🔴 **它已經回答過一次了（2026-11-12 量的，run 43134169026）：
      # 這台 ubuntu-24.04 runner 的 CJK 字型是 0 個**，`fc-match sans-serif`
      # 是 DejaVu Sans。所以「不裝、用既有字型」這條路**不存在**，不要再試。
      #
      # ⚠️ **空白不是一個答案。** 盤點原本寫成 `fc-list … || echo "(一個都沒有)"`，
      # 而 `fc-list` 空輸出也回 0 → fallback 永遠不觸發。於是第一次量到的結果是
      # log 上一塊**什麼都沒有的區域** —— 它剛好就是「0 個」，但下一個讀的人
      # 分不出「真的沒有」跟「這個診斷自己壞了」。現在顯式數行數並印出 0。
      # 同一科的錯：把「沒量到」畫成跟「量到沒有」一樣。
      # ⚠️ 修的時候又踩了一次同一個坑：第一版的修法在 `fc-list` **跑失敗**時
      # 也印「沒有任何 CJK 字型」。所以現在是三種狀態各一句話 ——
      # 列出來／0 個／盤點自己失敗。前兩個是量到的結果，第三個不是。
      # ⚠️ 盤點一律包 `|| true`：`set -o pipefail` 下 `… | head` 會因為
      # head 提早關閉管線而讓整段非零離開（實測：後面那行 echo 根本沒跑到）。
      # 一個為了診斷而加的指令把 job 殺掉，是這一刀最容易自己製造的笑話。
      - name: Pin fonts (match the dev container)
        run: |
          set -euo pipefail
          echo "--- 安裝前：這台 runner 本來就有的 CJK 字型 ---"
          if before_cjk=$(fc-list :lang=zh-tw family 2>/dev/null); then
            before_cjk=$(printf '%s\n' "$before_cjk" | sort -u | sed '/^$/d')
            if [ -z "$before_cjk" ]; then
              echo "(0 個：這台 runner 沒有任何 CJK 字型)"
            else
              printf '%s\n' "$before_cjk"
              printf '(共 %s 個)\n' "$(printf '%s\n' "$before_cjk" | wc -l)"
            fi
          else
            echo "(盤點自己失敗：fc-list 跑不起來或回非零。這**不等於**「沒有字型」—— 底下那個數字不存在，不要當成 0 讀。)"
          fi
          echo "--- 安裝前：sans-serif 目前解析到 ---"
          { fc-match sans-serif; } || true
          for i in 1 2 3; do
            if sudo apt-get update -qq && sudo apt-get install -y -qq fonts-wqy-zenhei; then
              echo "字型安裝成功（第 $i 次嘗試）"
              break
            fi
            if [ "$i" = 3 ]; then
              echo "::error::連續三次裝不到 fonts-wqy-zenhei。這不是版面問題，是 runner 的 apt mirror（2026-11-11 實例：azure.archive.ubuntu.com 解析失敗超過一小時）。上面「安裝前本來就有的 CJK 字型」那份清單可以判斷要不要改走不經 apt 的路。"
              exit 1
            fi
            echo "第 $i 次失敗，等 $((i * 15))s 再試"
            sleep $((i * 15))
          done
          fc-cache -f
          echo "--- sans-serif 解析到 ---"
          fc-match sans-serif
          fc-match "sans-serif:lang=zh-tw"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: pw-${{ runner.os }}-

      # ⚠️ 這一步是 CI 專屬。PLAYBOOK 有一條「不要 playwright install」——
      # 那是**開發容器**的規則（瀏覽器已預裝在 /opt/pw-browsers），不適用於 runner。
      #
      # 🔴 **這一步也跑 apt，而它才是必須成功的那一個。**
      # `--with-deps` 會自己 `apt-get install` 一串套件，而 playwright 的 chromium
      # 相依清單**本來就含 `fonts-wqy-zenhei`**（playwright-core nativeDeps，與
      # fonts-liberation / fonts-noto-color-emoji 並列）。2026-11-12 的 log 裡那句
      # `fonts-wqy-zenhei is already the newest version` 就是它在講上一步裝過了。
      #
      # 兩個後果，都跟直覺反過來：
      #   ① 刪掉上面那個 Pin fonts **不會**讓 apt 離開關鍵路徑 —— #308 照樣會死，
      #      只是晚一步死在這裡。那條「乾脆不裝」的路因此是假的。
      #   ② 只給 Pin fonts 加重試，等於保護了**可有可無**的那個 apt，
      #      而把必須成功的這個留著裸奔。所以同一套重試要蓋這裡。
      #
      # 上面那個 Pin fonts 仍然留著，理由是顯式：repo 自己說出它需要這個字型，
      # 不靠「playwright 剛好也會裝」。哪天 playwright 換掉清單，金絲雀會紅，
      # 不會安靜地換成 DejaVu 去量版面。
      - name: Install Chromium
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            if npx playwright install --with-deps chromium; then
              echo "Chromium + 系統相依安裝成功（第 $i 次嘗試）"
              break
            fi
            if [ "$i" = 3 ]; then
              echo "::error::連續三次裝不起 Chromium 與它的系統相依。這一步會跑 apt（也會下載瀏覽器），所以先看上面是 apt mirror 解析失敗、還是 cdn.playwright.dev 下載失敗 —— 兩者都不是版面問題。"
              exit 1
            fi
            echo "第 $i 次失敗，等 $((i * 15))s 再試"
            sleep $((i * 15))
          done

      - name: FDCB + Turning Point harness
        run: node scripts/preview-fdcb.mjs

      # `/app/` 啟動路由 —— 它錯掉的兩種方式都很安靜（回訪者被丟回 onboarding、
      # 新用戶被丟進空的 Today），畫面兩邊都完全正常。所以直接驗落點。
      - name: App launch harness (PWA 啟動路由)
        run: node scripts/preview-app-launch.mjs

      # service worker 的兩個 handler。它掌管的兩件事都會**靜默**出錯：
      # 共用 tag → 第二則通知蓋掉第一則；target 沒被用到 → 點通知去錯的畫面。
      - name: SW push harness (通知 tag 與點擊落點)
        run: node scripts/preview-sw-push.mjs

      - name: Strip colour / outcome harness
        run: node scripts/preview-strip-color.mjs

      # 快訊 → 交棒 → 決策計時器 → 收束，跨兩個頁面走完整條鏈。
      # 這一段最容易靜默壞掉：跨頁、跨 localStorage、跨兩套 template id。
      - name: Decision chain harness (alert → timer)
        run: node scripts/preview-decision-chain.mjs

      # 這兩支是 #238 / #240 為了 founder 實走回報寫的（Today 版面遮擋 33 條、
      # 眨眼谷底偵測 9 條），但當時 harness 還沒進 CI，所以它們一直只能在開發
      # 容器裡手跑 —— 也就是完全沒有在守任何東西。
      #
      # ⚠️ stardust 那條排除理由（倚賴容器連不到 cdnjs）**不適用於這兩支**：
      # 兩支都不碰 three.js／TENKI_STARDUST，且用 domcontentloaded 不等 load。
      # 但 scan-blink 載的是 v6/index.html，而 CI 連得到 cdnjs、容器連不到 ——
      # 這個前提差異在沙箱裡驗不掉，第一次 CI run 就是它的驗收。
      - name: Today layout harness (遮擋幾何)
        run: node scripts/preview-today-layout.mjs

      - name: Scan blink harness (谷底偵測)
        run: node scripts/preview-scan-blink.mjs

      # 「正對儀器」那條回饋（founder 2026-10-01：「眼睛好像不用看鏡頭或螢幕」）。
      # ⚠️ 這支的星塵那一段在**開發容器裡會跳過**（連不到 cdnjs → three.js 走 stub），
      # 但 CI 連得到 → 那幾條在這裡才第一次真的跑。第一次 run 就是它們的驗收。
      - name: Scan squareness harness (正對回饋)
        run: node scripts/preview-scan-squareness.mjs

      # 掃描儀器離鏡頭夠近（founder 2026-10-14：「臉跟眼睛還是沒有對正螢幕」）。
      # 量三種視窗高度 × 兩種 mission 的框心位置，並含一條反向斷言：
      # 把版面改回置中就必須退回 0.44H —— 沒紅過的閘門不是閘門。
      - name: Scan lens-offset harness (儀器離鏡頭多近)
        run: node scripts/preview-scan-lens-offset.mjs

      # 電影級視覺骨架（docs/prompts/antigravity-cinematic-kickoff.md）。
      # 🔴 不帶 ?cine 時頁面必須跟現在一致；含反向驗證：拿掉 early return 會紅 35 條。
      - name: Cinematic dark-launch harness (?cine 缺席＝不變)
        run: node scripts/preview-cinematic.mjs

      - name: Token scale harness (色階系統守門)
        run: node scripts/preview-token-scale.mjs

      # 鏡射守門：apps/preview/drift.js 是 packages/engine/src/intelligence/ 的
      # 手抄鏡射，而「跨檔鏡射漂移」是這個 repo 付過三次學費的坑。這一支逐一
      # 比對兩邊的常數與文案，並實走誠實分支（證據不足 / 沒有明顯改變）。
      - name: Drift alert harness (鏡射比對 + 誠實分支)
        run: node scripts/preview-drift.mjs

      # 手指基線實走頁。這一頁會對使用者**宣稱量測結果**，所以守門比其他
      # preview 頁更重要：① 它跑的 apps/preview/engine/ 是從 packages/engine
      # 編出來的，改了 TS 沒重建就紅；② 訊號不足時必須真的拒答，而且不准上
      # gold（gold = SECURED）；③ 斷言的資料來自真的 pipeline，不是往 DOM
      # 填數字。
      - name: Finger baseline harness (鏡射同步 + 拒答行為)
        run: node scripts/preview-finger.mjs
      # Lab 分頁：校準台的誠實規則（樣本不足不印分子、滿格斜紋）、
      # 帶位色只上在帶位身上、以及那些「講排除了幾筆」的字讀不讀得動。
      - name: Lab harness
        run: node scripts/preview-lab.mjs
      # Datum Glyphs（圖示系統 v4）＋自架 Geist：一顆圖示最多一個 datum、
      # 佔位都被填了、底部導覽只有一個青色的點、字型不是靜靜退回系統字。
      - name: Datum glyphs harness
        run: node scripts/preview-datum.mjs
