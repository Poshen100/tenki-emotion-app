<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!--
    TENKI Resonance Enso mark - solid master (24x24 grid).
    Filled disc with the resonance wave knocked out (mask), for app icon,
    splash, and small favicon use. Color via currentColor.
  -->
  <defs>
    <mask id="wave-knockout">
      <rect width="24" height="24" fill="white"/>
      <path d="M 2 13.6 C 6.8 13.6 8 10.2 12 10.2 C 16 10.2 17.2 13.6 22 13.6"
            stroke="black" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    </mask>
  </defs>
  <circle cx="12" cy="12" r="10" fill="currentColor" mask="url(#wave-knockout)"/>
</svg>
