<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TENKI — Finger Placement Guide</title>
  <meta name="theme-color" content="#030407">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#030407; --cyan:#00F0FF; --gold:#FFC85E; --mint:#00E699;
      --txt:#FFFFFF; --txt2:#9BA4C4; --ppg:#FF5566;
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    html,body{height:100%;background:var(--bg);font-family:'Inter',-apple-system,system-ui,sans-serif;color:var(--txt);-webkit-font-smoothing:antialiased;overflow:hidden;}
    #stage{
      position:relative;width:100vw;height:100dvh;max-width:460px;margin:0 auto;
      display:flex;flex-direction:column;align-items:center;
      padding:max(14px,env(safe-area-inset-top)) 24px max(16px,env(safe-area-inset-bottom));
      background:
        radial-gradient(120% 70% at 50% 0%, rgba(30,18,77,.5), transparent 60%),
        radial-gradient(90% 60% at 50% 100%, rgba(0,240,255,.05), transparent 55%),
        var(--bg);
    }
    .topbar{width:100%;display:flex;align-items:center;height:30px;}
    .back{color:var(--cyan);font-size:15px;font-weight:500;opacity:.9;}
    h1{margin-top:14px;font-size:26px;font-weight:800;letter-spacing:-.4px;text-align:center;}
    .sub{margin-top:6px;font-size:13px;color:var(--txt2);text-align:center;}
    .pill{
      margin-top:12px;display:inline-flex;align-items:center;gap:6px;
      padding:5px 12px;border-radius:999px;font-size:10px;letter-spacing:1.2px;font-weight:600;
      color:var(--mint);background:rgba(0,230,153,.08);border:1px solid rgba(0,230,153,.22);
    }

    /* ── demo stage ── */
    .demo{flex:1;width:100%;display:flex;align-items:center;justify-content:center;position:relative;}
    .phone{
      position:relative;width:182px;height:264px;border-radius:38px;
      background:linear-gradient(150deg,#12151c,#05070c 60%,#0b0e15);
      border:1px solid rgba(255,255,255,.08);
      box-shadow:0 24px 60px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.06);
    }
    /* camera module top-left */
    .cam{
      position:absolute;top:16px;left:16px;width:78px;height:78px;border-radius:22px;
      background:linear-gradient(150deg,#1b2029,#0a0d13);
      border:1px solid rgba(255,255,255,.07);box-shadow:inset 0 2px 8px rgba(0,0,0,.6);
    }
    .lens{position:absolute;border-radius:50%;background:radial-gradient(circle at 38% 34%, #3a4658, #0c1118 70%);border:1px solid rgba(255,255,255,.10);box-shadow:inset 0 0 6px rgba(0,0,0,.8);}
    .lens.main{width:34px;height:34px;left:9px;top:9px;}
    .lens.sec{width:28px;height:28px;right:9px;bottom:9px;}
    .flash{position:absolute;right:14px;top:13px;width:9px;height:9px;border-radius:50%;background:#cfe3ff;opacity:.5;}
    /* the live PPG glow on the main lens (heartbeat) */
    .glow{position:absolute;left:9px;top:9px;width:34px;height:34px;border-radius:50%;
      background:radial-gradient(circle, rgba(255,85,102,.95), rgba(255,85,102,0) 70%);
      opacity:0;animation:beat 1s ease-in-out infinite;mix-blend-mode:screen;pointer-events:none;}
    .ring{position:absolute;left:26px;top:26px;width:0;height:0;border-radius:50%;
      border:2px solid rgba(255,85,102,.6);transform:translate(-50%,-50%);opacity:0;
      animation:ripple 1.8s ease-out infinite;pointer-events:none;}
    .ring.r2{animation-delay:.9s;}

    /* fingertip gliding onto the lens */
    .finger{
      position:absolute;left:5px;top:5px;width:54px;height:80px;border-radius:28px 28px 26px 26px;
      background:linear-gradient(160deg,#f4c9bf,#e09a96 55%,#c97f86);
      box-shadow:0 10px 26px rgba(0,0,0,.5), inset 0 -10px 18px rgba(150,60,70,.35), inset 0 6px 10px rgba(255,255,255,.35);
      transform-origin:60% 0;
      animation:place 5s cubic-bezier(.4,0,.3,1) infinite;
    }
    .finger::after{content:'';position:absolute;top:9px;left:50%;transform:translateX(-50%);
      width:30px;height:24px;border-radius:14px;background:linear-gradient(180deg,#fbe6df,#f0c4bd);opacity:.85;} /* nail */
    .finger .pad{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:30px;height:30px;border-radius:50%;
      background:radial-gradient(circle, rgba(255,85,102,.5), rgba(255,85,102,0) 68%);} /* blood glow at pad */

    @keyframes place{
      0%   {transform:translate(40px,-150px) rotate(-10deg);opacity:0;}
      12%  {opacity:1;}
      26%  {transform:translate(0,0) rotate(0);opacity:1;}        /* landed over the camera */
      30%  {transform:translate(0,2px) scale(.985) rotate(0);}    /* gentle press */
      82%  {transform:translate(0,2px) scale(.985) rotate(0);opacity:1;}
      94%  {transform:translate(40px,-150px) rotate(-10deg);opacity:0;}
      100% {opacity:0;}
    }
    @keyframes beat{ 0%,100%{opacity:.18;} 18%{opacity:.85;} 32%{opacity:.3;} 48%{opacity:.6;} }
    @keyframes ripple{ 0%{width:8px;height:8px;opacity:.7;} 100%{width:64px;height:64px;opacity:0;} }

    .instr{margin-top:6px;font-size:14px;color:var(--txt2);text-align:center;max-width:240px;}

    /* quality chips light Cover → Still → Pressure in sequence */
    .chips{margin-top:16px;display:flex;gap:10px;width:100%;}
    .chip{
      flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;
      padding:11px 6px;border-radius:16px;font-size:12px;font-weight:600;color:var(--txt2);
      background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);
      transition:color .4s ease,border-color .4s ease,background .4s ease,box-shadow .4s ease;
    }
    .chip .ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;
      color:#06210f;background:rgba(255,255,255,.10);transition:all .4s ease;}
    .chip.on{color:var(--txt);border-color:rgba(0,230,153,.4);background:rgba(0,230,153,.07);}
    .chip.on .ic{background:var(--mint);box-shadow:0 0 12px rgba(0,230,153,.6);}

    .cta{margin-top:16px;width:100%;padding:15px;border:none;border-radius:14px;
      font-family:inherit;font-size:16px;font-weight:700;color:#021018;
      background:linear-gradient(120deg,#56E8FF,#4DA6FF 60%,#7B61FF);box-shadow:0 8px 26px rgba(0,200,255,.3);}
    .foot{margin-top:12px;font-size:11px;color:var(--txt2);letter-spacing:2px;opacity:.6;}

    @media (prefers-reduced-motion: reduce){
      .finger{animation:none;transform:translate(0,2px) scale(.985);}
      .glow{animation:none;opacity:.5;}
      .ring{display:none;}
    }
  </style>
</head>
<body>
  <div id="stage">
    <div class="topbar"><span class="back">‹ Back</span></div>
    <h1>Finger Placement Guide</h1>
    <p class="sub">Privacy-first Finger PPG precision scan</p>
    <span class="pill">&#128274; ON-DEVICE</span>

    <div class="demo">
      <div class="phone">
        <div class="cam">
          <div class="lens main"></div>
          <div class="lens sec"></div>
          <div class="flash"></div>
          <div class="glow"></div>
          <div class="ring"></div>
          <div class="ring r2"></div>
        </div>
        <div class="finger"><span class="pad"></span></div>
      </div>
    </div>

    <p class="instr">Place your fingertip gently over the camera.</p>

    <div class="chips">
      <div class="chip" data-k="cover"><span class="ic">&#10003;</span>Cover</div>
      <div class="chip" data-k="still"><span class="ic">&#9680;</span>Still</div>
      <div class="chip" data-k="press"><span class="ic">&#9683;</span>Pressure</div>
    </div>

    <button class="cta">Continue</button>
    <div class="foot">✦ TENKI</div>
  </div>

  <script>
    // Light the quality chips in sequence, synced to the ~5s finger-placement loop.
    (function(){
      var cover=document.querySelector('[data-k="cover"]'),
          still=document.querySelector('[data-k="still"]'),
          press=document.querySelector('[data-k="press"]');
      var reduce=false; try{ reduce=matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
      if(reduce){ cover.classList.add('on'); still.classList.add('on'); press.classList.add('on'); return; }
      var CYCLE=5000, t0=performance.now();
      function set(el,on){ el.classList.toggle('on', on); }
      (function tick(){
        requestAnimationFrame(tick);
        var t=(performance.now()-t0) % CYCLE;
        set(cover, t>1350 && t<4700);   // finger has landed (covered)
        set(still, t>2300 && t<4700);   // held steady
        set(press, t>3100 && t<4700);   // gentle pressure confirmed
      })();
    })();
  </script>
</body>
</html>
