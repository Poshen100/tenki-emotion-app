<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#05070d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>TENKI CORE — 3D Baseline (prototype)</title>

  <!-- Three.js resolved via import map; MediaPipe imported by URL in the module -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
    }
  }
  </script>

  <style>
    :root {
      --bg: #05070d;
      --gold: #ffc85e;
      --gold-soft: #ffe9b0;
      --cyan: #36e6ff;
      --text: #f3f5fa;
      --text-dim: #8a93a6;
      --lock-mint: #00e699;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%; width: 100%;
      background: radial-gradient(120% 90% at 50% 18%, #0b1020 0%, #05070d 60%, #020306 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    /* hidden source video — its pixels are never shown, only landmarks are derived */
    #cam-video {
      position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none;
      top: -10px; left: -10px;
    }
    #scene { position: fixed; inset: 0; z-index: 1; }
    #scene canvas { display: block; }

    /* top status */
    #topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 3;
      display: flex; align-items: center; gap: 9px;
      padding: calc(env(safe-area-inset-top) + 14px) 18px 14px;
      font-size: 13px; font-weight: 600; letter-spacing: 0.2px; color: var(--text-dim);
    }
    #dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--cyan); box-shadow: 0 0 10px var(--cyan);
      transition: background .4s, box-shadow .4s;
    }
    #dot.gold { background: var(--gold); box-shadow: 0 0 10px var(--gold); }

    /* bottom copy + progress */
    #ui {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 3;
      padding: 26px 26px calc(env(safe-area-inset-bottom) + 30px);
      text-align: center;
      background: linear-gradient(to top, rgba(3,5,10,0.88) 0%, rgba(3,5,10,0.55) 55%, rgba(3,5,10,0) 100%);
    }
    #instruction {
      font-size: 27px; font-weight: 700; line-height: 1.2; letter-spacing: -0.4px;
      margin-bottom: 8px; transition: color .5s;
    }
    #subtitle { font-size: 14.5px; color: var(--text-dim); line-height: 1.45; min-height: 21px; }

    #meter {
      height: 4px; width: 100%; max-width: 280px; margin: 18px auto 0;
      background: rgba(255,255,255,0.10); border-radius: 999px; overflow: hidden;
      opacity: 0; transition: opacity .4s;
    }
    #meter.on { opacity: 1; }
    #meter-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, var(--cyan), var(--gold-soft));
      border-radius: 999px; transition: width .12s linear;
    }

    #cta {
      display: none; margin: 22px auto 0; padding: 16px 30px;
      background: linear-gradient(180deg, var(--gold-soft), var(--gold));
      color: #2a1d00; font-size: 16px; font-weight: 700; letter-spacing: 0.2px;
      border: none; border-radius: 16px; cursor: pointer;
      box-shadow: 0 8px 30px rgba(243,169,42,0.35);
    }
    #cta.on { display: inline-block; }

    #pill {
      position: fixed; left: 50%; transform: translateX(-50%);
      top: calc(env(safe-area-inset-top) + 46px); z-index: 3;
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 13px; border-radius: 999px;
      background: rgba(0,230,153,0.10); border: 1px solid rgba(0,230,153,0.28);
      color: var(--lock-mint); font-size: 11px; font-weight: 600; letter-spacing: 0.4px;
    }

    /* fatal / permission message */
    #fatal {
      display: none; position: fixed; inset: 0; z-index: 5;
      flex-direction: column; align-items: center; justify-content: center;
      padding: 40px; text-align: center; gap: 14px;
      background: rgba(3,5,10,0.92);
    }
    #fatal.on { display: flex; }
    #fatal h2 { font-size: 20px; font-weight: 700; }
    #fatal p { font-size: 14px; color: var(--text-dim); line-height: 1.5; max-width: 300px; }
  </style>
</head>
<body>
  <video id="cam-video" playsinline autoplay muted></video>
  <div id="scene"></div>

  <div id="topbar"><span id="dot"></span><span id="status">Initializing depth engine…</span></div>
  <div id="pill">🔒 ON-DEVICE · NO FACE STORED</div>

  <div id="ui">
    <h1 id="instruction">Building your 3D baseline</h1>
    <p id="subtitle">Setting up — this happens once.</p>
    <div id="meter"><div id="meter-fill"></div></div>
    <button id="cta" data-href="/preview/v6/?from=baseline">Start your first scan</button>
  </div>

  <div id="fatal">
    <h2 id="fatal-title">Camera needed</h2>
    <p id="fatal-msg">We build your baseline on-device using the front camera. No image ever leaves your phone.</p>
  </div>

  <script type="module" src="baseline-3d.js"></script>
</body>
</html>
