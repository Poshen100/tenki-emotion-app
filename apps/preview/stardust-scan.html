<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TENKI CORE — Biometric Calibration Scan</title>
    <!-- Google Fonts for premium typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #02050a;
            --primary-cyan: #00B4D8;
            --primary-pink: #FF66CC;
            --primary-purple: #9966FF;
            --glass-bg: rgba(8, 16, 28, 0.72);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-border-hover: rgba(0, 180, 216, 0.25);
            --neon-glow: rgba(0, 180, 216, 0.4);
            --txt-white: #ffffff;
            --txt-dim: rgba(255, 255, 255, 0.55);
            --txt-sec: rgba(255, 255, 255, 0.35);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--txt-white);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            user-select: none;
        }

        /* 3D WebGL Canvas Container */
        #universe {
            position: absolute;
            inset: 0;
            z-index: 1;
            background: radial-gradient(circle at center, #0c1220 0%, #02050a 100%);
            transition: filter 1s ease;
        }

        /* Full screen overlay for Brand Splash */
        #brand-splash {
            position: fixed;
            inset: 0;
            background-color: var(--bg-dark);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 1;
            transition: opacity 0.8s ease-in-out;
        }

        .logo-container {
            position: relative;
            margin-bottom: 24px;
            width: 90px;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-glow {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 180, 216, 0.4) 0%, transparent 70%);
            filter: blur(8px);
            animation: pulse-glow 2.5s infinite alternate;
        }

        .logo-symbol {
            font-size: 54px;
            color: #ffffff;
            font-weight: 300;
            text-shadow: 0 0 20px rgba(0, 180, 216, 0.8);
            z-index: 1;
            animation: breathe-logo 4.2s infinite ease-in-out;
        }

        .brand-title {
            font-family: 'Space Mono', monospace;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 6px;
            color: var(--txt-white);
            margin-bottom: 8px;
            text-shadow: 0 0 10px rgba(255,255,255,0.15);
        }

        .brand-subtitle {
            font-family: 'Space Mono', monospace;
            font-size: 9px;
            font-weight: 400;
            letter-spacing: 3px;
            color: var(--primary-cyan);
            text-shadow: 0 0 8px var(--neon-glow);
        }

        /* Ambient UI HUD Layer */
        #hud-layer {
            position: absolute;
            inset: 0;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px;
            padding-top: calc(24px + env(safe-area-inset-top));
            padding-bottom: calc(24px + env(safe-area-inset-bottom));
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        /* Top HUD Bar */
        .hud-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .hud-title-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 8px 16px;
            border-radius: 99px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .hud-dot {
            width: 6px;
            height: 6px;
            background-color: var(--primary-cyan);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--primary-cyan);
            animation: blink-dot 1s infinite alternate;
        }

        .hud-title {
            font-family: 'Space Mono', monospace;
            font-size: 10px;
            letter-spacing: 2px;
            font-weight: 700;
            color: var(--txt-white);
        }

        .badge-status {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 6px 14px;
            border-radius: 99px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            font-family: 'Space Mono', monospace;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--primary-cyan);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }

        .badge-status.searching {
            color: var(--primary-pink);
            border-color: rgba(255, 102, 204, 0.2);
        }

        .badge-status.locked {
            color: var(--primary-cyan);
            border-color: rgba(0, 180, 216, 0.2);
            box-shadow: 0 0 15px rgba(0, 180, 216, 0.15);
        }

        .badge-status.syncing {
            color: var(--primary-purple);
            border-color: rgba(153, 102, 255, 0.2);
        }

        /* Glassmorphism Cards (Left & Right) */
        .hud-panels {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
            margin-bottom: 24px;
        }

        .hud-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 16px;
            width: calc(50% - 12px);
            max-width: 220px;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
            transition: border-color 0.4s ease;
        }

        .hud-card:hover {
            border-color: var(--glass-border-hover);
        }

        .card-title {
            font-family: 'Space Mono', monospace;
            font-size: 8px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: var(--txt-sec);
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        /* Telemetry PPG Waveform */
        .telemetry-wave-wrap {
            width: 100%;
            height: 70px;
            position: relative;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.03);
            margin-bottom: 10px;
        }

        #ppg-wave {
            width: 100%;
            height: 100%;
            display: block;
        }

        .telemetry-row {
            display: flex;
            justify-content: space-between;
            font-size: 9px;
            color: var(--txt-dim);
            font-family: 'Space Mono', monospace;
        }

        .telemetry-row span.val {
            color: var(--primary-cyan);
            font-weight: 700;
        }

        /* Metrics List */
        .metric-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .metric-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .metric-label {
            font-size: 11px;
            color: var(--txt-dim);
        }

        .metric-val-wrap {
            font-family: 'Space Mono', monospace;
            font-size: 14px;
            font-weight: 700;
            color: var(--txt-white);
            display: flex;
            align-items: baseline;
            gap: 2px;
        }

        .metric-val-wrap .unit {
            font-size: 8px;
            font-weight: 400;
            color: var(--txt-sec);
        }

        /* Centered Progress scan ring */
        .hud-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 180px;
            height: 180px;
        }

        .progress-ring-svg {
            width: 180px;
            height: 180px;
            position: absolute;
            transform: rotate(-90deg);
        }

        .progress-ring-circle-bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.03);
            stroke-width: 5;
        }

        .progress-ring-circle-fill {
            fill: none;
            stroke: var(--primary-cyan);
            stroke-width: 6;
            stroke-linecap: round;
            stroke-dasharray: 440;
            stroke-dashoffset: 440;
            filter: drop-shadow(0 0 6px var(--primary-cyan));
            transition: stroke-dashoffset 0.1s linear;
        }

        .center-timer-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }

        .center-time {
            font-family: 'Space Mono', monospace;
            font-size: 42px;
            font-weight: 700;
            line-height: 1;
            color: var(--txt-white);
            text-shadow: 0 0 15px rgba(255,255,255,0.2);
            animation: heartbeat-text 0.88s infinite ease-in-out;
        }

        .center-unit {
            font-family: 'Space Mono', monospace;
            font-size: 9px;
            letter-spacing: 2px;
            font-weight: 700;
            color: var(--txt-sec);
            margin-top: 4px;
        }

        /* Bottom Guidance Panel */
        .hud-footer {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .guidance-bar {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 99px;
            padding: 10px 24px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            font-size: 11px;
            color: var(--txt-dim);
            letter-spacing: 0.5px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            transition: all 0.5s ease;
        }

        /* Climax Flash Overlay */
        #scan-flash {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle, #ffffff 0%, rgba(0, 180, 216, 0.4) 60%, transparent 100%);
            z-index: 90;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease-out;
        }

        /* Animations */
        @keyframes pulse-glow {
            from { transform: scale(0.95); opacity: 0.3; }
            to { transform: scale(1.1); opacity: 0.5; }
        }

        @keyframes breathe-logo {
            0%, 100% { transform: scale(1); opacity: 0.85; }
            50% { transform: scale(1.06); opacity: 1; }
        }

        @keyframes heartbeat-text {
            0%, 100% { transform: scale(1); }
            12% { transform: scale(1.08); }
            22% { transform: scale(1.02); }
            30% { transform: scale(1.05); }
        }

        @keyframes blink-dot {
            from { opacity: 0.3; }
            to { opacity: 1; }
        }

        /* Media Queries for responsive panels */
        @media (max-width: 480px) {
            .hud-panels {
                flex-direction: row;
                gap: 12px;
            }
            .hud-card {
                width: calc(50% - 6px);
                padding: 12px;
            }
            .center-time {
                font-size: 36px;
            }
            .progress-ring-svg {
                width: 150px;
                height: 150px;
            }
            .hud-center {
                width: 150px;
                height: 150px;
            }
            .progress-ring-circle-fill, .progress-ring-circle-bg {
                cx: 75px;
                cy: 75px;
                r: 60px;
                stroke-width: 5;
            }
            .progress-ring-circle-fill {
                stroke-dasharray: 377;
                stroke-dashoffset: 377;
            }
        }
    </style>
</head>
<body>

    <!-- 1. The 3D WebGL Stardust Canvas Container -->
    <div id="universe"></div>

    <!-- 2. Climax Flash Overlay -->
    <div id="scan-flash"></div>

    <!-- 3. Brand Splash Intro Overlay -->
    <div id="brand-splash">
        <div class="logo-container">
            <div class="logo-glow"></div>
            <div class="logo-symbol">✦</div>
        </div>
        <h1 class="brand-title">TENKI CORE</h1>
        <p class="brand-subtitle">READING YOUR INNER WEATHER</p>
    </div>

    <!-- 4. Glassmorphism HUD Overlay -->
    <div id="hud-layer">
        
        <!-- Header status bar -->
        <header class="hud-header">
            <div class="hud-title-card">
                <div class="hud-dot"></div>
                <div class="hud-title">BIOMETRIC SYNCING</div>
            </div>
            <div class="badge-status searching" id="badge-status">[ SEARCHING ]</div>
        </header>

        <!-- Center scan circular ring -->
        <div class="hud-center">
            <svg class="progress-ring-svg" viewBox="0 0 160 160">
                <circle class="progress-ring-circle-bg" cx="80" cy="80" r="70" />
                <circle class="progress-ring-circle-fill" id="progress-ring" cx="80" cy="80" r="70" />
            </svg>
            <div class="center-timer-wrap">
                <div class="center-time" id="countdown-text">8</div>
                <div class="center-unit">SECONDS</div>
            </div>
        </div>

        <!-- Panels: Left (PPG Canvas Wave) & Right (Telemetry list) -->
        <div class="hud-panels">
            
            <!-- Left Telemetry Panel -->
            <div class="hud-card">
                <div class="card-title">ECG Waveform</div>
                <div class="telemetry-wave-wrap">
                    <canvas id="ppg-wave"></canvas>
                </div>
                <div class="telemetry-row" style="margin-bottom: 4px;">
                    <span>ROI Sensing</span>
                    <span class="val">ACTIVE</span>
                </div>
                <div class="telemetry-row">
                    <span>Quality</span>
                    <span class="val" id="telemetry-quality">98%</span>
                </div>
            </div>

            <!-- Right Telemetry Panel -->
            <div class="hud-card">
                <div class="card-title">Biometrics</div>
                
                <div class="metric-item">
                    <span class="metric-label">Heart Rate</span>
                    <div class="metric-val-wrap">
                        <span id="metric-hr">68</span>
                        <span class="unit">BPM</span>
                    </div>
                </div>

                <div class="metric-item">
                    <span class="metric-label">HRV RMSSD</span>
                    <div class="metric-val-wrap">
                        <span id="metric-hrv">52</span>
                        <span class="unit">ms</span>
                    </div>
                </div>

                <div class="metric-item">
                    <span class="metric-label">Respiratory</span>
                    <div class="metric-val-wrap">
                        <span id="metric-rr">14</span>
                        <span class="unit">BrPM</span>
                    </div>
                </div>

                <div class="metric-item">
                    <span class="metric-label">Stress Proxy</span>
                    <div class="metric-val-wrap">
                        <span id="metric-stress">25</span>
                        <span class="unit">/100</span>
                    </div>
                </div>
            </div>

        </div>

        <!-- Footer Guidance Banner -->
        <footer class="hud-footer">
            <div class="guidance-bar" id="guidance-text">正在讀取微血管血液容積波形 (rPPG)...</div>
        </footer>

    </div>

    <!-- 5. Core JS Libraries & Logic -->
    <!-- Load Three.js (r128) synchronously before our loader scripts execute -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" 
            integrity="sha384-CI3ELBVUz9XQO+97x6nwMDPosPR5XvsxW2ua7N1Xeygeh1IxtgqtCkGfQY9WWdHu" 
            crossorigin="anonymous"></script>

    <!-- Cross-protocol script loader to fetch stardust.js safely -->
    <script>
        (function() {
            var s = document.createElement('script');
            if (window.location.protocol === 'file:') {
                s.src = '../web/stardust.js'; // Relative path for local file protocol double-click
            } else {
                s.src = '/stardust.js';       // Absolute path for http local Vercel server
            }
            document.head.appendChild(s);
        })();
    </script>

    <!-- Scan Orchestrator & Telemetry Logic -->
    <script>
        (function() {
            'use strict';

            var TOTAL_DURATION = 8000; // ms: 8 seconds scan
            var startTime = null;
            var telemetryTimer = null;
            var guidanceTimer = null;
            var expressionTimer = null;
            var countdownInterval = null;
            
            // Audio engine mock to avoid exceptions
            var beep = function(freq, dur) {
                try {
                    var audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    var osc = audioCtx.createOscillator();
                    var gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
                    osc.start();
                    osc.stop(audioCtx.currentTime + dur);
                } catch(e) {}
            };

            // ─── Logo Splash Dismiss & Reveal ───
            setTimeout(function() {
                var splash = document.getElementById('brand-splash');
                var hud = document.getElementById('hud-layer');
                if (splash) splash.style.opacity = '0';
                if (hud) hud.style.opacity = '1';
                
                setTimeout(function() {
                    if (splash && splash.parentNode) {
                        splash.parentNode.removeChild(splash);
                    }
                    // Start scan orchestrator once splash is cleared
                    startScan();
                }, 800);
            }, 2400);

            // ─── Retro Canvas PPG Waveform ───
            var waveCanvas = document.getElementById('ppg-wave');
            var waveCtx = waveCanvas ? waveCanvas.getContext('2d') : null;
            var waveData = [];
            var waveMaxPoints = 80;
            var waveTime = 0;

            function resizeWaveCanvas() {
                if (!waveCanvas) return;
                var rect = waveCanvas.parentElement.getBoundingClientRect();
                waveCanvas.width = rect.width * (window.devicePixelRatio || 1);
                waveCanvas.height = rect.height * (window.devicePixelRatio || 1);
                if (waveCtx) {
                    waveCtx.scale(window.devicePixelRatio || 1, window.devicePixelRatio || 1);
                }
            }
            window.addEventListener('resize', resizeWaveCanvas);

            function getECGValue(t) {
                // Heartbeat PQRST cycle every ~0.88 seconds (68 BPM)
                var beatPeriod = 0.88;
                var progress = (t % beatPeriod) / beatPeriod;
                var val = 0;
                
                if (progress < 0.08) {
                    // P wave (gentle bump)
                    val = Math.sin(progress / 0.08 * Math.PI) * 0.12;
                } else if (progress >= 0.12 && progress < 0.20) {
                    // QRS complex (high sharp spikes)
                    var qrsProg = (progress - 0.12) / 0.08;
                    if (qrsProg < 0.2) {
                        val = -qrsProg / 0.2 * 0.25; // Q dip
                    } else if (qrsProg >= 0.2 && qrsProg < 0.6) {
                        val = -0.25 + (qrsProg - 0.2) / 0.4 * 1.35; // R peak
                    } else {
                        val = 1.1 - (qrsProg - 0.6) / 0.4 * 1.25; // S dip
                    }
                } else if (progress >= 0.24 && progress < 0.38) {
                    // T wave (rounded bump)
                    var tProg = (progress - 0.24) / 0.14;
                    val = -0.15 + Math.sin(tProg * Math.PI) * 0.38;
                } else {
                    // Resting baseline with tiny noise
                    val = Math.sin(t * 40) * 0.02;
                }
                return val;
            }

            function drawWave() {
                if (!waveCanvas || !waveCtx) return;
                var W = waveCanvas.width / (window.devicePixelRatio || 1);
                var H = waveCanvas.height / (window.devicePixelRatio || 1);
                
                waveTime += 0.016; // increment time assuming ~60fps
                
                var newVal = getECGValue(waveTime);
                // Convert value (-0.3 to 1.2) to screen coordinates
                var yCoord = H * 0.65 - newVal * H * 0.35;
                
                waveData.push(yCoord);
                if (waveData.length > waveMaxPoints) {
                    waveData.shift();
                }

                waveCtx.clearRect(0, 0, W, H);
                
                // Draw grid lines
                waveCtx.strokeStyle = 'rgba(0, 180, 216, 0.04)';
                waveCtx.lineWidth = 1;
                for(var x = 0; x < W; x += 15) {
                    waveCtx.beginPath();
                    waveCtx.moveTo(x, 0);
                    waveCtx.lineTo(x, H);
                    waveCtx.stroke();
                }
                for(var y = 0; y < H; y += 15) {
                    waveCtx.beginPath();
                    waveCtx.moveTo(0, y);
                    waveCtx.lineTo(W, y);
                    waveCtx.stroke();
                }

                // Draw wave line with glowing drop shadow
                waveCtx.strokeStyle = 'var(--primary-cyan)';
                waveCtx.lineWidth = 2;
                waveCtx.lineCap = 'round';
                waveCtx.lineJoin = 'round';
                waveCtx.shadowColor = 'rgba(0, 180, 216, 0.6)';
                waveCtx.shadowBlur = 8;
                
                waveCtx.beginPath();
                for (var i = 0; i < waveData.length; i++) {
                    var px = (i / (waveMaxPoints - 1)) * W;
                    var py = waveData[i];
                    if (i === 0) waveCtx.moveTo(px, py);
                    else waveCtx.lineTo(px, py);
                }
                waveCtx.stroke();
                
                // Reset shadow
                waveCtx.shadowBlur = 0;
                
                // Draw leading dot
                if (waveData.length > 0) {
                    var dotX = ((waveData.length - 1) / (waveMaxPoints - 1)) * W;
                    var dotY = waveData[waveData.length - 1];
                    waveCtx.beginPath();
                    waveCtx.arc(dotX, dotY, 3.5, 0, Math.PI * 2);
                    waveCtx.fillStyle = '#ffffff';
                    waveCtx.shadowColor = 'var(--primary-cyan)';
                    waveCtx.shadowBlur = 10;
                    waveCtx.fill();
                    waveCtx.shadowBlur = 0;
                }
                
                requestAnimationFrame(drawWave);
            }

            // ─── Scan Orchestration & HUD Telemetry ───
            function startScan() {
                resizeWaveCanvas();
                drawWave();
                startTime = Date.now();
                
                // Beep to signal start
                beep(620, 0.15);
                setTimeout(function() { beep(880, 0.22); }, 120);

                var progressRing = document.getElementById('progress-ring');
                var statusBadge = document.getElementById('badge-status');
                var countdownText = document.getElementById('countdown-text');
                
                var rMax = progressRing ? parseFloat(progressRing.getAttribute('r')) : 70;
                var circumference = 2 * Math.PI * rMax;
                if (progressRing) {
                    progressRing.style.strokeDasharray = circumference;
                    progressRing.style.strokeDashoffset = circumference;
                }

                // Countdown Timer (8s to 0s)
                var count = 8;
                countdownInterval = setInterval(function() {
                    count--;
                    if (countdownText) countdownText.textContent = Math.max(0, count);
                    
                    // Quick rhythmic pulse beep each second (heartbeat sync hint)
                    if (count > 0) {
                        beep(440, 0.04);
                    }
                }, 1000);

                // Telemetry value fluctuations (gives organic living feedback)
                telemetryTimer = setInterval(function() {
                    var hr = 66 + Math.round(Math.random() * 4); // 66-70
                    var hrv = 50 + Math.round(Math.random() * 4); // 50-54
                    var rr = 13 + (Math.random() > 0.7 ? 1 : 0); // 13-14
                    var stress = 24 + Math.round(Math.random() * 2); // 24-26
                    var quality = 97 + Math.round(Math.random() * 2); // 97-99%

                    setText('metric-hr', hr);
                    setText('metric-hrv', hrv);
                    setText('metric-rr', rr);
                    setText('metric-stress', stress);
                    setText('telemetry-quality', quality + '%');
                }, 800);

                // Sequential status messages (Guidance Bar)
                var guides = [
                    '正在感測微血管血液容積波形 (rPPG)...',
                    '正在鎖定主要面部特徵感測區域 (ROI)...',
                    '正在校準心血管自主神經系統 (ANS) 校正模型...',
                    '正在解構心率變異 (HRV) 頻譜特徵...',
                    '星塵靈魂同步場域分析與計算中...',
                    'Decision Edge Score 評估與加載中...'
                ];
                var guideIdx = 0;
                guidanceTimer = setInterval(function() {
                    guideIdx++;
                    if (guideIdx < guides.length) {
                        setText('guidance-text', guides[guideIdx]);
                    }
                }, 1400);

                // Orchestrated Three.js stardust pulsation sync
                var stardustT = 0;
                expressionTimer = setInterval(function() {
                    stardustT += 0.08;
                    if (window.TENKI_STARDUST && typeof window.TENKI_STARDUST.setExpression === 'function') {
                        // 心跳縮放波 (約以 1.25Hz / 75BPM 速度跳動)
                        var hrPulse = Math.max(0, Math.sin(stardustT * 6.28 * 1.25));
                        // 呼吸大收縮波 (以 0.24Hz 速度深呼吸)
                        var rrBreath = 0.8 + 0.25 * Math.sin(stardustT * 6.28 * 0.24);
                        
                        window.TENKI_STARDUST.setExpression({
                            mouthOpen: hrPulse * 0.35, // 心跳引發粒子小幅度急速向外收張
                            eyeOpen: rrBreath,          // 呼吸引發粒子大範圍流暢收縮
                            browTension: 0.5 + 0.15 * Math.sin(stardustT)
                        });
                    }
                }, 40); // 25fps updates

                // High accuracy progress ring ticking loop
                var tickRate = 30; // 30ms ticking
                var tickTimer = setInterval(function() {
                    var elapsed = Date.now() - startTime;
                    var pct = Math.min(1, elapsed / TOTAL_DURATION);
                    
                    // Render progress ring fill
                    if (progressRing) {
                        var offset = circumference * (1 - pct);
                        progressRing.style.strokeDashoffset = offset;
                    }

                    // Update status badge according to phase
                    if (pct < 0.20) {
                        setStatus('[ SEARCHING ]', 'searching');
                    } else if (pct >= 0.20 && pct < 0.50) {
                        setStatus('[ SIGNALS LOCKED ]', 'locked');
                    } else if (pct >= 0.50 && pct < 0.85) {
                        setStatus('[ BIOMETRIC SYNCING ]', 'syncing');
                    } else {
                        setStatus('[ COMPLETING ]', 'locked');
                    }

                    // Scan complete climax trigger
                    if (pct >= 1.0) {
                        clearInterval(tickTimer);
                        triggerClimax();
                    }
                }, tickRate);
            }

            function setStatus(text, className) {
                var badge = document.getElementById('badge-status');
                if (badge) {
                    badge.textContent = text;
                    badge.className = 'badge-status ' + className;
                }
            }

            function setText(id, text) {
                var el = document.getElementById(id);
                if (el) el.textContent = text;
            }

            // ─── Scan Climax Climax Flash & Redirect ───
            function triggerClimax() {
                // Clear timers
                if (telemetryTimer) clearInterval(telemetryTimer);
                if (guidanceTimer) clearInterval(guidanceTimer);
                if (expressionTimer) clearInterval(expressionTimer);
                if (countdownInterval) clearInterval(countdownInterval);

                // Play satisfying double sonar beep (complete confirmation)
                beep(880, 0.1);
                setTimeout(function() { beep(1320, 0.45); }, 80);

                var flash = document.getElementById('scan-flash');
                var hud = document.getElementById('hud-layer');
                var universe = document.getElementById('universe');

                if (flash) flash.style.opacity = '1';
                if (hud) hud.style.opacity = '0';
                if (universe) universe.style.filter = 'blur(10px) scale(1.1)';

                // Animate stardust dimming during burst
                if (window.TENKI_STARDUST && typeof window.TENKI_STARDUST.dim === 'function') {
                    window.TENKI_STARDUST.dim();
                }

                // Smoothly fade flash and stardust and redirect to scan result page
                setTimeout(function() {
                    if (flash) {
                        flash.style.transition = 'opacity 0.8s ease-in-out';
                        flash.style.opacity = '0';
                    }
                    if (universe) {
                        universe.style.transition = 'opacity 0.8s ease-in-out';
                        universe.style.opacity = '0';
                    }
                    
                    // Final redirect to the beautiful Scan Result Page
                    setTimeout(function() {
                        window.location.href = 'scan-result.html';
                    }, 800);

                }, 900); // Wait for burst visual to plateau before fading out
            }
        })();
    </script>
</body>
</html>
