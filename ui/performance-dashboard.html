<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TENKI PRO - 績效儀表板</title>
    <link rel="stylesheet" href="performance-dashboard.css">
</head>
<body>
    <div class="expectancy-dashboard">
        <header class="dashboard-header">
            <h1>📊 TENKI 績效報告</h1>
            <div class="period-selector">
                <button class="period-btn active" data-days="7">7 天</button>
                <button class="period-btn" data-days="30">30 天</button>
                <button class="period-btn" data-days="90">90 天</button>
                <button class="period-btn" data-days="0">全部</button>
            </div>
        </header>

        <!-- 總覽卡片 -->
        <div class="overview-cards">
            <div class="overview-card">
                <span class="overview-label">總交易數</span>
                <span class="overview-value" id="total-trades">—</span>
            </div>
            <div class="overview-card">
                <span class="overview-label">總損益</span>
                <span class="overview-value" id="total-pnl">—</span>
            </div>
            <div class="overview-card">
                <span class="overview-label">整體勝率</span>
                <span class="overview-value" id="overall-winrate">—</span>
            </div>
            <div class="overview-card">
                <span class="overview-label">最佳 TEI 區</span>
                <span class="overview-value" id="best-zone">—</span>
            </div>
        </div>

        <!-- TEI 層級卡片 -->
        <section class="tier-section">
            <h2>TEI 分層績效</h2>
            <div class="tier-cards" id="tier-cards">
                <!-- 動態填入 -->
            </div>
        </section>

        <!-- What-If 分析 -->
        <section class="what-if-section" id="what-if-section">
            <h2>✅ 反事實驗證</h2>
            <p class="what-if-desc">如果完全遵循 TENKI 建議 (只在 TEI ≥ <span id="threshold-value">70</span> 交易):</p>

            <div class="comparison">
                <div class="comparison-item actual">
                    <span class="comp-label">實際績效</span>
                    <span class="comp-value" id="actual-pnl">—</span>
                </div>
                <div class="arrow">→</div>
                <div class="comparison-item whatif">
                    <span class="comp-label">假設遵循</span>
                    <span class="comp-value" id="whatif-pnl">—</span>
                </div>
            </div>

            <div class="improvement-bar">
                改善幅度: <span class="improvement-value" id="improvement-pct">—</span>
            </div>

            <div class="threshold-slider">
                <label>門檻調整:</label>
                <input type="range" id="threshold-slider" min="30" max="85" value="70" step="5">
                <span id="slider-value">70</span>
            </div>
        </section>

        <!-- 期望值圖表 -->
        <section class="chart-section">
            <h2>期望值分布</h2>
            <div class="chart-container">
                <canvas id="expectancy-chart"></canvas>
            </div>
        </section>

        <!-- 統計顯著性 -->
        <section class="stats-section" id="stats-section">
            <h2>📐 統計顯著性</h2>
            <div class="stats-result" id="stats-result">
                <p>分析需要至少 20 筆交易數據</p>
            </div>
        </section>
    </div>

    <script src="performance-chart.js"></script>
</body>
</html>
