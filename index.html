<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TENKI v26.0 - Master Integration</title>
    
    <!-- 字體庫 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- 核心引擎 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    
    <!-- UI 庫 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --bg-deep: #030305;
            --plasma-cyan: #00F0FF; 
            --void-purple: #7000FF;
            
            /* Compliance State Colors */
            --state-stable: #00FF94;   /* 80-99 */
            --state-control: #FFD600;  /* 60-79 */
            --state-volatile: #FF8800; /* 40-59 */
            --state-risk: #FF0055;     /* 1-39 */
            
            --glass-bg: rgba(18, 18, 24, 0.90);
            --glass-border: rgba(255, 255, 255, 0.12);
            --card-radius: 24px;
        }

        body {
            background: var(--bg-deep);
            color: white;
            font-family: 'Space Mono', monospace;
            overflow: hidden;
            width: 100vw; height: 100dvh;
            margin: 0; padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .font-sans-bold { font-family: 'Inter', sans-serif; font-weight: 900; }
        .font-serif-human { font-family: 'Playfair Display', serif; }
        .font-mono-tech { font-family: 'JetBrains Mono', monospace; }

        /* 隱私層 & 背景層 */
        #input-video { position: fixed; top: -9999px; left: -9999px; opacity: 0; pointer-events: none; }
        #light-analysis-canvas { position: fixed; top: -9999px; left: -9999px; opacity: 0; pointer-events: none; }
        #rppg-canvas { position: fixed; top: -9999px; left: -9999px; opacity: 0; pointer-events: none; }
        
        #universe {
            position: absolute; inset: 0; z-index: 1;
            background: radial-gradient(circle at center, #0a0a10 0%, #000 100%);
            transition: opacity 1s ease, filter 1s ease;
        }
        #universe.dimmed { opacity: 0.2; filter: blur(20px); }

        /* HUD 層 */
        #hud-layer {
            position: absolute; inset: 0; z-index: 10;
            pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 24px; padding-bottom: calc(30px + env(safe-area-inset-bottom));
            transition: opacity 0.5s ease;
        }
        #hud-layer.hidden-ui { opacity: 0; pointer-events: none; }

        /* Environmental Sensors UI */
        .env-readout {
            font-size: 9px; letter-spacing: 1px;
            display: flex; flex-direction: column; align-items: flex-end; gap: 4px;
            margin-bottom: 8px; font-family: 'Space Mono', monospace;
        }
        .env-item { display: flex; align-items: center; gap: 6px; color: #666; transition: color 0.3s; }
        .env-item.good { color: var(--state-stable); }
        .env-item.warn { color: var(--state-volatile); }
        .env-bar { width: 30px; height: 3px; background: rgba(255,255,255,0.1); border-radius: 1px; overflow: hidden; }
        .env-fill { height: 100%; background: currentColor; transition: width 0.3s; }

        /* Fingerprint Scanner */
        .fingerprint-wrapper {
            position: relative; width: 110px; height: 110px;
            display: flex; justify-content: center; align-items: center;
            pointer-events: auto; cursor: pointer; border-radius: 50%;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .fingerprint-core {
            width: 80px; height: 80px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex; justify-content: center; align-items: center;
            backdrop-filter: blur(12px); position: relative; overflow: hidden;
            z-index: 20; box-shadow: 0 0 20px rgba(0,0,0,0.5);
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .fingerprint-icon { position: relative; z-index: 22; color: rgba(255,255,255,0.6); transition: all 0.3s ease; }
        .scan-beam {
            position: absolute; top: -100%; left: 0; width: 100%; height: 50%;
            background: linear-gradient(to bottom, transparent 0%, rgba(0, 240, 255, 0.4) 90%, rgba(255, 255, 255, 0.8) 100%);
            opacity: 0; pointer-events: none; z-index: 21;
        }
        .ripple-ring {
            position: absolute; top: 50%; left: 50%; width: 100%; height: 100%;
            border-radius: 50%; border: 1px solid var(--plasma-cyan);
            transform: translate(-50%, -50%) scale(0.8); opacity: 0; pointer-events: none; z-index: 1;
        }
        .progress-svg { position: absolute; top: -5px; left: -5px; width: 120px; height: 120px; transform: rotate(-90deg); z-index: 30; pointer-events: none; }
        .progress-circle {
            fill: none; stroke: var(--plasma-cyan); stroke-width: 3; stroke-linecap: round;
            stroke-dasharray: 339; stroke-dashoffset: 339; transition: stroke-dashoffset 0.05s linear;
            filter: drop-shadow(0 0 6px var(--plasma-cyan));
        }
        .fingerprint-wrapper.active { transform: scale(0.95); }
        .fingerprint-wrapper.active .fingerprint-core {
            border-color: rgba(0, 240, 255, 0.5); background: rgba(0, 10, 20, 0.9);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
        }
        .fingerprint-wrapper.active .fingerprint-icon { color: white; opacity: 1; animation: pulse-icon 1s infinite alternate; }
        .fingerprint-wrapper.active .scan-beam { opacity: 1; animation: beam-scan 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
        .fingerprint-wrapper.active .ripple-ring:nth-child(1) { animation: ripple-expand 1.5s linear infinite; animation-delay: 0s; }
        .fingerprint-wrapper.active .ripple-ring:nth-child(2) { animation: ripple-expand 1.5s linear infinite; animation-delay: 0.5s; }

        @keyframes beam-scan { 0% { top: -100%; opacity: 0; } 30% { opacity: 0.8; } 70% { opacity: 0.8; } 100% { top: 150%; opacity: 0; } }
        @keyframes ripple-expand { 0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.8; border-width: 2px; } 100% { transform: translate(-50%, -50%) scale(2.2); opacity: 0; border-width: 0px; } }
        @keyframes pulse-icon { 0% { opacity: 0.8; transform: scale(1); } 100% { opacity: 1; transform: scale(1.05); } }

        /* ========================================= */
        /* v26.0 MASTER DASHBOARD STYLES             */
        /* ========================================= */
        #dashboard-layer {
            position: absolute; inset: 0; z-index: 50; 
            background: transparent; display: flex; flex-direction: column; 
            /* 底部留白，防止被 Dock 擋住 Log */
            padding: 20px; padding-top: calc(50px + env(safe-area-inset-top));
            padding-bottom: 140px; 
            overflow-y: auto; opacity: 0; pointer-events: none; 
            transform: translateY(20px);
            transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        #dashboard-layer.show { opacity: 1; pointer-events: auto; transform: translateY(0); }

        .bento-card {
            background: var(--glass-bg); 
            border: 1px solid var(--glass-border);
            border-radius: var(--card-radius); padding: 16px;
            backdrop-filter: blur(40px); display: flex; flex-direction: column; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.5); position: relative; overflow: hidden;
        }

        /* 1. Orbit Ring */
        .orbit-container {
            width: 260px; height: 260px; position: relative;
            display: flex; justify-content: center; align-items: center;
            margin: 0 auto; cursor: pointer; -webkit-tap-highlight-color: transparent;
        }
        .orbit-data-center {
            position: absolute; z-index: 10;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; pointer-events: none;
        }
        .metallic-text {
            background: linear-gradient(180deg, #FFFFFF 20%, #A0A0A0 100%);
            -webkit-background-clip: text; background-clip: text; color: transparent;
            filter: drop-shadow(0 4px 10px rgba(255,255,255,0.2));
            letter-spacing: -6px; line-height: 1; font-family: 'Inter', sans-serif; font-weight: 900;
        }
        .ring-svg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            transform: rotate(-90deg); overflow: visible;
        }
        .ring-track { fill: none; stroke: rgba(255, 255, 255, 0.08); stroke-linecap: round; }
        .ring-value { fill: none; stroke-linecap: round; transition: stroke-dashoffset 1s cubic-bezier(0.2, 0.8, 0.2, 1); }
        .glow-outer { filter: drop-shadow(0 0 15px rgba(0, 240, 255, 0.4)); }
        .glow-inner { filter: drop-shadow(0 0 10px rgba(112, 0, 255, 0.4)); }

        /* 2. Top Integrity Bar */
        .integrity-track {
            width: 100%; height: 4px; background: rgba(255,255,255,0.1);
            border-radius: 2px; margin-top: 12px; position: relative; overflow: hidden;
        }
        .integrity-fill {
            position: absolute; left: 0; top: 0; height: 100%; width: 0%;
            background: linear-gradient(90deg, #00F0FF, #00FF94);
            box-shadow: 0 0 15px var(--plasma-cyan);
            transition: width 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        /* 閃光特效：當收集到有效心跳時 */
        .integrity-fill.beat-catch { filter: brightness(2.0); }

        /* 3. Scanning Overlay */
        .scanner-overlay {
            position: absolute; inset: 0; pointer-events: none; z-index: 10;
            background: linear-gradient(90deg, transparent 0%, rgba(0, 255, 148, 0.1) 50%, transparent 100%);
            width: 50%; transform: skewX(-20deg) translateX(-150%);
            animation: scan-pass 2s infinite linear;
        }
        @keyframes scan-pass { 0% { transform: translateX(-150%) skewX(-20deg); } 100% { transform: translateX(350%) skewX(-20deg); } }

        /* 4. Pulse Graph */
        .bio-graph-container {
            width: 100%; height: 50px; display: flex; align-items: flex-end; gap: 3px;
            position: relative; z-index: 5;
        }
        .bio-bar { 
            flex: 1; background: var(--state-stable); opacity: 0.8; border-radius: 2px; 
            transition: height 0.1s ease; 
        }

        /* 5. Spectrum & Radar */
        .ans-spectrum { width: 100%; height: 6px; background: #222; border-radius: 3px; display: flex; overflow: hidden; margin-top: 12px; }
        .ans-sns { background: var(--state-volatile); width: 10%; transition: width 0.5s; opacity: 0.9; }
        .ans-pns { background: var(--state-stable); width: 90%; transition: width 0.5s; opacity: 0.9; }

        .radar-container { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        .radar-svg { width: 90px; height: 90px; overflow: visible; }
        .radar-bg { fill: rgba(255,255,255,0.05); stroke: rgba(255,255,255,0.1); stroke-width: 1; }
        .radar-poly { fill: rgba(0, 240, 255, 0.15); stroke: #00F0FF; stroke-width: 2; filter: drop-shadow(0 0 5px rgba(0,240,255,0.5)); transition: all 0.5s ease; }

        /* Dock */
        .dock-container {
            position: fixed; bottom: 40px; left: 20px; right: 20px; height: 72px;
            background: rgba(20, 20, 30, 0.9); backdrop-filter: blur(30px);
            border: 1px solid rgba(255,255,255,0.15); border-radius: 40px;
            display: flex; align-items: center; justify-content: space-between; padding: 0 10px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8); z-index: 100;
        }
        .dock-btn { width: 56px; height: 56px; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; transition: all 0.2s; }
        .dock-main-action {
            flex: 1; height: 56px; margin: 0 8px;
            background: white;
            border-radius: 28px; display: flex; align-items: center; justify-content: center; gap: 8px;
            font-weight: 800; letter-spacing: 1px; color: black; font-size: 12px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            transition: transform 0.2s;
        }
        .dock-main-action:active { transform: scale(0.97); }

        #align-hint-capsule {
            position: absolute; top: 15%; left: 50%; 
            transform: translateX(-50%) translateY(-20px) scale(0.95);
            background: rgba(20, 20, 25, 0.75);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            padding: 10px 20px; border-radius: 99px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex; align-items: center; gap: 12px;
            opacity: 0; pointer-events: none; 
            transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            z-index: 100; overflow: hidden;
            box-shadow: 0 4px 24px rgba(0,0,0,0.4);
        }
        #align-hint-capsule.show { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); pointer-events: auto; }
        #align-hint-capsule.status-error { border-color: rgba(239, 68, 68, 0.5); box-shadow: 0 0 15px rgba(239, 68, 68, 0.2); }
        #align-hint-capsule.status-warn { border-color: rgba(234, 179, 8, 0.5); box-shadow: 0 0 15px rgba(234, 179, 8, 0.2); }
        #align-hint-capsule.status-good { border-color: rgba(35, 243, 212, 0.6); box-shadow: 0 0 20px rgba(35, 243, 212, 0.3); }

    </style>
</head>
<body>

    <video id="input-video" playsinline></video>
    <canvas id="light-analysis-canvas" width="50" height="50"></canvas>
    <canvas id="rppg-canvas" width="100" height="100"></canvas>
    
    <div id="universe"></div>

    <!-- HUD Layer -->
    <div id="hud-layer">
        <div id="align-hint-capsule">
            <div id="hint-icon-box" class="w-6 h-6 rounded-full flex items-center justify-center transition-colors duration-300">
                <i id="hint-icon" data-lucide="scan-face" class="w-4 h-4 text-white"></i>
            </div>
            <span id="hint-text" class="text-xs font-bold text-white tracking-wide uppercase transition-all duration-300">
                Searching...
            </span>
            <div class="shimmer-effect"></div>
        </div>

        <div class="flex justify-between items-start">
            <div>
                <div class="text-xl font-bold tracking-[6px] text-white font-mono-tech">TENKI</div>
                <div class="text-[8px] text-cyan-300 tracking-widest mt-1 font-mono-tech">SYSTEM_26.0</div>
            </div>
            
            <div class="text-right flex flex-col items-end">
                <div id="connection-status" class="text-[10px] text-gray-400 border border-white/10 px-2 py-1 rounded mb-2 font-mono-tech">
                    VISION ONLY
                </div>
                
                <div class="env-readout mb-2">
                    <div id="env-lux" class="env-item">
                        <span>LUX</span>
                        <div class="env-bar"><div id="env-lux-bar" class="env-fill" style="width: 0%"></div></div>
                    </div>
                    <div id="env-stab" class="env-item">
                        <span>STAB</span>
                        <div class="env-bar"><div id="env-stab-bar" class="env-fill" style="width: 100%"></div></div>
                    </div>
                </div>
                
                <!-- Audio Viz (保留原味) -->
                <div class="flex items-end h-4" id="audio-visualizer">
                    <div class="audio-bar"></div><div class="audio-bar"></div><div class="audio-bar"></div><div class="audio-bar"></div>
                </div>
            </div>
        </div>

        <div class="flex flex-col items-center pb-10">
            <div id="scan-trigger-wrapper" class="fingerprint-wrapper">
                <div class="ripple-ring"></div><div class="ripple-ring"></div>
                <svg class="progress-svg" viewBox="0 0 120 120">
                    <circle cx="60" cy="60" r="54" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="3"></circle>
                    <circle id="scan-progress-bar" class="progress-circle" cx="60" cy="60" r="54"></circle>
                </svg>
                <div class="fingerprint-core">
                    <div class="scan-beam"></div>
                    <i data-lucide="fingerprint" class="fingerprint-icon w-10 h-10"></i>
                </div>
            </div>
            <div id="instruction" class="mt-8 text-[10px] tracking-[3px] text-gray-400 font-mono-tech transition-all duration-300 font-bold">
                HOLD TO SYNC
            </div>
        </div>
    </div>

    <!-- Dashboard Layer (v26.0 Master) -->
    <div id="dashboard-layer">
        <!-- 1. Header (Integrity Bar) -->
        <div class="mb-4">
            <div class="flex justify-between items-end mb-1">
                <div>
                    <div class="text-[10px] text-cyan-400 font-bold uppercase tracking-[0.2em] mb-1">LIVE BIO-STREAM</div>
                    <div class="text-2xl font-bold text-white tracking-tight">Signal Analysis</div>
                </div>
                <div class="text-right">
                    <span id="confidence-val" class="text-2xl font-mono-tech text-white font-bold">0%</span>
                    <div class="text-[9px] text-gray-500 font-bold">TRUST LEVEL</div>
                </div>
            </div>
            <div class="integrity-track">
                <div id="resonance-fill" class="integrity-fill"></div>
            </div>
        </div>

        <!-- 2. TWIN ORBIT HERO (Restored) -->
        <div class="col-span-2 items-center mb-6">
            <div id="tei-orbit-container" class="orbit-container">
                <svg style="width:0;height:0;position:absolute;" aria-hidden="true">
                    <defs>
                        <linearGradient id="grad-score" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#FFFFFF" />
                            <stop offset="50%" stop-color="#00F0FF" />
                            <stop offset="100%" stop-color="#0080FF" />
                        </linearGradient>
                        <linearGradient id="grad-hrv" x1="100%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#D400FF" />
                            <stop offset="100%" stop-color="#7000FF" />
                        </linearGradient>
                    </defs>
                </svg>

                <svg class="ring-svg" viewBox="0 0 280 280">
                    <circle cx="140" cy="140" r="120" class="ring-track" stroke-width="12"></circle>
                    <circle id="ring-score" cx="140" cy="140" r="120" class="ring-value glow-outer" stroke="url(#grad-score)" stroke-width="12" stroke-dasharray="753" stroke-dashoffset="753"></circle>
                    <circle cx="140" cy="140" r="105" class="ring-track" stroke-width="10" stroke="rgba(255,255,255,0.1)" stroke-dasharray="2 8"></circle>
                    <circle id="ring-hrv" cx="140" cy="140" r="105" class="ring-value glow-inner" stroke="url(#grad-hrv)" stroke-width="4" stroke-linecap="round" stroke-dasharray="660" stroke-dashoffset="660"></circle>
                </svg>

                <div class="orbit-data-center">
                    <div class="text-[10px] font-mono-tech text-gray-500 tracking-[0.3em] mb-2 font-bold">TEI SCORE</div>
                    <div class="text-[110px] font-sans-bold metallic-text" id="dash-score">--</div>
                    <div class="text-[10px] font-mono-tech text-cyan-300 tracking-widest mt-2" id="dash-state">ACQUIRING...</div>
                </div>
            </div>
        </div>

        <!-- 3. Metrics Grid -->
        <div class="grid grid-cols-2 gap-3">
            
            <!-- Heart Rate (Scanner) -->
            <div class="col-span-2 bento-card py-5 relative">
                <div class="scanner-overlay"></div>
                <div class="flex justify-between items-start mb-4 relative z-10">
                    <div class="flex items-center gap-2">
                        <div class="w-2 h-2 rounded-full bg-rose-500 animate-pulse"></div>
                        <span class="text-[10px] text-gray-400 font-bold uppercase tracking-widest">LIVE PULSE</span>
                    </div>
                    <div class="flex items-baseline gap-1">
                        <span id="bpm-val" class="text-5xl font-bold text-white tracking-tighter tabular-nums">--</span>
                        <span class="text-xs text-gray-500 font-bold">BPM</span>
                    </div>
                </div>
                <div class="bio-graph-container" id="ppg-graph"></div>
            </div>

            <!-- Cardio Load -->
            <div class="col-span-2 bento-card">
                <div class="flex justify-between items-center mb-2">
                    <div class="text-[10px] text-gray-400 font-bold uppercase tracking-wider flex items-center gap-1">
                        <i data-lucide="activity" class="w-3 h-3 text-gray-500"></i> HRV Load
                    </div>
                    <div id="hrv-val" class="text-xl font-bold text-white font-mono-tech tabular-nums">--ms</div>
                </div>
                <div class="ans-spectrum">
                    <div id="ans-sns" class="ans-sns"></div>
                    <div id="ans-pns" class="ans-pns"></div>
                </div>
                <div class="flex justify-between text-[9px] font-bold text-gray-500 mt-2">
                    <span>STRESS</span>
                    <span>RECOVERY</span>
                </div>
            </div>

            <!-- Stability Radar -->
            <div class="bento-card justify-between h-40 relative">
                <div class="text-[10px] text-gray-400 font-bold uppercase z-10">Stability Axis</div>
                <div class="radar-container absolute inset-0 top-4">
                    <svg class="radar-svg" viewBox="0 0 100 100">
                        <polygon points="50,10 90,80 10,80" class="radar-bg" />
                        <polygon id="radar-poly" points="50,50 50,50 50,50" class="radar-poly" />
                    </svg>
                    <span class="absolute top-1 text-[8px] text-gray-500 font-bold">FOCUS</span>
                    <span class="absolute bottom-2 right-1 text-[8px] text-gray-500 font-bold">POS</span>
                    <span class="absolute bottom-2 left-1 text-[8px] text-gray-500 font-bold">VAR</span>
                </div>
            </div>

            <!-- System Log (Restored) -->
            <div class="bento-card h-40 justify-between">
                <div class="text-[9px] text-gray-500 font-mono-tech mb-2 tracking-widest">SYSTEM_LOG</div>
                <div class="text-xs text-white font-serif-human leading-tight opacity-90" id="dash-quote">
                    "Sensors calibrating. Please maintain stillness for signal lock."
                </div>
                <div class="text-[8px] text-gray-600 font-mono-tech mt-2" id="dash-date">DATE</div>
            </div>
        </div>

        <!-- Action Dock -->
        <div class="dock-container flex gap-3 px-4">
            <button class="w-12 h-12 flex items-center justify-center rounded-full bg-white/5 border border-white/10 text-white hover:bg-white/10 active:scale-95 transition-transform">
                <i data-lucide="share-2" class="w-5 h-5"></i>
            </button>
            <button id="dynamic-action-btn" class="dock-main-action" onclick="app.reset()" disabled>
                <i id="btn-icon" data-lucide="loader" class="w-4 h-4 animate-spin"></i>
                <span id="btn-text">PROCESSING...</span>
            </button>
            <button class="w-12 h-12 flex items-center justify-center rounded-full bg-white/5 border border-white/10 text-white hover:bg-white/10">
                <i data-lucide="settings" class="w-5 h-5"></i>
            </button>
        </div>
    </div>

    <!-- WORKER (Arrhythmia Safe + Dynamic Accumulation) -->
    <script id="worker-script" type="javascript/worker">
        let buffer = []; const BUFFER_SIZE = 240; let hrvHistory = [];
        self.onmessage = function(e) {
            const { val, type } = e.data;
            if (type === 'reset') { buffer = []; hrvHistory = []; return; }
            buffer.push(val); if(buffer.length > BUFFER_SIZE) buffer.shift();
            if(buffer.length < 60) { self.postMessage({ status: 'buffering' }); return; }

            const detrended = []; const windowSize = 15;
            for(let i=0; i<buffer.length; i++) {
                let sum=0, count=0;
                for(let j=Math.max(0, i-windowSize); j<Math.min(buffer.length, i+windowSize); j++) { sum+=buffer[j]; count++; }
                detrended.push(buffer[i]-(sum/count));
            }

            let min=0, max=0; detrended.forEach(v=>{ if(v<min)min=v; if(v>max)max=v; });
            const threshold = max*0.55; const peaks = []; let newBeat = false;
            for(let i=2; i<detrended.length-2; i++) {
                if(detrended[i]>threshold && detrended[i]>detrended[i-1] && detrended[i]>detrended[i+1]) {
                    if(peaks.length===0 || (i-peaks[peaks.length-1])>9) {
                        peaks.push(i); 
                        // Check if beat is recent (dynamic accumulation trigger)
                        if(i > buffer.length-5) newBeat = true; 
                    }
                }
            }

            let bpm=0, finalHrv=0;
            if(peaks.length > 4) {
                const rr=[]; for(let i=1; i<peaks.length; i++) { let d=peaks[i]-peaks[i-1]; if(d>8 && d<50) rr.push(d); }
                if(rr.length>3) {
                    const sorted=[...rr].sort((a,b)=>a-b); const med=sorted[Math.floor(sorted.length/2)];
                    const valid=rr.filter(r=>Math.abs(r-med)<(med*0.25)); const calc=valid.length>2?valid:rr;
                    
                    let td=0; calc.forEach(d=>td+=d); bpm=Math.round(60/((td/calc.length)/30));
                    let sq=0; for(let i=0; i<calc.length-1; i++) { let d=(calc[i]*33.3)-(calc[i+1]*33.3); sq+=d*d; }
                    
                    const rawH=Math.sqrt(sq/(calc.length-1));
                    hrvHistory.push(rawH); if(hrvHistory.length>5) hrvHistory.shift();
                    let hSum=0; hrvHistory.forEach(h=>hSum+=h); finalHrv=Math.round(hSum/hrvHistory.length);
                }
            }
            const lastVal = detrended[detrended.length-1]; const range=max-min||1;
            const gVal = Math.max(0, Math.min(100, ((lastVal-min)/range)*100));
            
            self.postMessage({ status: 'active', bpm: Math.min(180, Math.max(40, bpm)), hrv: Math.min(120, finalHrv), raw: gVal, newBeat: newBeat });
        };
    </script>

    <!-- MAIN APP LOGIC -->
    <script>
        lucide.createIcons();
        const workerBlob = new Blob([document.getElementById('worker-script').textContent], {type: "text/javascript"});
        const worker = new Worker(window.URL.createObjectURL(workerBlob));

        const app = {
            config: { particleCount: 8000, particleSize: 0.08 },
            state: { 
                isFaceDetected: false, isScanning: false, isDeepScanning: false, isSensorActive: false,
                mouthOpen: 0, headRot: {x:0, y:0}, audioData: 0,
                validBeatsCount: 0, targetBeats: 25, // 25 clean beats to finish
                bpm: 0, hrv: 0, graphData: new Array(40).fill(50), 
                envLux: 0, deviceMotion: 0
            },
            audioCtx: null, analyser: null, stream: null, lightCtx: null,
            timers: { scan: null },

            init: function() {
                this.initThree();
                this.initEvents();
                this.initEnvironment();
                this.initWorker();
                const container = document.getElementById('ppg-graph');
                for(let i=0; i<40; i++) { const d=document.createElement('div'); d.className='bio-bar'; d.style.height='10%'; container.appendChild(d); }
                const d = new Date();
                document.getElementById('dash-date').innerText = d.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'}).toUpperCase();
            },

            // --- Three.js & Visuals (Preserved) ---
            initThree: function() {
                const container = document.getElementById('universe');
                this.scene = new THREE.Scene();
                this.camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
                this.camera.position.z = 5;
                this.renderer = new THREE.WebGLRenderer({ alpha: true, antialias: false });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                container.appendChild(this.renderer.domElement);
                const geometry = new THREE.BufferGeometry();
                const positions = new Float32Array(this.config.particleCount * 3);
                for (let i = 0; i < this.config.particleCount; i++) {
                    const y = 1 - (i / (this.config.particleCount - 1)) * 2;
                    const r = Math.sqrt(1 - y * y) * 2.5;
                    const theta = Math.PI * (3. - Math.sqrt(5.)) * i;
                    positions[i*3] = Math.cos(theta)*r; positions[i*3+1] = y*2.5; positions[i*3+2] = Math.sin(theta)*r;
                }
                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                const mat = new THREE.PointsMaterial({ size: this.config.particleSize, color: 0x00F0FF, transparent: true, opacity: 0.8 });
                this.cloud = new THREE.Points(geometry, mat);
                this.scene.add(this.cloud);
                this.animate();
            },
            animate: function() {
                requestAnimationFrame(() => this.animate());
                this.updateAudio(); this.updateEnvironment();
                this.cloud.rotation.y += 0.002;
                this.renderer.render(this.scene, this.camera);
            },

            // --- Sensors ---
            initEnvironment: function() {
                const c = document.getElementById('light-analysis-canvas');
                if(c) this.lightCtx = c.getContext('2d', { willReadFrequently: true });
                window.addEventListener('devicemotion', (e) => {
                    if (e.accelerationIncludingGravity) {
                        const { x, y, z } = e.accelerationIncludingGravity;
                        this.state.deviceMotion = Math.abs(Math.sqrt(x*x + y*y + z*z) - 9.8) * 0.1;
                    }
                });
            },
            updateEnvironment: function() {
                if(!this.state.isSensorActive) return;
                // Lux calculation
                if (this.lightCtx && document.getElementById('input-video').readyState === 4 && Math.random()>0.9) {
                    const v = document.getElementById('input-video');
                    this.lightCtx.drawImage(v, 0, 0, 50, 50);
                    const data = this.lightCtx.getImageData(0,0,50,50).data;
                    let sum = 0; for(let x=0; x<data.length; x+=4) sum += (data[x]+data[x+1]+data[x+2])/3;
                    this.state.envLux = Math.min(100, (sum/2500/200)*100);
                }
                const stab = Math.max(0, 100 - (this.state.deviceMotion*100));
                // Update HUD bars if visible
                const stabBar = document.getElementById('env-stab-bar'); if(stabBar) stabBar.style.width = stab + '%';
            },
            updateAudio: function() {
                if (!this.analyser) { 
                    this.state.audioData = 30 + Math.sin(Date.now()*0.001)*10; 
                    return; 
                }
                this.analyser.getByteFrequencyData(this.dataArray);
                let sum = 0; for(let i=0; i<this.dataArray.length; i++) sum+=this.dataArray[i];
                this.state.audioData = sum / this.dataArray.length;
            },

            startSensors: async function() {
                try {
                    this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    this.analyser = this.audioCtx.createAnalyser();
                    this.analyser.fftSize = 64; this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);
                    
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: { width: 320, height: 240, frameRate: 30 } });
                    const source = this.audioCtx.createMediaStreamSource(stream);
                    source.connect(this.analyser);
                    
                    const video = document.getElementById('input-video');
                    video.srcObject = stream;
                    await video.play();
                    this.stream = stream;

                    // Initialize Face Mesh
                    const faceMesh = new FaceMesh({locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`});
                    faceMesh.setOptions({maxNumFaces: 1, minDetectionConfidence: 0.5});
                    faceMesh.onResults((res) => {
                        if (res.multiFaceLandmarks && res.multiFaceLandmarks.length > 0) {
                            this.state.isFaceDetected = true;
                            const lm = res.multiFaceLandmarks[0];
                            this.state.headRot.x = (lm[1].x - 0.5); 
                            this.state.headRot.y = (lm[1].y - 0.5);
                            
                            // Align Capsule
                            if(!this.state.isScanning && !this.state.isDeepScanning) {
                                const align = document.getElementById('align-hint-capsule');
                                if (Math.abs(lm[1].x - 0.5) > 0.1) {
                                    align.classList.add('show', 'status-warn');
                                    document.getElementById('hint-text').innerText = "CENTER FACE";
                                } else {
                                    align.classList.add('show', 'status-good');
                                    document.getElementById('hint-text').innerText = "READY";
                                }
                            }

                            // rPPG Extract
                            if (this.state.isDeepScanning) {
                                const ctx = document.getElementById('rppg-canvas').getContext('2d', {willReadFrequently:true});
                                const fx = Math.floor(lm[10].x * video.videoWidth);
                                const fy = Math.floor(lm[10].y * video.videoHeight);
                                ctx.drawImage(video, fx-5, fy+5, 10, 10, 0, 0, 10, 10);
                                const data = ctx.getImageData(0,0,10,10).data;
                                let gSum = 0; for(let i=0; i<data.length; i+=4) gSum+=data[i+1];
                                worker.postMessage({ type: 'data', val: gSum/25 });
                            }
                        }
                    });
                    
                    const camera = new Camera(video, { onFrame: async () => { await faceMesh.send({image: video}); }, width: 320, height: 240 });
                    camera.start();
                    this.state.isSensorActive = true;
                    document.getElementById('instruction').innerText = "HOLD 2S TO SYNC";
                } catch (e) {
                    console.error(e);
                    document.getElementById('instruction').innerText = "CAMERA ERROR";
                }
            },

            // --- Worker Handling (Dynamic Accumulation) ---
            initWorker: function() {
                worker.onmessage = (e) => {
                    if (!this.state.isDeepScanning) return;
                    const { status, bpm, hrv, raw, newBeat } = e.data;
                    
                    if (status === 'active') {
                        // Dynamic Accumulation Logic
                        if (newBeat && bpm > 40 && bpm < 150) {
                            this.state.validBeatsCount++;
                            const progress = Math.min(100, (this.state.validBeatsCount / this.state.targetBeats) * 100);
                            
                            // Visual Feedback
                            document.getElementById('confidence-val').innerText = Math.floor(progress) + "%";
                            const fill = document.getElementById('resonance-fill');
                            fill.style.width = progress + "%";
                            fill.classList.add('beat-catch');
                            setTimeout(()=>fill.classList.remove('beat-catch'), 100);

                            if(this.state.validBeatsCount >= this.state.targetBeats) this.finalizeSession();
                        }

                        // Data Update
                        if (bpm > 40) {
                            this.state.bpm += (bpm - this.state.bpm) * 0.1;
                            document.getElementById('bpm-val').innerText = Math.round(this.state.bpm);
                        }
                        if (hrv > 0) {
                            this.state.hrv = hrv;
                            document.getElementById('hrv-val').innerText = hrv + "ms";
                            // Spectrum
                            const rec = Math.min(100, (hrv/120)*100);
                            document.getElementById('ans-pns').style.width = rec + '%';
                            document.getElementById('ans-sns').style.width = (100-rec) + '%';
                        }

                        // Live Graph
                        this.state.graphData.shift(); this.state.graphData.push(raw);
                        const bars = document.querySelectorAll('.bio-bar');
                        bars.forEach((b, i) => { 
                            b.style.height = this.state.graphData[i] + '%'; 
                            b.style.opacity = this.state.graphData[i]>60?1:0.4; 
                        });
                    }
                };
            },

            // --- Interaction ---
            initEvents: function() {
                const btn = document.getElementById('scan-trigger-wrapper');
                const ring = document.getElementById('scan-progress-bar');
                
                const start = (e) => {
                    e.preventDefault();
                    if(!this.state.isSensorActive) { this.startSensors(); return; }
                    this.state.isScanning = true;
                    btn.classList.add('active');
                    document.getElementById('instruction').innerText = "CONNECTING...";
                    if(navigator.vibrate) navigator.vibrate(50);
                    
                    let p = 0;
                    this.timers.scan = setInterval(() => {
                        p += 2; ring.style.strokeDashoffset = 339 - ((p/100)*339);
                        if (p >= 100) { clearInterval(this.timers.scan); this.transitionToDashboard(); }
                    }, 40);
                };
                const end = () => {
                    if(this.state.isScanning) {
                        this.state.isScanning = false; clearInterval(this.timers.scan);
                        btn.classList.remove('active'); ring.style.strokeDashoffset = 339;
                        document.getElementById('instruction').innerText = "HOLD 2S TO SYNC";
                    }
                };
                btn.addEventListener('mousedown', start); btn.addEventListener('touchstart', start);
                window.addEventListener('mouseup', end); window.addEventListener('touchend', end);
            },

            transitionToDashboard: function() {
                if(navigator.vibrate) navigator.vibrate([50, 50]);
                document.getElementById('hud-layer').classList.add('hidden-ui');
                document.getElementById('universe').classList.add('dimmed');
                document.getElementById('align-hint-capsule').classList.remove('show');
                
                setTimeout(() => {
                    document.getElementById('dashboard-layer').classList.add('show');
                    // Start Deep Scan Logic
                    this.state.isDeepScanning = true;
                    this.state.validBeatsCount = 0;
                    worker.postMessage({ type: 'reset' });
                }, 400);
            },

            finalizeSession: function() {
                this.state.isDeepScanning = false;
                if(navigator.vibrate) navigator.vibrate([100, 50, 100]);
                
                // Final Score Calc (Hybrid Logic)
                const hrvScore = Math.min(100, (this.state.hrv / 100) * 100);
                const stabilityScore = Math.max(0, 100 - (this.state.deviceMotion * 200)); // motion penalty
                const tei = Math.floor((hrvScore * 0.6) + (stabilityScore * 0.4));
                
                // Update UI for Final State
                document.getElementById('dash-score').innerText = tei;
                document.getElementById('scan-status').innerText = "COMPLETE";
                document.getElementById('live-dot').classList.remove('animate-pulse');
                document.getElementById('confidence-val').innerText = "100%";
                document.getElementById('resonance-fill').style.background = "#fff";
                document.getElementById('dash-quote').innerText = "\"Data Integrity verified. Ready for decision flow.\"";

                // Update Rings
                const cScore = 753; document.getElementById('ring-score').style.strokeDashoffset = cScore - ((tei/100)*cScore);
                const cHrv = 660; document.getElementById('ring-hrv').style.strokeDashoffset = 660 - ((this.state.hrv/150)*660);

                // Compliance Action Button
                const btn = document.getElementById('dynamic-action-btn');
                const btnText = document.getElementById('btn-text');
                const btnIcon = document.getElementById('btn-icon');
                btn.disabled = false; btnIcon.classList.remove('animate-spin');
                const phraseEl = document.getElementById('dash-state');

                if (tei >= 80) {
                    phraseEl.innerText = "Status Stable"; phraseEl.style.color = "var(--state-stable)";
                    btn.classList.add('bg-[#00FF94]', 'text-black', 'shadow-[#00FF94]/30');
                    btnText.innerText = "DECISION FLOW READY";
                    btnIcon.setAttribute('data-lucide', 'arrow-right-circle');
                } else if (tei >= 60) {
                    phraseEl.innerText = "Status Controllable"; phraseEl.style.color = "var(--state-control)";
                    btn.classList.add('bg-[#FFD600]', 'text-black', 'shadow-[#FFD600]/30');
                    btnText.innerText = "TIMED MODE ACTIVE";
                    btnIcon.setAttribute('data-lucide', 'timer');
                } else {
                    phraseEl.innerText = "Risk Elevated"; phraseEl.style.color = "var(--state-risk)";
                    btn.classList.add('bg-[#FF0055]', 'text-white', 'shadow-[#FF0055]/30');
                    btnText.innerText = "FUNCTION LIMITED";
                    btnIcon.setAttribute('data-lucide', 'shield-ban');
                }
                lucide.createIcons();
            },

            reset: function() { location.reload(); }
        };

        window.onload = () => app.init();
        window.onresize = () => {
            app.camera.aspect = window.innerWidth / window.innerHeight;
            app.camera.updateProjectionMatrix();
            app.renderer.setSize(window.innerWidth, window.innerHeight);
        };
    </script>
