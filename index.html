<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>TENKI v50.1 - 階段式無縫升級</title>

  <!-- 字體庫 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />

  <!-- Core -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

  <!-- UI -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg-deep: #050510;
      --plasma-cyan: #00f0ff;
      --void-purple: #7000ff;
      --alert-orange: #ff5500;
      --matrix-green: #00ff94;

      --zone-peak: #ffb020;
      --zone-optimal: #00f0ff;
      --zone-neutral: #b5b5b5;
      --zone-degraded: #5a00ff;

      --glass-bg: rgba(15, 15, 20, 0.92);
      --glass-border: rgba(255, 255, 255, 0.12);
    }

    body {
      background: var(--bg-deep);
      color: white;
      font-family: 'Space Mono', monospace;
      overflow: hidden;
      width: 100vw;
      height: 100dvh;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .font-sans-bold { font-family: 'Inter', sans-serif; font-weight: 900; }
    .font-serif-human { font-family: 'Playfair Display', serif; }
    .font-mono-tech { font-family: 'JetBrains Mono', monospace; }

    #input-video { position: fixed; top: -9999px; left: -9999px; opacity: 0; pointer-events: none; }

    #universe {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: radial-gradient(circle at center, #111 0%, #000 100%);
      transition: opacity 1s ease;
    }

    #hud-layer {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
      padding-bottom: calc(30px + env(safe-area-inset-bottom));
    }

    .fingerprint-wrapper {
      position: relative;
      width: 110px;
      height: 110px;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: auto;
      cursor: pointer;
      border-radius: 50%;
    }
    .fingerprint-core {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(10, 10, 15, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(12px);
      position: relative;
      overflow: hidden;
      z-index: 20;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }
    .fingerprint-icon { position: relative; z-index: 22; color: rgba(255,255,255,0.6); }
    
    .progress-svg { position: absolute; top: -5px; left: -5px; width: 120px; height: 120px; transform: rotate(-90deg); z-index: 30; pointer-events: none; }
    .progress-circle {
      fill: none;
      stroke: var(--plasma-cyan);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 339;
      stroke-dashoffset: 339;
      transition: stroke-dashoffset 0.05s linear;
      filter: drop-shadow(0 0 6px var(--plasma-cyan));
    }
    
    .fingerprint-wrapper.active .fingerprint-core {
      border-color: rgba(0, 240, 255, 0.5);
      background: rgba(0, 10, 20, 0.9);
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
    }
    .fingerprint-wrapper.active .fingerprint-icon {
      color: white;
      filter: drop-shadow(0 0 8px var(--plasma-cyan));
    }

    #dashboard-layer {
      position: absolute;
      inset: 0;
      z-index: 50;
      background: transparent;
      display: flex;
      flex-direction: column;
      padding: 24px 20px 30px 20px;
      overflow-y: auto;
      opacity: 0;
      pointer-events: none;
      transform: translateY(20px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }
    #dashboard-layer.show { opacity: 1; pointer-events: auto; transform: translateY(0); }

    .bento-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      padding: 16px;
      backdrop-filter: blur(40px);
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      min-height: 168px;
    }

    .integrity-track { width: 100%; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; margin-top: 8px; overflow: hidden; }
    .integrity-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00f0ff, #00ff94);
      transition: width 0.3s ease;
    }
  </style>
</head>
<body>
  <video id="input-video" playsinline></video>
  <div id="universe"></div>

  <!-- HUD Layer -->
  <div id="hud-layer">
    <div class="flex justify-between items-start">
      <div>
        <div class="text-xl font-bold tracking-[6px] text-white font-mono-tech">TENKI</div>
        <div class="text-[8px] text-cyan-300 tracking-widest mt-1 font-mono-tech">v50.1_階段式升級</div>
      </div>
      <div class="text-right">
        <div class="text-[10px] text-gray-300 font-mono-tech">15秒出結果</div>
      </div>
    </div>

    <div class="flex flex-col items-center pb-10">
      <div id="scan-trigger-wrapper" class="fingerprint-wrapper">
        <svg class="progress-svg" viewBox="0 0 120 120">
          <circle cx="60" cy="60" r="54" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="3"></circle>
          <circle id="scan-progress-bar" class="progress-circle" cx="60" cy="60" r="54"></circle>
        </svg>
        <div class="fingerprint-core">
          <i data-lucide="fingerprint" class="fingerprint-icon w-10 h-10"></i>
        </div>
      </div>
      <div id="instruction" class="mt-8 text-[10px] tracking-[3px] text-gray-400 font-mono-tech font-bold">按住開始掃描</div>
      <div id="phase-indicator" class="mt-2 text-[9px] text-cyan-400 font-mono-tech tracking-widest opacity-0">階段 1/4 • 基礎採樣</div>
    </div>
  </div>

  <!-- Dashboard -->
  <div id="dashboard-layer">
    <div class="mb-6">
      <div class="flex justify-between items-end mb-1">
        <div>
          <div class="text-[10px] text-cyan-400 font-bold uppercase tracking-[0.2em] mb-1">TEI SCORE</div>
          <div class="text-2xl font-bold text-white">階段式分析</div>
        </div>
        <div class="text-right">
          <span id="confidence-val" class="text-2xl font-mono-tech text-white font-bold">0%</span>
          <div class="text-[9px] text-gray-500 font-bold">信任度</div>
        </div>
      </div>
      <div class="integrity-track"><div id="resonance-fill" class="integrity-fill"></div></div>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <!-- TEI Score -->
      <div class="bento-card bg-black/40 border-white/20 justify-center items-center">
        <div class="text-[10px] font-mono-tech text-gray-500 tracking-[0.3em] mb-1 font-bold">TEI SCORE</div>
        <div class="text-[78px] font-sans-bold leading-none" id="dash-score">00</div>
        <div class="text-[10px] font-mono-tech text-cyan-300 tracking-widest mt-2" id="dash-label">等待掃描</div>
      </div>

      <!-- Zone -->
      <div class="bento-card justify-between">
        <div class="text-[10px] text-gray-400 font-bold uppercase">狀態</div>
        <div class="mt-2">
          <div class="text-2xl font-serif-human" id="dash-state">中立區</div>
        </div>
        <div class="text-[10px] text-white/50 font-mono-tech" id="zone-guidance">等待15秒基礎結果</div>
      </div>

      <!-- Heart Rate -->
      <div class="bento-card justify-between">
        <span class="text-[10px] text-gray-400 font-bold uppercase">心率</span>
        <div class="mt-2">
          <span id="bpm-val" class="text-4xl font-bold text-white">--</span>
          <span class="text-xs text-gray-500 font-bold">BPM</span>
        </div>
      </div>

      <!-- HRV -->
      <div class="bento-card justify-between">
        <span class="text-[10px] text-gray-400 font-bold uppercase">HRV</span>
        <div class="mt-2">
          <span id="hrv-val" class="text-4xl font-bold text-white">--</span>
          <span class="text-xs text-gray-500 font-bold">ms</span>
        </div>
      </div>

      <!-- Progress -->
      <div class="bento-card col-span-2">
        <div class="text-[10px] text-gray-400 font-bold uppercase mb-3">掃描進度</div>
        <div id="progress-stages" class="flex gap-2">
          <div class="stage-box flex-1 h-12 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center">
            <div class="text-[9px] text-white/60 font-mono-tech">階段1<br>15秒</div>
          </div>
          <div class="stage-box flex-1 h-12 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center">
            <div class="text-[9px] text-white/60 font-mono-tech">階段2<br>30秒</div>
          </div>
          <div class="stage-box flex-1 h-12 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center">
            <div class="text-[9px] text-white/60 font-mono-tech">階段3<br>45秒</div>
          </div>
          <div class="stage-box flex-1 h-12 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center">
            <div class="text-[9px] text-white/60 font-mono-tech">階段4<br>60秒</div>
          </div>
        </div>
        <div class="text-[10px] text-white/50 font-mono-tech mt-3" id="scan-hint">15秒出初步結果，繼續持有提升精準度</div>
      </div>

      <!-- System Log -->
      <div class="bento-card col-span-2 bg-black/50">
        <div class="text-xs text-cyan-300 font-mono-tech tracking-widest">系統日誌</div>
        <div class="text-[15px] text-white font-serif-human leading-tight mt-3" id="dash-quote">"階段式無縫升級就緒。15秒快速反饋 + 漸進精準。"</div>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();

    // 階段式升級引擎
    const PhaseEngine = {
      phases: [
        { duration: 15000, confidence: 15, label: '階段1 • 基礎採樣', resultReady: true },
        { duration: 30000, confidence: 30, label: '階段2 • 信號增強', resultReady: false },
        { duration: 45000, confidence: 60, label: '階段3 • 深度分析', resultReady: false },
        { duration: 60000, confidence: 90, label: '階段4 • 完整掃描', resultReady: false }
      ],
      state: {
        isScanning: false,
        startTime: 0,
        currentPhase: 0,
        baseScore: null,
        baseHR: null,
        baseHRV: null
      },

      start() {
        this.state.isScanning = true;
        this.state.startTime = performance.now();
        this.state.currentPhase = 0;
        this.state.baseScore = null;
        this.state.baseHR = null;
        this.state.baseHRV = null;

        document.getElementById('scan-trigger-wrapper').classList.add('active');
        document.getElementById('instruction').innerText = '掃描中...';
        document.getElementById('phase-indicator').style.opacity = '1';
        
        this.updatePhaseUI(0);
        this.tick();
      },

      stop() {
        this.state.isScanning = false;
        document.getElementById('scan-trigger-wrapper').classList.remove('active');
        document.getElementById('instruction').innerText = '按住開始掃描';
        document.getElementById('phase-indicator').style.opacity = '0';
        this.resetProgress();
      },

      tick() {
        if (!this.state.isScanning) return;

        const elapsed = performance.now() - this.state.startTime;
        const currentPhase = this.phases.findIndex(p => elapsed < p.duration);
        const phaseIdx = currentPhase === -1 ? this.phases.length - 1 : currentPhase;

        if (phaseIdx !== this.state.currentPhase) {
          this.state.currentPhase = phaseIdx;
          this.updatePhaseUI(phaseIdx);
        }

        const phase = this.phases[phaseIdx];
        const progress = Math.min(1, elapsed / phase.duration);
        this.updateProgressBar(progress);

        // 模擬生理數據
        const hr = 70 + Math.sin(elapsed * 0.002) * 8 + (Math.random() - 0.5) * 2;
        const hrv = 55 + Math.sin(elapsed * 0.0013) * 10 + (Math.random() - 0.5) * 3;

        document.getElementById('bpm-val').innerText = Math.round(hr);
        document.getElementById('hrv-val').innerText = Math.round(hrv);

        // 15秒出基礎結果
        if (elapsed >= 15000 && this.state.baseScore === null) {
          this.state.baseHR = hr;
          this.state.baseHRV = hrv;
          this.state.baseScore = this.computeTEI(hr, hrv);
          this.showInitialResult();
        }

        // 後續階段：微調分數 + 提升信任度
        if (this.state.baseScore !== null) {
          const smoothing = (Math.random() - 0.5) * 2; // ±2分微調
          const currentScore = Math.max(1, Math.min(99, this.state.baseScore + smoothing));
          const currentConf = Math.round(phase.confidence);

          document.getElementById('dash-score').innerText = String(Math.round(currentScore)).padStart(2, '0');
          document.getElementById('confidence-val').innerText = currentConf + '%';
          document.getElementById('resonance-fill').style.width = currentConf + '%';

          this.updateZone(currentScore);
        }

        document.getElementById('phase-indicator').innerText = phase.label;

        requestAnimationFrame(() => this.tick());
      },

      computeTEI(hr, hrv) {
        const hrvN = Math.max(0, Math.min(1, (hrv - 5) / (140 - 5)));
        const hrN = Math.max(0, Math.min(1, 1 - ((hr - 35) / (110 - 35))));
        return Math.round((hrvN * 0.7 + hrN * 0.3) * 100);
      },

      showInitialResult() {
        document.getElementById('dashboard-layer').classList.add('show');
        document.getElementById('dash-label').innerText = '繼續持有提升精準度';
        document.getElementById('scan-hint').innerText = '✅ 基礎結果已生成！繼續持有提升信任度至90%';
        document.getElementById('dash-quote').innerText = '"15秒基礎分析完成。繼續掃描以提升信任度。"';
        
        if (navigator.vibrate) navigator.vibrate([20, 10, 20]);
      },

      updatePhaseUI(phaseIdx) {
        const stages = document.querySelectorAll('.stage-box');
        stages.forEach((box, i) => {
          if (i < phaseIdx) {
            box.style.background = 'rgba(0, 240, 255, 0.15)';
            box.style.borderColor = 'rgba(0, 240, 255, 0.4)';
          } else if (i === phaseIdx) {
            box.style.background = 'rgba(0, 240, 255, 0.25)';
            box.style.borderColor = 'rgba(0, 240, 255, 0.6)';
          } else {
            box.style.background = 'rgba(255, 255, 255, 0.05)';
            box.style.borderColor = 'rgba(255, 255, 255, 0.1)';
          }
        });
      },

      updateProgressBar(progress) {
        const circle = document.getElementById('scan-progress-bar');
        const circumference = 339;
        const offset = circumference * (1 - progress);
        circle.style.strokeDashoffset = offset;
      },

      resetProgress() {
        document.getElementById('scan-progress-bar').style.strokeDashoffset = 339;
        const stages = document.querySelectorAll('.stage-box');
        stages.forEach(box => {
          box.style.background = 'rgba(255, 255, 255, 0.05)';
          box.style.borderColor = 'rgba(255, 255, 255, 0.1)';
        });
      },

      updateZone(score) {
        const state = document.getElementById('dash-state');
        const guidance = document.getElementById('zone-guidance');

        if (score >= 80) {
          state.innerText = '巔峰區';
          state.style.color = 'var(--zone-peak)';
          guidance.innerText = '⚠️ 過熱風險，建議縮小倉位';
        } else if (score >= 55) {
          state.innerText = '最佳區';
          state.style.color = 'var(--zone-optimal)';
          guidance.innerText = '✅ 執行A+設定';
        } else if (score >= 35) {
          state.innerText = '中立區';
          state.style.color = 'var(--zone-neutral)';
          guidance.innerText = '⚠️ 僅確認型交易';
        } else {
          state.innerText = '衰退區';
          state.style.color = 'var(--zone-degraded)';
          guidance.innerText = '🚫 鎖定交易，建議休息';
        }
      }
    };

    // 事件綁定
    const trigger = document.getElementById('scan-trigger-wrapper');
    
    trigger.addEventListener('mousedown', () => PhaseEngine.start());
    trigger.addEventListener('mouseup', () => PhaseEngine.stop());
    trigger.addEventListener('mouseleave', () => PhaseEngine.stop());
    
    trigger.addEventListener('touchstart', (e) => {
      e.preventDefault();
      PhaseEngine.start();
    });
    trigger.addEventListener('touchend', (e) => {
      e.preventDefault();
      PhaseEngine.stop();
    });
    trigger.addEventListener('touchcancel', () => PhaseEngine.stop());

    console.log('✅ TENKI v50.1 階段式無縫升級就緒');
  </script>
</body>
</html>
