<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TENKI v25.7 - Precision Core</title>
    
    <!-- 字體庫 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- 核心引擎 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    
    <!-- UI 庫 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --bg-deep: #050510;
            --plasma-cyan: #00F0FF; 
            --void-purple: #7000FF;
            --alert-orange: #FF5500;
            --matrix-green: #00FF94;
            --glass-bg: rgba(10, 10, 20, 0.85);
            --glass-border: rgba(255, 255, 255, 0.12);
        }

        body {
            background: var(--bg-deep); color: white;
            font-family: 'Space Mono', monospace;
            overflow: hidden; width: 100vw; height: 100dvh;
            margin: 0; padding: 0;
            -webkit-tap-highlight-color: transparent; user-select: none;
        }

        .font-sans-bold { font-family: 'Inter', sans-serif; font-weight: 900; }
        .font-serif-human { font-family: 'Playfair Display', serif; }
        .font-mono-tech { font-family: 'JetBrains Mono', monospace; }

        /* 隱私層 & 背景層 */
        #input-video, #light-analysis-canvas, #rppg-processing-canvas { position: fixed; top: -9999px; left: -9999px; opacity: 0; pointer-events: none; }
        
        #universe {
            position: absolute; inset: 0; z-index: 1;
            background: radial-gradient(circle at center, #111 0%, #000 100%);
            transition: opacity 1s ease, filter 1s ease;
        }
        #universe.dimmed { opacity: 0.2; filter: blur(15px); }

        /* HUD 層 */
        #hud-layer {
            position: absolute; inset: 0; z-index: 10; pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 24px; padding-bottom: calc(30px + env(safe-area-inset-bottom));
            transition: opacity 0.5s ease;
        }
        #hud-layer.hidden-ui { opacity: 0; pointer-events: none; transform: scale(1.05); filter: blur(10px); }

        .env-readout { font-size: 9px; letter-spacing: 1px; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; margin-bottom: 8px; }
        .env-item { display: flex; align-items: center; gap: 6px; color: #666; transition: color 0.3s; }
        .env-item.good { color: var(--matrix-green); }
        .env-bar { width: 30px; height: 3px; background: rgba(255,255,255,0.1); border-radius: 1px; overflow: hidden; }
        .env-fill { height: 100%; background: currentColor; transition: width 0.3s; }

        #align-hint-capsule {
            position: absolute; top: 15%; left: 50%; transform: translateX(-50%) translateY(-20px) scale(0.95);
            background: rgba(20, 20, 25, 0.75); backdrop-filter: blur(20px);
            padding: 10px 20px; border-radius: 99px; border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex; align-items: center; gap: 12px; opacity: 0; pointer-events: none; 
            transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1); z-index: 100; box-shadow: 0 4px 24px rgba(0,0,0,0.4);
        }
        #align-hint-capsule.show { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); pointer-events: auto; }
        
        .audio-bar { width: 4px; height: 20px; background: rgba(255,255,255,0.2); margin: 0 1px; transition: height 0.05s ease-out; border-radius: 2px; }

        /* 指紋掃描器 */
        .fingerprint-wrapper {
            position: relative; width: 110px; height: 110px;
            display: flex; justify-content: center; align-items: center; pointer-events: auto; cursor: pointer; border-radius: 50%;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .fingerprint-core {
            width: 80px; height: 80px; border-radius: 50%; background: rgba(10, 10, 15, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15); display: flex; justify-content: center; align-items: center;
            backdrop-filter: blur(12px); position: relative; overflow: hidden; z-index: 20;
            box-shadow: 0 0 20px rgba(0,0,0,0.5); transition: all 0.4s;
        }
        .scan-beam {
            position: absolute; top: -100%; left: 0; width: 100%; height: 50%;
            background: linear-gradient(to bottom, transparent 0%, rgba(0, 240, 255, 0.4) 90%, rgba(255, 255, 255, 0.8) 100%);
            opacity: 0; pointer-events: none; z-index: 21;
        }
        .progress-svg { position: absolute; top: -5px; left: -5px; width: 120px; height: 120px; transform: rotate(-90deg); z-index: 30; pointer-events: none; }
        .progress-circle {
            fill: none; stroke: var(--plasma-cyan); stroke-width: 3; stroke-linecap: round;
            stroke-dasharray: 339; stroke-dashoffset: 339; transition: stroke-dashoffset 0.05s linear;
            filter: drop-shadow(0 0 6px var(--plasma-cyan));
        }
        .fingerprint-wrapper.active { transform: scale(0.95); }
        .fingerprint-wrapper.active .fingerprint-core { border-color: rgba(0, 240, 255, 0.5); background: rgba(0, 10, 20, 0.9); }
        .fingerprint-wrapper.active .scan-beam { opacity: 1; animation: beam-scan 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
        @keyframes beam-scan { 0% { top: -100%; opacity: 0; } 50% { opacity: 1; } 100% { top: 150%; opacity: 0; } }

        /* ========================================= */
        /* DASHBOARD LAYOUT */
        /* ========================================= */
        #dashboard-layer {
            position: absolute; inset: 0; z-index: 50;
            background: transparent;
            display: flex; flex-direction: column;
            padding: 24px 20px 140px 20px; 
            overflow-y: auto; opacity: 0; pointer-events: none;
            transform: translateY(20px);
            transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        #dashboard-layer.show { opacity: 1; pointer-events: auto; transform: translateY(0); }

        .bento-card {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            border-radius: 24px; padding: 16px;
            backdrop-filter: blur(24px); display: flex; flex-direction: column; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.4); position: relative; overflow: hidden;
        }

        /* 原有 Orbit 樣式保留 */
        .orbit-container { width: 280px; height: 280px; position: relative; display: flex; justify-content: center; align-items: center; margin: 0 auto; }
        .ring-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
        .ring-track { fill: none; stroke: rgba(255, 255, 255, 0.08); stroke-linecap: round; }
        .ring-value { fill: none; stroke-linecap: round; transition: stroke-dashoffset 1s cubic-bezier(0.2, 0.8, 0.2, 1); }
        .orbit-data-center { position: absolute; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .metallic-text {
            background: linear-gradient(180deg, #FFFFFF 20%, #A0A0A0 100%);
            -webkit-background-clip: text; background-clip: text; color: transparent;
            filter: drop-shadow(0 4px 10px rgba(255,255,255,0.2)); letter-spacing: -4px; line-height: 1;
        }

        /* ------------------------------------------- */
        /* NEW: PRECISION SNAPSHOT STYLES */
        /* ------------------------------------------- */
        .signal-canvas {
            width: 100%; height: 60px;
            mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
            -webkit-mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
        }
        
        .precision-badge {
            font-size: 9px; padding: 2px 6px; border-radius: 4px;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            color: #666; transition: all 0.5s; font-family: 'JetBrains Mono', monospace;
        }
        .precision-badge.phase-1 { color: #888; border-color: #444; }
        .precision-badge.phase-2 { color: var(--plasma-cyan); border-color: var(--plasma-cyan); background: rgba(0,240,255,0.1); }
        .precision-badge.phase-3 { color: var(--matrix-green); border-color: var(--matrix-green); background: rgba(0,255,148,0.1); box-shadow: 0 0 10px rgba(0,255,148,0.2); }

        .data-value { font-family: 'JetBrains Mono', monospace; font-weight: 700; transition: color 0.3s; }
        .data-value.locked { color: var(--matrix-green); text-shadow: 0 0 8px rgba(0,255,148,0.4); }

        .confidence-bar-bg { width: 100%; height: 2px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; position: absolute; bottom: 0; left: 0; }
        .confidence-bar-fill { height: 100%; width: 0%; background: var(--plasma-cyan); transition: width 0.1s linear; box-shadow: 0 0 5px var(--plasma-cyan); }

        /* Dock */
        .dock-container {
            position: fixed; bottom: calc(30px + env(safe-area-inset-bottom));
            left: 20px; right: 20px; height: 70px;
            background: rgba(5, 5, 10, 0.9); backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.15); border-radius: 35px;
            display: flex; align-items: center; justify-content: space-between; padding: 0 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            transform: translateY(150px); transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 100;
        }
        #dashboard-layer.show .dock-container { transform: translateY(0); }
        .dock-btn { width: 54px; height: 54px; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; transition: all 0.2s; }
        .dock-main-action {
            flex: 1; height: 54px; margin: 0 8px;
            background: linear-gradient(90deg, #FFFFFF, #CCCCCC);
            border-radius: 27px; display: flex; align-items: center; justify-content: center;
            font-weight: 800; letter-spacing: 1px; color: black;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3); transition: transform 0.2s;
        }
    </style>
</head>

    <!-- WORKER: rPPG Signal Processor -->
    <script id="worker-script" type="javascript/worker">
        let buffer = []; const BUFFER_SIZE = 180;
        self.onmessage = function(e) {
            const { val, type } = e.data;
            if (type === 'reset') { buffer = []; return; }
            
            buffer.push(val); 
            if(buffer.length > BUFFER_SIZE) buffer.shift();
            
            // Raw Signal for Visualizer (normalized)
            let min=1000, max=0; buffer.forEach(v=>{if(v<min)min=v; if(v>max)max=v;});
            const range = max-min || 1;
            const normalized = buffer.map(v => (v-min)/range);
            
            // Basic Peak Detection for HRV
            let peaks = [];
            for(let i=2; i<normalized.length-2; i++) {
                if(normalized[i]>0.6 && normalized[i]>normalized[i-1] && normalized[i]>normalized[i+1]) {
                    if(peaks.length===0 || (i - peaks[peaks.length-1]) > 10) peaks.push(i);
                }
            }
            
            let hrv = 0;
            if(peaks.length > 2) {
                let sqDiff = 0;
                for(let i=0; i<peaks.length-1; i++) {
                    let diff = (peaks[i+1] - peaks[i]) * 33; // ~30fps
                    sqDiff += diff*diff;
                }
                hrv = Math.sqrt(sqDiff / (peaks.length-1));
            }

            self.postMessage({ 
                graph: normalized, 
                current: normalized[normalized.length-1], 
                samples: buffer.length,
                hrv: hrv
            });
        };
    </script>

    <!-- ENGINE (保留) -->
    <script>
        class BaselineManager {
            constructor() { this.data = this.load() || { samples_count: 0 }; }
            load() { const stored = localStorage.getItem('tenki_baseline_v2'); return stored ? JSON.parse(stored) : null; }
            save() { localStorage.setItem('tenki_baseline_v2', JSON.stringify(this.data)); }
            recordSession() { this.data.samples_count++; this.save(); }
        }
        const TenkiEngine = {
            calculatePole: function(sampleBuffer) {
                if (!sampleBuffer || sampleBuffer.length === 0) return { score: 50, stability: 0, hrv: 50 };
                let sumHead = 0; sampleBuffer.forEach(s => { sumHead += (Math.abs(s.headRot.x) + Math.abs(s.headRot.y)); });
                const stability = Math.max(0, 1 - ((sumHead / sampleBuffer.length) * 4));
                return { score: Math.floor(60 + (stability * 39)), stability, hrv: 50 + (stability*40) };
            }
        };
        const baselineMgr = new BaselineManager();
    </script>

    <!-- RESONANCE CONTROLLER (負責新的可視化邏輯) -->
    <script>
        const ResonanceController = {
            active: false, worker: null, ctx: null, graphCtx: null,
            state: { hrv: 0, confidence: 0, phase: 0 },
            
            init: function() {
                const blob = new Blob([document.getElementById('worker-script').textContent], {type: "text/javascript"});
                this.worker = new Worker(window.URL.createObjectURL(blob));
                this.ctx = document.getElementById('rppg-processing-canvas').getContext('2d', { willReadFrequently: true });
                
                // Initialize Graph Canvas
                const cvs = document.getElementById('live-graph-canvas');
                cvs.width = cvs.offsetWidth; cvs.height = cvs.offsetHeight;
                this.graphCtx = cvs.getContext('2d');
                
                this.worker.onmessage = (e) => {
                    if(!this.active) return;
                    this.updateUI(e.data);
                };
            },

            updateUI: function(data) {
                const { graph, samples, hrv } = data;
                
                // 1. Phased Optimization Logic
                this.state.confidence = Math.min(100, samples / 1.5); // 0-100% over ~5s
                
                const phaseText = document.getElementById('scan-phase-text');
                const badge = document.getElementById('precision-badge');
                const dot = document.getElementById('live-pulse-dot');
                const hrvVal = document.getElementById('live-hrv-val');
                const cohVal = document.getElementById('live-coherence-val');
                
                if(this.state.confidence < 40) {
                    // Phase 1: Calibrating
                    if(this.state.phase !== 1) {
                        this.state.phase = 1;
                        phaseText.innerText = "CALIBRATING SIGNAL";
                        badge.className = "precision-badge phase-1"; badge.innerText = "±15ms";
                        dot.className = "w-1.5 h-1.5 rounded-full bg-gray-500 animate-pulse";
                        hrvVal.classList.remove('locked'); cohVal.classList.remove('locked');
                    }
                    // Jittery numbers
                    hrvVal.innerText = Math.floor(Math.random()*40 + 40);
                    cohVal.innerText = Math.floor(Math.random()*30 + 30);
                } 
                else if (this.state.confidence < 90) {
                    // Phase 2: Accumulating
                    if(this.state.phase !== 2) {
                        this.state.phase = 2;
                        phaseText.innerText = "RESONANCE LOCK"; phaseText.style.color = "var(--plasma-cyan)";
                        badge.className = "precision-badge phase-2"; badge.innerText = "±5ms";
                        dot.className = "w-1.5 h-1.5 rounded-full bg-cyan-400 animate-pulse";
                        hrvVal.className = "text-2xl data-value text-cyan-400";
                        cohVal.className = "text-2xl data-value text-cyan-400";
                    }
                    if(hrv > 0) hrvVal.innerText = Math.round(hrv);
                    cohVal.innerText = Math.round(this.state.confidence * 0.8);
                } 
                else {
                    // Phase 3: Locked
                    if(this.state.phase !== 3) {
                        this.state.phase = 3;
                        phaseText.innerText = "OPTIMIZED"; phaseText.style.color = "var(--matrix-green)";
                        badge.className = "precision-badge phase-3"; badge.innerText = "±1ms";
                        dot.className = "w-1.5 h-1.5 rounded-full bg-green-400";
                        hrvVal.className = "text-2xl data-value locked";
                        cohVal.className = "text-2xl data-value locked";
                    }
                    if(hrv > 0) hrvVal.innerText = Math.round(hrv);
                    cohVal.innerText = "98"; // Simulated high coherence
                }

                document.getElementById('confidence-fill').style.width = this.state.confidence + "%";

                // 2. Draw Graph
                const ctx = this.graphCtx;
                const width = ctx.canvas.width; const height = ctx.canvas.height;
                ctx.clearRect(0,0,width,height);
                
                ctx.beginPath();
                const step = width / graph.length;
                
                // Color based on phase
                if(this.state.phase === 1) ctx.strokeStyle = "rgba(100,100,100,0.5)";
                else if(this.state.phase === 2) ctx.strokeStyle = "#00F0FF";
                else ctx.strokeStyle = "#00FF94";
                
                ctx.lineWidth = 2;
                for(let i=0; i<graph.length; i++) {
                    const x = i * step;
                    const y = height - (graph[i] * height * 0.8) - (height*0.1);
                    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
                }
                ctx.stroke();
            },

            processFrame: function(video, landmarks) {
                if(!this.active || !landmarks || !this.ctx) return;
                try {
                    const fx = Math.floor(landmarks[10].x * video.videoWidth); 
                    const fy = Math.floor(landmarks[10].y * video.videoHeight);
                    this.ctx.drawImage(video, fx-2, fy+2, 4, 4, 0, 0, 4, 4);
                    const data = this.ctx.getImageData(0,0,4,4).data;
                    let gSum = 0; for(let i=0; i<data.length; i+=4) gSum+=data[i+1];
                    this.worker.postMessage({ type: 'data', val: gSum/16 });
                } catch(e) {}
            },

            start: function() {
                this.active = true;
                this.state.phase = 0;
                this.worker.postMessage({ type: 'reset' });
            },
            stop: function() { this.active = false; }
        };
    </script>

    <!-- MAIN APP SCRIPT -->
    <script>
        lucide.createIcons();

        const app = {
            config: { particleCount: 8000, particleSize: 0.08 },
            state: { isScanning: false, isSensorActive: false, headRot: {x:0,y:0}, scanBuffer: [] },
            audioCtx: null, analyser: null, stream: null, lightCtx: null,

            init: function() {
                ResonanceController.init();
                this.initThree();
                this.initEvents();
                this.initEnvironment();
                const d = new Date();
                document.getElementById('dash-date').innerText = d.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'}).toUpperCase();
            },

            // --- Sensors & Environment (保留) ---
            initEnvironment: function() {
                const c = document.getElementById('light-analysis-canvas');
                if(c) this.lightCtx = c.getContext('2d', { willReadFrequently: true });
                window.addEventListener('devicemotion', (e)=>{});
            },
            updateEnvironment: function() {
                if(!this.state.isSensorActive && this.lightCtx) {
                    const luxBar = document.getElementById('env-lux-bar');
                    if(luxBar) luxBar.style.width = (60 + Math.sin(Date.now()*0.001)*10) + '%';
                } else if(this.lightCtx && document.getElementById('input-video').readyState === 4 && Math.random() > 0.95) {
                    const v = document.getElementById('input-video');
                    this.lightCtx.drawImage(v,0,0,50,50);
                    const d = this.lightCtx.getImageData(0,0,50,50).data;
                    let s=0; for(let i=0;i<d.length;i+=4) s+=d[i];
                    const luxBar = document.getElementById('env-lux-bar');
                    if(luxBar) luxBar.style.width = Math.min(100, (s/(2500*255))*100) + '%';
                }
            },

            // --- Three.js (保留) ---
            initThree: function() {
                const container = document.getElementById('universe');
                this.scene = new THREE.Scene();
                this.camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
                this.camera.position.z = 5;
                this.renderer = new THREE.WebGLRenderer({ alpha: true, antialias: false });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                container.appendChild(this.renderer.domElement);
                
                const geo = new THREE.BufferGeometry();
                const pos = new Float32Array(this.config.particleCount*3);
                for(let i=0;i<this.config.particleCount*3;i++) pos[i]=(Math.random()-0.5)*10;
                geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
                
                const canvas = document.createElement('canvas'); canvas.width=32; canvas.height=32;
                const ctx = canvas.getContext('2d');
                const grad = ctx.createRadialGradient(16,16,0,16,16,16);
                grad.addColorStop(0, 'rgba(255,255,255,1)'); grad.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = grad; ctx.fillRect(0,0,32,32);
                
                this.material = new THREE.PointsMaterial({ size: 0.08, map: new THREE.Texture(canvas), transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending, depthWrite: false });
                this.material.map.needsUpdate = true;
                this.cloud = new THREE.Points(geo, this.material);
                this.scene.add(this.cloud);
                this.animate();
            },

            // --- Logic ---
            startSensors: async function() {
                try {
                    document.getElementById('instruction').innerText = "SENSORS ACTIVE...";
                    this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    this.analyser = this.audioCtx.createAnalyser();
                    this.stream = await navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 240, frameRate: 30 }, audio: true });
                    const src = this.audioCtx.createMediaStreamSource(this.stream); src.connect(this.analyser);
                    
                    const video = document.getElementById('input-video');
                    video.srcObject = this.stream;
                    const faceMesh = new FaceMesh({locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`});
                    faceMesh.setOptions({maxNumFaces: 1, minDetectionConfidence: 0.5});
                    faceMesh.onResults(res => this.processData(res, video));
                    
                    const cam = new Camera(video, { onFrame: async () => await faceMesh.send({image: video}), width: 320, height: 240 });
                    cam.start();
                    this.state.isSensorActive = true;
                } catch(e) { console.error(e); }
            },

            processData: function(results, video) {
                const landmarks = results.multiFaceLandmarks ? results.multiFaceLandmarks[0] : null;
                this.updateAlignment(landmarks);

                if(landmarks) {
                    this.state.isFaceDetected = true;
                    document.getElementById('connection-status').innerText = "VISION: ACTIVE";
                    document.getElementById('connection-status').style.color = "#00F0FF";
                    if(!this.state.isScanning && !ResonanceController.active) document.getElementById('instruction').innerText = "HOLD TO SCAN";

                    this.state.headRot.x = (landmarks[1].y - 0.5) * 2;
                    this.state.headRot.y = (landmarks[1].x - 0.5) * 2;
                    
                    if(this.state.isScanning) {
                        this.state.scanBuffer.push({ headRot: {x:this.state.headRot.x, y:this.state.headRot.y} });
                    }
                    
                    // Critical Integration: Feed data to Resonance Controller if active
                    if(ResonanceController.active) ResonanceController.processFrame(video, landmarks);
                }
            },

            updateAlignment: function(landmarks) {
                const caps = document.getElementById('align-hint-capsule');
                if(ResonanceController.active) { caps.classList.remove('show'); return; }
                let msg = "FIND FACE";
                if(landmarks) {
                    const nx = landmarks[1].x;
                    if(nx < 0.35) msg="MOVE RIGHT →"; else if(nx > 0.65) msg="← MOVE LEFT"; else msg="READY TO SCAN";
                }
                const txt = document.getElementById('hint-text');
                if(txt.innerText !== msg) {
                    txt.innerText = msg;
                    const box = document.getElementById('hint-icon-box');
                    if(msg.includes("READY")) { box.className="w-6 h-6 rounded-full flex items-center justify-center bg-cyan-500/20"; caps.className="status-good show"; }
                    else { box.className="w-6 h-6 rounded-full flex items-center justify-center bg-red-500/20"; caps.className="status-warn show"; }
                }
                if(!caps.classList.contains('show')) caps.classList.add('show');
            },

            animate: function() {
                requestAnimationFrame(()=>this.animate());
                this.updateEnvironment();
                this.cloud.rotation.y += 0.002 + (this.state.headRot.y * 0.05);
                this.renderer.render(this.scene, this.camera);
                
                if(this.state.isSensorActive && this.analyser) {
                    const arr = new Uint8Array(4); this.analyser.getByteFrequencyData(arr);
                    const bars = document.querySelectorAll('.audio-bar');
                    bars.forEach((b,i) => b.style.height = Math.max(2, (arr[i]/255)*20)+'px');
                }
            },

            initEvents: function() {
                const btn = document.getElementById('scan-trigger-wrapper');
                const ring = document.getElementById('scan-progress-bar');
                const start = (e) => {
                    e.preventDefault();
                    if(!this.stream) { this.startSensors(); return; }
                    this.state.isScanning = true; this.state.scanBuffer=[];
                    btn.classList.add('active');
                    document.getElementById('instruction').innerText = "CONNECTING...";
                    if(navigator.vibrate) navigator.vibrate(50);
                    let p=0;
                    this.scanTimer = setInterval(()=>{
                        p+=2; ring.style.strokeDashoffset = 339 - ((p/100)*339);
                        if(p>=100) this.finishScan();
                    }, 40);
                };
                const end = () => {
                    if(!this.state.isScanning) return;
                    this.state.isScanning=false; clearInterval(this.scanTimer);
                    btn.classList.remove('active');
                    ring.style.strokeDashoffset = 339;
                    document.getElementById('instruction').innerText = "HOLD TO SYNC";
                };
                btn.addEventListener('mousedown', start); btn.addEventListener('touchstart', start);
                window.addEventListener('mouseup', end); window.addEventListener('touchend', end);
            },

            finishScan: function() {
                clearInterval(this.scanTimer);
                this.state.isScanning = false;
                if(navigator.vibrate) navigator.vibrate([50, 50, 100]);

                // 核心運算
                const result = TenkiEngine.calculatePole(this.state.scanBuffer);
                baselineMgr.recordSession();

                // 視覺切換
                document.getElementById('hud-layer').classList.add('hidden-ui');
                document.getElementById('align-hint-capsule').classList.remove('show');
                document.getElementById('universe').classList.add('dimmed');
                
                setTimeout(() => {
                    document.getElementById('dashboard-layer').classList.add('show');
                    // Animate Score
                    const scoreEl = document.getElementById('dash-score');
                    let cur = 0;
                    const t = setInterval(()=>{
                        cur+=2; if(cur>=result.score) { cur=result.score; clearInterval(t); }
                        scoreEl.innerText = cur<10?"0"+cur:cur;
                        const off = 753 - ((cur/100)*753);
                        document.getElementById('ring-score').style.strokeDashoffset = off;
                        document.getElementById('ring-hrv').style.strokeDashoffset = off - 50;
                    }, 20);
                    
                    // Start Live Resonance
                    ResonanceController.start(); 
                }, 400);
            },

            reset: function() {
                ResonanceController.stop();
                document.getElementById('dashboard-layer').classList.remove('show');
                document.getElementById('hud-layer').classList.remove('hidden-ui');
                document.getElementById('universe').classList.remove('dimmed');
                document.getElementById('scan-trigger-wrapper').classList.remove('active');
                document.getElementById('scan-progress-bar').style.strokeDashoffset = 339;
                document.getElementById('instruction').innerText = "HOLD TO SYNC";
            }
        };

        window.onload = () => app.init();
        window.onresize = () => {
            app.camera.aspect = window.innerWidth/window.innerHeight;
            app.camera.updateProjectionMatrix();
            app.renderer.setSize(window.innerWidth, window.innerHeight);
        };
    </script>
</body>
</html>
