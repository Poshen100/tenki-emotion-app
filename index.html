<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TENKI v40.0 - Ultimate Hybrid</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* --- iOS-like Fluid UI --- */
        :root {
            --bg-deep: #000000;
            --plasma-cyan: #00F0FF; 
            --matrix-green: #00FF94;
            --glass-bg: rgba(20, 20, 25, 0.85);
            --score-high: #00FF94; --score-mid: #FFD600; --score-low: #FF0055;
        }

        body {
            background: var(--bg-deep); color: white;
            font-family: 'Inter', sans-serif;
            overflow: hidden; width: 100vw; height: 100dvh;
            margin: 0; user-select: none; -webkit-tap-highlight-color: transparent;
            overscroll-behavior: none;
        }

        /* Hidden Processing */
        #input-video, #roi-canvas { position: absolute; top: -9999px; left: -9999px; }

        /* 3D Background */
        #universe { position: absolute; inset: 0; z-index: 1; transition: opacity 1.5s ease; }
        #universe.dimmed { opacity: 0.15; filter: blur(10px); transform: scale(1.05); }

        /* HUD Layer */
        #hud-layer {
            position: absolute; inset: 0; z-index: 10;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 24px; padding-top: calc(50px + env(safe-area-inset-top));
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #hud-layer.hidden-ui { opacity: 0; pointer-events: none; transform: scale(0.95); filter: blur(10px); }

        /* Fingerprint UI */
        .fingerprint-container { position: relative; width: 120px; height: 120px; display: flex; justify-content: center; align-items: center; }
        .fingerprint-ring { position: absolute; inset: 0; border-radius: 50%; border: 1px solid rgba(255,255,255,0.1); transition: all 0.5s; }
        .fingerprint-btn {
            width: 90px; height: 90px; border-radius: 50%;
            background: rgba(255,255,255,0.05); backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.15);
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; position: relative; z-index: 20;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .fingerprint-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.1); }
        .fingerprint-btn.active { background: rgba(0, 240, 255, 0.1); border-color: var(--plasma-cyan); box-shadow: 0 0 40px rgba(0, 240, 255, 0.2); }
        
        /* Dashboard Layer */
        #dashboard-layer {
            position: absolute; inset: 0; z-index: 50;
            background: transparent; display: flex; flex-direction: column;
            padding: 20px; padding-top: calc(50px + env(safe-area-inset-top));
            padding-bottom: 180px; 
            overflow-y: auto; opacity: 0; pointer-events: none;
            transform: translateY(100px); transition: all 0.8s cubic-bezier(0.19, 1, 0.22, 1);
        }
        #dashboard-layer.show { opacity: 1; pointer-events: auto; transform: translateY(0); }

        .bento-card {
            background: var(--glass-bg); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 28px; padding: 20px; position: relative; overflow: hidden;
            backdrop-filter: blur(50px); -webkit-backdrop-filter: blur(50px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            transition: transform 0.2s;
        }
        .bento-card:active { transform: scale(0.98); }

        /* Visual Components */
        .integrity-track { width: 100%; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; margin-top: 10px; }
        .integrity-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #00F0FF, #00FF94); transition: width 0.3s; }
        
        .score-circle-bg { fill: none; stroke: rgba(255,255,255,0.1); stroke-width: 8; stroke-linecap: round; }
        .score-circle-fg { 
            fill: none; stroke: var(--score-high); stroke-width: 8; stroke-linecap: round;
            stroke-dasharray: 628; stroke-dashoffset: 628; transition: stroke-dashoffset 1.5s cubic-bezier(0.19, 1, 0.22, 1), stroke 0.5s;
            transform: rotate(-90deg); transform-origin: 50% 50%;
        }

        .spectrum-bar { width: 100%; height: 12px; background: rgba(0,0,0,0.5); border-radius: 6px; display: flex; overflow: hidden; margin-top: 12px; }
        .bar-sns { background: var(--score-low); height: 100%; width: 50%; transition: width 1s; opacity: 0.8; }
        .bar-pns { background: var(--matrix-green); height: 100%; width: 50%; transition: width 1s; opacity: 0.8; }
        
        .graph-container { width: 100%; height: 60px; position: relative; }

        /* Floating Dock */
        .dock {
            position: fixed; bottom: 30px; left: 50%; width: 300px; height: 64px; margin-left: -150px; 
            background: rgba(25,25,30,0.9); backdrop-filter: blur(30px);
            border-radius: 32px; border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 15px 50px rgba(0,0,0,0.5);
            display: flex; align-items: center; justify-content: space-between; padding: 0 8px;
            z-index: 1000; transition: opacity 0.5s, transform 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            transform: translateY(150px);
        }
        #dashboard-layer.show ~ .dock { transform: translateY(0); }

        .font-mono-tech { font-family: 'JetBrains Mono', monospace; }
        
        #camera-loading {
            position: absolute; inset: 0; z-index: 999; background: #000; display: flex; justify-content: center; align-items: center;
            transition: opacity 0.5s; pointer-events: none; opacity: 0;
        }
        #camera-loading.active { opacity: 1; pointer-events: auto; }
    </style>
</head>
<body>

    <video id="input-video" playsinline muted autoplay></video>
    <canvas id="roi-canvas" width="64" height="64"></canvas>
    <div id="universe"></div>
    <div id="camera-loading"><div class="text-center"><i data-lucide="aperture" class="w-8 h-8 text-cyan-400 mx-auto mb-2 animate-spin"></i><div class="text-xs font-mono-tech text-white">INITIALIZING OPTICS...</div></div></div>

    <!-- HUD -->
    <div id="hud-layer">
        <div class="flex justify-between items-start px-6">
            <div><div class="text-2xl font-black tracking-widest text-white">TENKI</div><div class="text-[9px] text-cyan-400 tracking-[0.2em] font-mono-tech">HYBRID_CORE v40.0</div></div>
            <div id="status-badge" class="px-2 py-1 border border-white/10 rounded-full text-[9px] font-mono-tech text-gray-500 bg-black/20 backdrop-blur">WAITING</div>
        </div>
        <div class="flex-1 flex flex-col justify-center items-center">
            <div class="fingerprint-container" id="scan-trigger">
                <div class="fingerprint-ring" id="pulse-ring"></div>
                <div class="fingerprint-btn"><i data-lucide="fingerprint" class="w-8 h-8 text-white/50 transition-colors" id="scan-icon"></i></div>
            </div>
            <div class="mt-8 text-center h-10">
                <div id="main-instruction" class="text-xs font-bold tracking-[0.15em] text-white/80">ALIGN FACE</div>
                <div id="sub-instruction" class="text-[9px] text-cyan-400/60 mt-1 font-mono-tech opacity-0 transition-opacity">CHECK LIGHTING...</div>
            </div>
        </div>
        <div class="px-6 pb-6 w-full"><div class="w-full h-1 bg-white/10 rounded-full overflow-hidden"><div id="signal-bar" class="h-full bg-cyan-400 w-0 transition-all duration-100 ease-linear shadow-[0_0_10px_#00F0FF]"></div></div></div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard-layer">
        <div class="mb-4">
            <div class="flex justify-between items-end mb-2">
                <div><div class="text-[10px] text-cyan-400 font-bold uppercase tracking-widest mb-1"><span id="analysis-state" class="animate-pulse">CALIBRATING...</span></div><div class="text-xl font-bold text-white font-serif">Bio-Metrics</div></div>
                <div class="text-right"><div class="text-[9px] text-gray-500 font-bold mb-1">ACCURACY</div><div id="confidence-txt" class="text-white font-mono-tech font-bold text-lg">0%</div></div>
            </div>
            <div class="integrity-track"><div id="confidence-bar" class="integrity-fill" style="width: 0%"></div></div>
        </div>

        <div class="grid grid-cols-2 gap-3">
            <!-- TEI Score -->
            <div class="col-span-2 bento-card py-8 flex flex-col items-center justify-center bg-black/40">
                <div class="relative w-[200px] h-[200px]">
                    <svg class="w-full h-full"><circle cx="100" cy="100" r="85" class="score-circle-bg"></circle><circle id="score-ring" cx="100" cy="100" r="85" class="score-circle-fg"></circle></svg>
                    <div class="absolute inset-0 flex flex-col items-center justify-center">
                        <span class="text-[9px] font-bold tracking-[0.2em] text-gray-500 mb-1">STRESS SCORE</span>
                        <span id="tei-score" class="text-7xl font-black text-white leading-none tracking-tighter">--</span>
                        <span id="tei-grade" class="text-[10px] font-bold text-gray-500 mt-2 tracking-widest uppercase bg-white/10 px-2 py-1 rounded">Analyzing...</span>
                    </div>
                </div>
            </div>

            <!-- ANS Spectrum -->
            <div class="col-span-2 bento-card">
                <div class="flex justify-between items-center">
                    <span class="text-[10px] font-bold text-gray-400 uppercase flex items-center gap-2"><i data-lucide="activity" class="w-3 h-3 text-cyan-400"></i> Autonomic Balance</span>
                    <span id="hrv-val" class="text-sm font-mono-tech font-bold text-white">-- ms</span>
                </div>
                <div class="spectrum-bar">
                    <div id="bar-sns" class="bar-sns"></div><div id="bar-pns" class="bar-pns"></div>
                </div>
                <div class="flex justify-between mt-2 text-[9px] font-bold text-gray-500"><span>SYMPATHETIC</span><span>PARASYMPATHETIC</span></div>
            </div>

            <!-- Heart Rate -->
            <div class="bento-card col-span-1 h-36 flex flex-col justify-between relative overflow-hidden">
                <div class="flex justify-between items-start z-10">
                    <span class="text-[9px] font-bold text-gray-400 uppercase">Heart Rate</span>
                    <i data-lucide="heart" class="w-3 h-3 text-red-500 fill-red-500 animate-pulse"></i>
                </div>
                <div class="z-10"><span id="bpm-val" class="text-4xl font-bold tracking-tighter text-white">--</span><span class="text-[9px] text-gray-500 font-bold ml-1">BPM</span></div>
                <div class="graph-container z-10"><canvas id="pulse-canvas" width="120" height="50"></canvas></div>
            </div>

            <!-- Respiration -->
            <div class="bento-card col-span-1 h-36 flex flex-col justify-between relative overflow-hidden">
                <div class="flex justify-between items-start z-10">
                    <span class="text-[9px] font-bold text-gray-400 uppercase">Respiration</span>
                    <i data-lucide="wind" class="w-3 h-3 text-green-400"></i>
                </div>
                <div class="absolute inset-0 top-6 bottom-6 flex items-center justify-center"><canvas id="breath-canvas" width="120" height="60"></canvas></div>
                <div class="text-right z-10 relative"><span id="rr-val" class="text-xl font-bold text-white tracking-tighter">--</span><span class="text-[9px] text-gray-500 font-bold ml-1">BR/MIN</span></div>
            </div>

            <div class="col-span-2 bento-card bg-black/80 border-white/20 h-20 flex flex-col justify-center">
                <div class="text-[9px] text-cyan-500 font-mono-tech mb-1">SYSTEM_LOG</div>
                <div id="log-msg" class="text-[10px] text-white/90 font-serif italic leading-tight">"Ready to capture biometrics."</div>
            </div>
        </div>
    </div>

    <!-- Dock -->
    <div id="floating-dock" class="dock">
        <button class="w-10 h-10 flex items-center justify-center rounded-full text-white/50 hover:bg-white/10 transition"><i data-lucide="share-2" class="w-4 h-4"></i></button>
        <button id="reset-btn" class="flex-1 h-12 mx-3 bg-white text-black rounded-full font-bold text-xs shadow-lg active:scale-95 transition-transform" onclick="app.reset()">NEW SCAN</button>
        <button class="w-10 h-10 flex items-center justify-center rounded-full text-white/50 hover:bg-white/10 transition"><i data-lucide="history" class="w-4 h-4"></i></button>
    </div>

    <!-- 🟢 WEB WORKER: The Calculation Core (Non-blocking) -->
    <script id="worker-code" type="javascript/worker">
        class MedicalPOS {
            constructor() {
                this.bufferSize = 256;
                this.r = []; this.g = []; this.b = []; this.t = [];
                this.peaks = []; this.ibis = [];
                this.lastBPM = 70;
            }
            
            process(r, g, b, t) {
                this.r.push(r); this.g.push(g); this.b.push(b); this.t.push(t);
                if(this.r.length > this.bufferSize) { this.r.shift(); this.g.shift(); this.b.shift(); this.t.shift(); }
                
                if(this.r.length < 60) return null;

                // POS Algorithm
                const len = this.r.length;
                const mR = this.r.reduce((a,c)=>a+c,0)/len;
                const mG = this.g.reduce((a,c)=>a+c,0)/len;
                const mB = this.b.reduce((a,c)=>a+c,0)/len;
                
                let H = new Float32Array(len);
                for(let i=0; i<len; i++) {
                    let nR = this.r[i]/mR; let nG = this.g[i]/mG; let nB = this.b[i]/mB;
                    let S1 = nG - nB; let S2 = nG + nB - 2*nR;
                    H[i] = S1 + (S2/2);
                }
                
                // Smoothing (Low Pass)
                let filtered = new Float32Array(len);
                for(let i=4; i<len-4; i++) {
                    let sum = 0; for(let j=-4; j<=4; j++) sum+=H[i+j];
                    filtered[i] = sum/9;
                }
                
                // Signal & SNR
                const signal = filtered[len-5]; // little delay for filter
                let noise = 0; for(let i=1; i<len; i++) noise += Math.abs(filtered[i]-filtered[i-1]);
                const amplitude = Math.max(...filtered) - Math.min(...filtered);
                const snr = amplitude / (noise/len + 0.00001);

                // Peak Detect
                if(snr > 1.5) this.detectPeak(filtered, this.t, amplitude);

                return {
                    bpm: this.calcBPM(),
                    hrv: this.calcRMSSD(),
                    rr: this.calcRR(),
                    signal: signal,
                    snr: snr,
                    validSamples: this.ibis.length
                };
            }

            detectPeak(data, times, amp) {
                const i = data.length-6;
                if(data[i] > data[i-1] && data[i] > data[i+1] && data[i] > amp*0.3) {
                    const now = times[i];
                    if(this.peaks.length > 0 && (now - this.peaks[this.peaks.length-1]) < 350) return;
                    this.peaks.push(now);
                    if(this.peaks.length > 30) this.peaks.shift();
                    
                    if(this.peaks.length >= 2) {
                        const ibi = now - this.peaks[this.peaks.length-2];
                        if(ibi > 350 && ibi < 1300) { // 46-170 bpm valid range
                            this.ibis.push(ibi);
                            if(this.ibis.length > 30) this.ibis.shift();
                        }
                    }
                }
            }

            calcBPM() {
                if(this.ibis.length < 3) return this.lastBPM;
                const sorted = [...this.ibis].sort((a,b)=>a-b);
                const median = sorted[Math.floor(sorted.length/2)];
                const raw = 60000/median;
                // Smooth change
                if(Math.abs(raw - this.lastBPM) > 5) this.lastBPM += (raw>this.lastBPM?1:-1);
                else this.lastBPM = raw;
                return Math.round(this.lastBPM);
            }

            calcRMSSD() {
                if(this.ibis.length < 5) return 0;
                let sum=0; for(let i=0; i<this.ibis.length-1; i++) sum+=Math.pow(this.ibis[i+1]-this.ibis[i], 2);
                return Math.min(150, Math.round(Math.sqrt(sum/(this.ibis.length-1))));
            }

            calcRR() {
                if(this.ibis.length < 10) return 0;
                let cycles=0;
                for(let i=1; i<this.ibis.length-1; i++) {
                    if(this.ibis[i]>this.ibis[i-1] && this.ibis[i]>this.ibis[i+1]) cycles++;
                }
                const dur = (this.peaks[this.peaks.length-1] - this.peaks[0])/60000;
                return Math.round(cycles/dur)||0;
            }
        }

        const core = new MedicalPOS();
        self.onmessage = function(e) {
            const { r, g, b, t } = e.data;
            const res = core.process(r, g, b, t);
            if(res) self.postMessage(res);
        };
    </script>

    <!-- MAIN APP -->
    <script>
        // Init Worker
        const blob = new Blob([document.getElementById('worker-code').textContent], {type: "text/javascript"});
        const worker = new Worker(window.URL.createObjectURL(blob));

        const app = {
            state: { 
                scanning: false, cameraReady: false, faceFound: false,
                accumulating: false, confidence: 0,
                results: { tei: 0, hrv: 0, rr: 0, bpm: 0 },
                graphBuffer: []
            },
            roiCtx: null, video: null,

            init() {
                this.initThree(); this.initGraphs();
                this.initCamera(); this.initInteraction(); 
                this.initWorkerListener();
                lucide.createIcons();
            },

            initWorkerListener() {
                worker.onmessage = (e) => {
                    const data = e.data;
                    
                    // 1. Always update Graph (Interpolation for smoothness)
                    let signal = data.signal;
                    if(data.snr < 1.0) signal = Math.sin(performance.now()/200)*0.05; // Fallback wave
                    this.updateRealtimeGraph(signal);

                    // 2. Data Update (Gated)
                    if(this.state.accumulating) {
                        // Paradox Filter: Reject 150bpm + 150ms HRV
                        if (data.bpm > 110 && data.hrv > 80) {
                            // Noise detected, do not update numbers
                        } else {
                            if(data.bpm > 0) this.state.results.bpm = data.bpm;
                            if(data.hrv > 0) this.state.results.hrv = data.hrv;
                            if(data.rr > 0) this.state.results.rr = data.rr;
                            this.calculateTEI();
                        }
                        
                        // Confidence calculation
                        this.state.confidence = Math.min(100, Math.floor((data.validSamples / 30) * 100));
                        this.updateDashboardUI(data.snr);
                    }

                    // 3. Scan Progress (Signal Bar)
                    if(this.state.scanning) {
                        const qual = Math.min(100, data.snr * 20);
                        document.getElementById('signal-bar').style.width = qual + '%';
                    }
                };
            },

            calculateTEI() {
                // Firstbeat-style logic
                const { hrv, rr, bpm } = this.state.results;
                if(hrv === 0) return;

                // Normalize inputs
                const scoreHRV = Math.min(100, (hrv/100)*100);
                const stressHR = Math.max(0, (bpm-60)*1.5);
                const scoreRR = (rr > 20 || rr < 6) ? 0 : 100 - (Math.abs(rr-8)*5);

                let rawScore = 50 + (scoreHRV*0.5) - (stressHR*0.3) + (scoreRR*0.2);
                
                // Confidence Masking: Don't show "1" score if confidence low
                if(this.state.confidence < 20) rawScore = 50; 

                this.state.results.tei = Math.max(1, Math.min(99, Math.floor(rawScore)));
            },

            updateDashboardUI(snr) {
                const { tei, hrv, rr, bpm } = this.state.results;
                
                // TEI Display
                const ring = document.getElementById('score-ring');
                const elScore = document.getElementById('tei-score');
                const elGrade = document.getElementById('tei-grade');
                
                // Smooth number update
                const cur = parseInt(elScore.innerText)||0;
                if(cur !== tei) elScore.innerText = cur + (tei>cur?1:-1);

                // Hide score if low confidence
                if(this.state.confidence < 20) {
                    elScore.innerText = "--";
                    elGrade.innerText = "CALIBRATING...";
                    elGrade.style.color = "#666";
                    ring.style.stroke = "#333";
                } else {
                    const offset = 628 - (628*(tei/100));
                    ring.style.strokeDashoffset = offset;
                    
                    if(tei>=80) { ring.style.stroke="var(--score-high)"; elGrade.innerText="OPTIMAL FLOW"; elGrade.style.color=ring.style.stroke; }
                    else if(tei>=60) { ring.style.stroke="var(--score-mid)"; elGrade.innerText="BALANCED"; elGrade.style.color=ring.style.stroke; }
                    else { ring.style.stroke="var(--score-low)"; elGrade.innerText="HIGH STRESS"; elGrade.style.color=ring.style.stroke; }
                }

                // Confidence
                document.getElementById('confidence-txt').innerText = this.state.confidence + "%";
                document.getElementById('confidence-bar').style.width = this.state.confidence + "%";
                if(this.state.confidence >= 100) {
                    document.getElementById('confidence-bar').style.background = "var(--matrix-green)";
                    document.getElementById('analysis-state').innerText = "SYSTEM LOCKED";
                    document.getElementById('analysis-state').style.color = "var(--matrix-green)";
                    document.getElementById('analysis-state').classList.remove('animate-pulse');
                }

                // Values
                document.getElementById('bpm-val').innerText = bpm;
                document.getElementById('hrv-val').innerText = hrv + " ms";
                document.getElementById('rr-val').innerText = rr;

                // Spectrum
                let pns = Math.min(95, Math.max(5, (hrv/120)*100));
                document.getElementById('bar-pns').style.width = pns + "%";
                document.getElementById('bar-sns').style.width = (100-pns) + "%";

                // Log
                const log = document.getElementById('log-msg');
                if(snr < 1.5) { log.innerText = "Signal weak. Adjust lighting."; log.style.color = "#FFD600"; }
                else { log.innerText = "Signal optimal. Analyzing..."; log.style.color = "#fff"; }
            },

            async initCamera() {
                const video = document.getElementById('input-video');
                this.video = video;
                this.roiCtx = document.getElementById('roi-canvas').getContext('2d', {willReadFrequently: true});
                
                try {
                    const faceMesh = new FaceMesh({locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`});
                    faceMesh.setOptions({maxNumFaces: 1, minDetectionConfidence: 0.5});
                    faceMesh.onResults(res => {
                        if(res.multiFaceLandmarks && res.multiFaceLandmarks.length > 0) {
                            this.state.faceFound = true;
                            document.getElementById('status-badge').innerText = "FACE LOCKED";
                            document.getElementById('status-badge').style.color = "#00FF94";
                            if(this.state.scanning || this.state.accumulating) this.processROI();
                        } else {
                            this.state.faceFound = false;
                            document.getElementById('status-badge').innerText = "WAITING";
                            document.getElementById('status-badge').style.color = "gray";
                        }
                    });
                    const camera = new Camera(video, { onFrame: async () => { await faceMesh.send({image: video}); }, width: 320, height: 240 });
                    await camera.start();
                    this.state.cameraReady = true;
                    document.getElementById('camera-loading').classList.remove('active');
                } catch(e) { 
                    document.getElementById('camera-loading').innerHTML = "HTTPS REQUIRED"; 
                }
            },

            processROI() {
                const w=64, h=64;
                this.roiCtx.drawImage(this.video, 0, 0, w, h);
                const frame = this.roiCtx.getImageData(32-5, 32-20, 10, 10); // Center crop
                const data = frame.data;
                let r=0, g=0, b=0;
                for(let i=0; i<data.length; i+=4) { r+=data[i]; g+=data[i+1]; b+=data[i+2]; }
                const c = data.length/4;
                // Send to Worker
                worker.postMessage({ r: r/c, g: g/c, b: b/c, t: performance.now() });
            },

            // --- Visuals & Interaction ---
            updateRealtimeGraph(val) {
                // Normalize for graph
                let norm = (val + 2) / 4; norm = Math.max(0, Math.min(1, norm));
                this.graphBuffer.push(norm); if(this.graphBuffer.length>40) this.graphBuffer.shift();
                
                // Draw Pulse
                const ctx = this.pulseCtx; const w = this.pulseCanvas.width; const h = this.pulseCanvas.height;
                const gap=2, barW=(w/40)-gap;
                ctx.clearRect(0,0,w,h);
                this.graphBuffer.forEach((v, i) => {
                    let bh = v*h*0.9 + 2; const x = i*(barW+gap); const y = h-bh;
                    ctx.fillStyle = `rgba(0, 240, 255, ${v+0.2})`;
                    ctx.fillRect(x,y,barW,bh);
                });
                
                // Draw Breath (Simulated Flow)
                const bCtx = this.breathCtx; 
                bCtx.clearRect(0,0,w,h);
                this.breathTime += 0.05;
                bCtx.beginPath(); bCtx.strokeStyle="#00FF94"; bCtx.lineWidth=2;
                for(let x=0; x<w; x++) { bCtx.lineTo(x, (h/2)+Math.sin(x*0.05+this.breathTime)*(h/3)); }
                bCtx.stroke();
            },

            initGraphs() {
                this.pulseCanvas = document.getElementById('pulse-canvas'); this.pulseCtx = this.pulseCanvas.getContext('2d');
                this.breathCanvas = document.getElementById('breath-canvas'); this.breathCtx = this.breathCanvas.getContext('2d');
                this.breathTime = 0;
            },

            initInteraction() {
                const btn = document.getElementById('scan-trigger');
                const start = (e) => {
                    e.preventDefault();
                    if(!this.state.cameraReady || !this.state.faceFound) return;
                    this.state.scanning = true;
                    document.getElementById('scan-icon').classList.add('text-cyan-400');
                    document.getElementById('pulse-ring').style.borderColor = '#00F0FF';
                    document.getElementById('pulse-ring').style.transform = 'scale(1.1)';
                    
                    let p=0;
                    this.scanTimer = setInterval(() => {
                        p+=4; // 1.25s Fast Scan
                        if(p>=100) { clearInterval(this.scanTimer); this.completeScan(); }
                    }, 50);
                };
                btn.addEventListener('mousedown', start); btn.addEventListener('touchstart', start);
            },

            completeScan() {
                document.getElementById('hud-layer').classList.add('hidden-ui');
                document.getElementById('universe').classList.add('dimmed');
                document.getElementById('dashboard-layer').classList.add('show');
                // Initial rough guess to populate UI
                this.state.results.bpm = 72; this.state.accumulating = true;
            },

            initThree() {
                const c = document.getElementById('universe');
                this.scene = new THREE.Scene();
                this.camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
                this.camera.position.z = 5;
                this.renderer = new THREE.WebGLRenderer({alpha:true});
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                c.appendChild(this.renderer.domElement);
                const geo = new THREE.BufferGeometry(); const pos = new Float32Array(3000*3);
                for(let i=0; i<9000; i++) pos[i] = (Math.random()-0.5)*15;
                geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
                const mat = new THREE.PointsMaterial({size: 0.03, color: 0x00ffff, transparent:true, opacity:0.4});
                this.stars = new THREE.Points(geo, mat);
                this.scene.add(this.stars);
                this.animateThree();
            },
            animateThree() {
                requestAnimationFrame(()=>this.animateThree());
                this.stars.rotation.y += 0.0005;
                this.renderer.render(this.scene, this.camera);
            },
            reset() { location.reload(); }
        };

        window.onload = () => app.init();
    </script>
</body>
</html>
