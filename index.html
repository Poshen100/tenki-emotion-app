<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TENKI v25.2 - Bio Safe</title>
    
    <!-- 字體庫 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Playfair+Display:ital,wght@0,400;1,400&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- 核心引擎 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    
    <!-- UI 庫 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --bg-deep: #050510;
            --plasma-cyan: #00F0FF; 
            --electric-rose: #FF0055;
            --void-purple: #7000FF;
            --bio-green: #00FF94;
            --glass-bg: rgba(15, 20, 25, 0.92);
            --glass-border: rgba(255, 255, 255, 0.1);
            --card-radius: 32px;
        }

        body {
            background: var(--bg-deep); color: white;
            font-family: 'Inter', sans-serif; overflow: hidden;
            width: 100vw; height: 100dvh; margin: 0; padding: 0;
            -webkit-tap-highlight-color: transparent; user-select: none;
        }
        .font-mono-tech { font-family: 'Space Mono', monospace; }
        .font-serif-human { font-family: 'Playfair Display', serif; }

        /* Layers */
        #universe { position: absolute; inset: 0; z-index: 1; background: radial-gradient(circle at center, #111 0%, #000 100%); transition: opacity 1s; }
        #universe.dimmed { opacity: 0.3; filter: blur(15px); }
        #input-video { position: fixed; top: 0; left: 0; opacity: 0; pointer-events: none; }
        #rppg-canvas { position: fixed; top: 0; left: 0; opacity: 0; pointer-events: none; }

        /* HUD Layer */
        #hud-layer {
            position: absolute; inset: 0; z-index: 10; pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 24px; padding-bottom: calc(30px + env(safe-area-inset-bottom));
            transition: opacity 0.5s;
        }
        #hud-layer.hidden-ui { opacity: 0; pointer-events: none; transform: scale(1.05); }

        /* Scanner Button */
        .fingerprint-wrapper {
            position: relative; width: 110px; height: 110px;
            display: flex; justify-content: center; align-items: center;
            pointer-events: auto; cursor: pointer; border-radius: 50%;
            transition: transform 0.2s;
        }
        .fingerprint-core {
            width: 80px; height: 80px; border-radius: 50%;
            background: rgba(10, 10, 15, 0.6); border: 1px solid rgba(255,255,255,0.15);
            display: flex; justify-content: center; align-items: center;
            backdrop-filter: blur(12px); position: relative; overflow: hidden; z-index: 20;
            box-shadow: 0 0 20px rgba(0,0,0,0.5); transition: all 0.4s;
        }
        .scan-beam {
            position: absolute; top: -100%; left: 0; width: 100%; height: 50%;
            background: linear-gradient(to bottom, transparent 0%, var(--bio-green) 90%, #fff 100%);
            opacity: 0; pointer-events: none; z-index: 21;
        }
        .progress-svg { position: absolute; top: -5px; left: -5px; width: 120px; height: 120px; transform: rotate(-90deg); z-index: 30; pointer-events: none; }
        .progress-circle {
            fill: none; stroke: var(--bio-green); stroke-width: 3; stroke-linecap: round;
            stroke-dasharray: 339; stroke-dashoffset: 339; transition: stroke-dashoffset 0.05s linear;
            filter: drop-shadow(0 0 6px var(--bio-green));
        }
        .fingerprint-wrapper.active { transform: scale(0.95); }
        .fingerprint-wrapper.active .fingerprint-core { border-color: var(--bio-green); background: rgba(0, 20, 10, 0.9); box-shadow: 0 0 30px rgba(0, 255, 148, 0.3); }
        .fingerprint-wrapper.active .scan-beam { opacity: 1; animation: beam-scan 1s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
        @keyframes beam-scan { 0% { top: -100%; opacity: 0; } 100% { top: 150%; opacity: 0; } }

        /* Dashboard */
        #dashboard-layer {
            position: absolute; inset: 0; z-index: 50; background: transparent;
            display: flex; flex-direction: column; padding: 24px 20px 140px 20px; 
            overflow-y: auto; opacity: 0; pointer-events: none; transform: translateY(40px);
            transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        #dashboard-layer.show { opacity: 1; pointer-events: auto; transform: translateY(0); }

        .bento-card {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            border-radius: var(--card-radius); padding: 24px;
            backdrop-filter: blur(40px); display: flex; flex-direction: column; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            position: relative; overflow: hidden;
        }

        /* Real-Time Pulse Graph */
        .bio-graph-container {
            width: 100%; height: 60px; display: flex; align-items: flex-end; gap: 3px;
            mask-image: linear-gradient(to right, transparent, black 10%);
        }
        .bio-bar {
            flex: 1; background: var(--electric-rose); opacity: 0.8; border-radius: 2px;
            transition: height 0.05s linear;
        }

        /* Signal Quality Dot */
        .signal-dot {
            width: 8px; height: 8px; border-radius: 50%; background: #333;
            box-shadow: 0 0 0 rgba(0,0,0,0); transition: all 0.3s;
        }
        .signal-dot.good { background: var(--bio-green); box-shadow: 0 0 10px var(--bio-green); }
        .signal-dot.bad { background: var(--electric-rose); box-shadow: 0 0 10px var(--electric-rose); animation: blink-fast 0.5s infinite; }
        @keyframes blink-fast { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* Align Hint */
        #align-hint-capsule {
             position: absolute; top: 15%; left: 50%; transform: translate(-50%, -20px) scale(0.9);
             background: rgba(0,0,0,0.6); padding: 8px 16px; rounded-full; border: 1px solid rgba(255,255,255,0.1);
             opacity: 0; pointer-events: none; transition: all 0.3s;
        }
        #align-hint-capsule.show { opacity: 1; transform: translate(-50%, 0) scale(1); }

        /* DOCK */
        .dock-container {
            position: fixed; bottom: calc(30px + env(safe-area-inset-bottom));
            left: 20px; right: 20px; height: 72px;
            background: rgba(10, 10, 15, 0.9); backdrop-filter: blur(30px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 40px;
            display: flex; align-items: center; justify-content: space-between; padding: 0 10px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6); transform: translateY(150px); 
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); z-index: 100;
        }
        #dashboard-layer.show .dock-container { transform: translateY(0); }
    </style>
</head>
<body>
    <video id="input-video" playsinline></video>
    <canvas id="rppg-canvas" width="100" height="100"></canvas>
    <div id="universe"></div>

    <!-- HUD -->
    <div id="hud-layer">
        <div id="align-hint-capsule" class="rounded-full flex items-center gap-2">
             <i data-lucide="scan" class="w-4 h-4 text-white"></i>
             <span id="hint-text" class="text-xs font-bold text-white tracking-widest">CENTER FACE</span>
        </div>

        <div class="flex justify-between items-start">
            <div>
                <div class="text-xl font-bold tracking-[6px] text-white font-mono-tech">TENKI</div>
                <div class="text-[8px] text-[#00FF94] tracking-widest mt-1 font-mono-tech">v25.2 BIO-SAFE</div>
            </div>
            <div class="text-right">
                <div class="flex items-center gap-2 mb-1 justify-end">
                    <div id="signal-dot" class="signal-dot"></div>
                    <span class="text-[9px] text-gray-400 font-bold tracking-widest">RPPG SIGNAL</span>
                </div>
                <div id="bio-debug" class="text-[9px] text-gray-500 font-mono-tech">STANDBY</div>
            </div>
        </div>

        <div class="flex flex-col items-center pb-10">
            <div id="scan-trigger-wrapper" class="fingerprint-wrapper">
                <svg class="progress-svg" viewBox="0 0 120 120">
                    <circle cx="60" cy="60" r="54" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="3"></circle>
                    <circle id="scan-progress-bar" class="progress-circle" cx="60" cy="60" r="54"></circle>
                </svg>
                <div class="fingerprint-core">
                    <div class="scan-beam"></div>
                    <i data-lucide="activity" class="w-10 h-10 text-white/80"></i>
                </div>
            </div>
            <div id="instruction" class="mt-8 text-[10px] tracking-[3px] text-gray-400 font-mono-tech font-bold">
                HOLD FOR BIO-SYNC
            </div>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard-layer">
        <div class="flex justify-between items-center mb-6 px-2">
            <div>
                <div class="text-[10px] text-[#00FF94] font-mono-tech tracking-[0.2em] mb-1">REAL-TIME BIOMETRICS</div>
                <div class="text-2xl text-white font-serif-human italic">Physiological State</div>
            </div>
            <div class="h-8 px-3 rounded-full bg-[#00FF94]/10 border border-[#00FF94]/30 flex items-center gap-2">
                <i data-lucide="cpu" class="w-3 h-3 text-[#00FF94]"></i>
                <span class="text-[10px] text-[#00FF94] font-bold tracking-wider">FILTER ACTIVE</span>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <!-- REAL BPM -->
            <div class="col-span-2 bento-card py-6 bg-gradient-to-r from-white/5 to-transparent">
                <div class="flex justify-between items-center mb-4">
                    <div class="flex items-center gap-2">
                        <i data-lucide="heart" class="w-5 h-5 text-rose-500 fill-rose-500/20 animate-pulse"></i>
                        <span class="text-xs font-bold text-gray-400 tracking-widest">HEART RATE</span>
                    </div>
                    <span id="bpm-val" class="text-6xl font-bold text-white tracking-tighter leading-none">--</span>
                </div>
                <div class="bio-graph-container" id="ppg-graph">
                    <!-- Bars injected by JS -->
                </div>
                <div class="text-[9px] text-gray-500 mt-2 font-mono-tech text-right">SOURCE: RPPG / ECTOPIC FILTER ENABLED</div>
            </div>

            <!-- REAL HRV -->
            <div class="bento-card h-40 justify-between">
                <div class="flex justify-between items-start">
                    <span class="text-[10px] text-gray-400 font-bold uppercase">HRV (rMSSD)</span>
                    <i data-lucide="waveform" class="w-4 h-4 text-[#00FF94]"></i>
                </div>
                <div>
                    <div id="hrv-val" class="text-4xl font-bold text-white mb-1">--</div>
                    <div class="text-[10px] text-[#00FF94]" id="hrv-status">Calculating...</div>
                </div>
                <div class="w-full bg-white/10 h-1 mt-2 rounded-full overflow-hidden">
                    <div id="hrv-bar" class="h-full bg-[#00FF94] transition-all duration-1000" style="width: 0%"></div>
                </div>
            </div>

            <!-- POSTURE (Hybrid) -->
            <div class="bento-card h-40 justify-between">
                <div class="flex justify-between items-start">
                    <span class="text-[10px] text-gray-400 font-bold uppercase">Posture Axis</span>
                    <i data-lucide="move" class="w-4 h-4 text-cyan-400"></i>
                </div>
                <div class="flex-1 flex items-center justify-center relative">
                    <div class="w-full h-[1px] bg-white/20 absolute"></div>
                    <div class="h-full w-[1px] bg-white/20 absolute"></div>
                    <div id="posture-dot" class="w-4 h-4 bg-cyan-400 rounded-full shadow-[0_0_15px_#00F0FF] transition-all duration-300"></div>
                </div>
                <div class="text-[9px] text-center text-gray-400 mt-1" id="posture-text">CENTERED</div>
            </div>
            
            <!-- STABILITY (Proxy for Focus) -->
            <div class="col-span-2 bento-card py-4 flex-row items-center justify-between">
                <div class="text-[10px] text-gray-400 font-bold uppercase flex items-center gap-2">
                    <i data-lucide="eye" class="w-3 h-3"></i> Neuro Focus
                </div>
                <div class="text-xl font-bold text-white" id="stability-val">--%</div>
            </div>
        </div>

        <div class="dock-container">
            <div class="dock-btn"><i data-lucide="activity" class="w-5 h-5"></i></div>
            <div class="dock-main-action" onclick="location.reload()">
                <i data-lucide="rotate-ccw" class="w-4 h-4 mr-2 text-black"></i> RECALIBRATE
            </div>
            <div class="dock-btn"><i data-lucide="settings" class="w-5 h-5"></i></div>
        </div>
    </div>

    <!-- WEB WORKER SCRIPT (v25.2 Arrhythmia Safe) -->
    <script id="worker-script" type="javascript/worker">
        let buffer = [];
        const BUFFER_SIZE = 240; // 8 seconds buffer for stable median
        let hrvHistory = []; // For smoothing output
        
        self.onmessage = function(e) {
            const { val, type } = e.data;
            if (type === 'reset') { 
                buffer = []; 
                hrvHistory = [];
                return; 
            }

            // 1. Buffer Management
            buffer.push(val);
            if (buffer.length > BUFFER_SIZE) buffer.shift();

            if (buffer.length < 90) {
                self.postMessage({ status: 'buffering', count: buffer.length });
                return;
            }

            // 2. Detrending (Remove baseline drift)
            const detrended = [];
            const windowSize = 15;
            for(let i = 0; i < buffer.length; i++) {
                let sum = 0, count = 0;
                const start = Math.max(0, i - windowSize);
                const end = Math.min(buffer.length, i + windowSize);
                for(let j = start; j < end; j++) { sum += buffer[j]; count++; }
                detrended.push(buffer[i] - (sum / count));
            }

            // 3. Dynamic Thresholding (Robust Peak Detection)
            let min = 0, max = 0;
            detrended.forEach(v => {
                if(v < min) min = v;
                if(v > max) max = v;
            });
            
            // 55% threshold to catch weaker beats but avoid noise
            const threshold = max * 0.55; 
            const peaks = [];
            const minPeakDist = 9; // Debounce

            for(let i = 2; i < detrended.length - 2; i++) {
                const v = detrended[i];
                if(v > threshold && v > detrended[i-1] && v > detrended[i-2] && v > detrended[i+1] && v > detrended[i+2]) {
                    if (peaks.length === 0 || (i - peaks[peaks.length-1]) > minPeakDist) {
                        peaks.push(i);
                    }
                }
            }

            // 4. Calculate Stats with Ectopic Filtering
            let bpm = 0;
            let finalHrv = 0;

            if (peaks.length > 4) {
                const rrIntervals = [];
                for(let i = 1; i < peaks.length; i++) {
                    const diff = peaks[i] - peaks[i-1];
                    // Broad filter for physics limits
                    if(diff > 8 && diff < 50) { 
                        rrIntervals.push(diff);
                    }
                }

                if(rrIntervals.length > 3) {
                    // A. Median Filter
                    const sortedRR = [...rrIntervals].sort((a,b) => a-b);
                    const medianRR = sortedRR[Math.floor(sortedRR.length / 2)];

                    // B. Filter Ectopic Beats (deviating > 25% from median)
                    const validRR = rrIntervals.filter(rr => {
                        const deviation = Math.abs(rr - medianRR);
                        return deviation < (medianRR * 0.25);
                    });
                    
                    // Fallback if too many filtered
                    const calcRR = validRR.length > 2 ? validRR : rrIntervals;

                    // C. BPM
                    let totalDiff = 0;
                    calcRR.forEach(d => totalDiff += d);
                    const avgDiff = totalDiff / calcRR.length;
                    bpm = Math.round(60 / (avgDiff / 30));

                    // D. HRV (rMSSD)
                    let sumSq = 0;
                    for(let i=0; i<calcRR.length-1; i++) {
                        const t1 = calcRR[i] * 33.3;
                        const t2 = calcRR[i+1] * 33.3;
                        const d = t1 - t2;
                        sumSq += d*d;
                    }
                    const rawHrv = Math.sqrt(sumSq / (calcRR.length - 1));

                    // E. Smoothing
                    hrvHistory.push(rawHrv);
                    if(hrvHistory.length > 5) hrvHistory.shift();
                    let hSum = 0; hrvHistory.forEach(h => hSum += h);
                    finalHrv = Math.round(hSum / hrvHistory.length);
                }
            }

            // Visualization
            const lastVal = detrended[detrended.length-1];
            const range = max - min || 1;
            const graphVal = Math.max(0, Math.min(100, ((lastVal - min) / range) * 100));

            self.postMessage({ 
                status: 'active', 
                bpm: Math.min(180, Math.max(40, bpm)), 
                hrv: Math.min(120, finalHrv), // Clamp HRV visual
                raw: graphVal 
            });
        };
    </script>

    <!-- MAIN APP -->
    <script>
        lucide.createIcons();

        // --- Create Inline Worker ---
        const workerBlob = new Blob([document.getElementById('worker-script').textContent], {type: "text/javascript"});
        const worker = new Worker(window.URL.createObjectURL(workerBlob));
        
        const app = {
            state: { isScanning: false, isSensorActive: false, bpm: 0, hrv: 0, graphData: new Array(40).fill(50), posture: {x:0, y:0} },
            
            init: function() {
                this.initThree();
                this.initWorkerHandler();
                this.initEvents();
                
                const container = document.getElementById('ppg-graph');
                for(let i=0; i<40; i++) {
                    const d = document.createElement('div');
                    d.className = 'bio-bar';
                    d.style.height = '10%';
                    container.appendChild(d);
                }
            },

            initThree: function() {
                const container = document.getElementById('universe');
                this.scene = new THREE.Scene();
                this.camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
                this.camera.position.z = 5;
                this.renderer = new THREE.WebGLRenderer({ alpha: true });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                container.appendChild(this.renderer.domElement);
                
                // Particles
                const geo = new THREE.BufferGeometry();
                const pos = new Float32Array(3000*3);
                for(let i=0; i<3000*3; i++) pos[i] = (Math.random()-0.5)*10;
                geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
                const mat = new THREE.PointsMaterial({ size: 0.05, color: 0x00FF94, transparent: true, opacity: 0.5 });
                this.cloud = new THREE.Points(geo, mat);
                this.scene.add(this.cloud);
                this.animate();
            },

            animate: function() {
                requestAnimationFrame(() => this.animate());
                this.cloud.rotation.y += 0.001;
                this.renderer.render(this.scene, this.camera);
            },

            initWorkerHandler: function() {
                worker.onmessage = (e) => {
                    const { status, bpm, hrv, raw, count } = e.data;
                    const debug = document.getElementById('bio-debug');
                    const dot = document.getElementById('signal-dot');
                    
                    if (status === 'buffering') {
                        debug.innerText = `CALIBRATING ${Math.floor((count/90)*100)}%`;
                        dot.className = 'signal-dot bad';
                    } else if (status === 'active') {
                        debug.innerText = `SIGNAL LOCKED`;
                        dot.className = 'signal-dot good';
                        
                        // Update Data
                        if (bpm > 45 && bpm < 140) {
                            this.state.bpm += (bpm - this.state.bpm) * 0.1; // Smooth
                            document.getElementById('bpm-val').innerText = Math.round(this.state.bpm);
                        }
                        if (hrv > 0) {
                            this.state.hrv = hrv;
                            document.getElementById('hrv-val').innerText = hrv;
                            document.getElementById('hrv-bar').style.width = Math.min(100, (hrv/120)*100) + '%';
                            
                            let statusText = "Analyzing";
                            if(hrv < 20) statusText = "Needs Rest";
                            else if(hrv < 50) statusText = "Normal Range";
                            else statusText = "High Resilience";
                            document.getElementById('hrv-status').innerText = statusText;
                        }

                        // Update Graph
                        this.state.graphData.shift();
                        this.state.graphData.push(raw);
                        const bars = document.querySelectorAll('.bio-bar');
                        bars.forEach((b, i) => {
                            b.style.height = this.state.graphData[i] + '%';
                            b.style.opacity = this.state.graphData[i] > 60 ? 1 : 0.5;
                        });
                    }
                };
            },

            startSensors: async function() {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 240, frameRate: 30 } });
                    const video = document.getElementById('input-video');
                    video.srcObject = stream;
                    await video.play();

                    const canvas = document.getElementById('rppg-canvas');
                    const ctx = canvas.getContext('2d', { willReadFrequently: true });

                    const faceMesh = new FaceMesh({locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`});
                    faceMesh.setOptions({maxNumFaces: 1, minDetectionConfidence: 0.5});
                    
                    faceMesh.onResults(res => {
                        if (res.multiFaceLandmarks && res.multiFaceLandmarks.length > 0) {
                            const lm = res.multiFaceLandmarks[0];
                            const hint = document.getElementById('align-hint-capsule');
                            
                            // Posture
                            const nx = lm[1].x;
                            if (nx < 0.35 || nx > 0.65) hint.classList.add('show');
                            else hint.classList.remove('show');

                            this.state.posture.x = (lm[1].x - 0.5) * 50; 
                            this.state.posture.y = (lm[1].y - 0.5) * 50;
                            const dot = document.getElementById('posture-dot');
                            if(dot) dot.style.transform = `translate(${this.state.posture.x}px, ${this.state.posture.y}px)`;

                            // Focus (Stability)
                            const stab = Math.max(0, 100 - (Math.abs(this.state.posture.x) + Math.abs(this.state.posture.y))*2);
                            const stabEl = document.getElementById('stability-val');
                            if(stabEl) stabEl.innerText = Math.floor(stab) + "%";

                            // rPPG Extraction
                            const width = video.videoWidth;
                            const height = video.videoHeight;
                            const fx = Math.floor(lm[10].x * width);
                            const fy = Math.floor(lm[10].y * height);
                            
                            if (this.state.isScanning) {
                                try {
                                    ctx.drawImage(video, fx - 5, fy + 5, 10, 10, 0, 0, 10, 10);
                                    const frame = ctx.getImageData(0, 0, 10, 10);
                                    const data = frame.data;
                                    let greenSum = 0;
                                    for(let i = 0; i < data.length; i += 4) greenSum += data[i+1];
                                    const avgGreen = greenSum / (data.length / 4);
                                    worker.postMessage({ type: 'data', val: avgGreen });
                                } catch(e) {}
                            }
                        }
                    });

                    const camera = new Camera(video, {
                        onFrame: async () => { await faceMesh.send({image: video}); },
                        width: 320, height: 240
                    });
                    camera.start();
                    this.state.isSensorActive = true;

                } catch(e) {
                    console.error("Camera Error", e);
                    document.getElementById('instruction').innerText = "CAMERA ERROR";
                }
            },

            initEvents: function() {
                const btn = document.getElementById('scan-trigger-wrapper');
                const ring = document.getElementById('scan-progress-bar');
                
                const start = (e) => {
                    e.preventDefault();
                    if(!this.state.isSensorActive) {
                        this.startSensors();
                        document.getElementById('instruction').innerText = "KEEP STILL";
                        return;
                    }
                    this.state.isScanning = true;
                    worker.postMessage({ type: 'reset' });
                    
                    btn.classList.add('active');
                    document.getElementById('instruction').innerText = "CALIBRATING...";
                    
                    if(navigator.vibrate) navigator.vibrate(50);
                    
                    let p = 0;
                    this.scanTimer = setInterval(() => {
                        p++;
                        ring.style.strokeDashoffset = 339 - ((p/100)*339);
                        if (p > 100) {
                             const debugText = document.getElementById('bio-debug').innerText;
                             if(debugText.includes('SIGNAL LOCKED')) {
                                 this.finishScan();
                             } else { p = 80; }
                        }
                    }, 50);
                };

                const end = (e) => {
                    if (this.state.isScanning && !document.getElementById('dashboard-layer').classList.contains('show')) {
                        this.state.isScanning = false;
                        clearInterval(this.scanTimer);
                        btn.classList.remove('active');
                        ring.style.strokeDashoffset = 339;
                        document.getElementById('instruction').innerText = "HOLD TO SYNC";
                        worker.postMessage({ type: 'reset' });
                    }
                };

                btn.addEventListener('mousedown', start); btn.addEventListener('touchstart', start);
                window.addEventListener('mouseup', end); window.addEventListener('touchend', end);
            },

            finishScan: function() {
                clearInterval(this.scanTimer);
                if(navigator.vibrate) navigator.vibrate([50, 50, 100]);
                document.getElementById('hud-layer').classList.add('hidden-ui');
                document.getElementById('universe').classList.add('dimmed');
                setTimeout(() => {
                    document.getElementById('dashboard-layer').classList.add('show');
                }, 300);
            }
        };

        window.onload = () => app.init();
    </script>
</body>
</html>
