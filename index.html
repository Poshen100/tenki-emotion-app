<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TENKI v50 - Vitality</title>
    
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@100;300;500;700&family=Inter:wght@300;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --bg-void: #000000;
            --vital-green: #30FF8F; /* Apple Health Green */
            --vital-blue: #0A84FF;
            --vital-orange: #FF9F0A;
            --vital-red: #FF453A;
            --glass: rgba(255, 255, 255, 0.08);
        }

        body {
            background: var(--bg-void); color: white;
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden; width: 100vw; height: 100dvh;
            margin: 0; user-select: none; -webkit-tap-highlight-color: transparent;
        }

        /* 3D Atmosphere */
        #universe { position: absolute; inset: 0; z-index: 1; transition: opacity 2s; opacity: 0.6; }

        /* Main Container */
        #app-container {
            position: relative; z-index: 10; height: 100%; width: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        /* 🟢 The Living Orb (生命光球) */
        .orb-container {
            position: relative; width: 280px; height: 280px;
            display: flex; justify-content: center; align-items: center;
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        .orb-glow {
            position: absolute; inset: 0; border-radius: 50%;
            background: radial-gradient(circle, rgba(48, 255, 143, 0.2) 0%, transparent 70%);
            filter: blur(40px); transform: scale(0.8);
            transition: all 0.3s;
            animation: breathe-idle 4s infinite ease-in-out;
        }
        
        /* State-based Orb Colors */
        .orb-container.state-scanning .orb-glow { background: radial-gradient(circle, rgba(10, 132, 255, 0.4) 0%, transparent 70%); }
        .orb-container.state-locked .orb-glow { background: radial-gradient(circle, rgba(48, 255, 143, 0.5) 0%, transparent 70%); }
        .orb-container.state-stress .orb-glow { background: radial-gradient(circle, rgba(255, 69, 58, 0.4) 0%, transparent 70%); }

        .orb-ring-svg {
            position: absolute; width: 100%; height: 100%; transform: rotate(-90deg);
        }
        .orb-track { fill: none; stroke: rgba(255,255,255,0.1); stroke-width: 2; }
        .orb-progress { 
            fill: none; stroke: var(--vital-green); stroke-width: 4; stroke-linecap: round;
            stroke-dasharray: 879; stroke-dashoffset: 879; 
            transition: stroke-dashoffset 0.1s linear, stroke 1s;
        }

        /* Dynamic Typography */
        .main-value { font-size: 86px; font-weight: 200; letter-spacing: -2px; line-height: 1; text-shadow: 0 0 30px rgba(255,255,255,0.1); }
        .sub-label { font-size: 13px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.5); margin-top: 10px; }
        
        /* The Pulse Graph (Minimalist) */
        .pulse-stage {
            position: absolute; bottom: 120px; left: 0; width: 100%; height: 120px;
            pointer-events: none; mask-image: linear-gradient(to right, transparent, black 20%, black 80%, transparent);
        }

        /* Action Island (Floating Button) */
        .island {
            position: absolute; bottom: 40px; 
            width: 200px; height: 60px;
            background: rgba(30, 30, 35, 0.8); backdrop-filter: blur(20px);
            border-radius: 30px; border: 1px solid rgba(255,255,255,0.1);
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            transition: transform 0.2s, width 0.4s;
            cursor: pointer; z-index: 50;
        }
        .island:active { transform: scale(0.96); }
        .island-text { font-size: 14px; font-weight: 600; letter-spacing: 1px; }

        /* Detail Cards (Hidden initially) */
        .details-layer {
            position: absolute; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px);
            z-index: 40; opacity: 0; pointer-events: none; transition: opacity 0.5s;
            display: flex; flex-direction: column; justify-content: center; padding: 20px;
        }
        .details-layer.show { opacity: 1; pointer-events: auto; }

        .metric-row { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .metric-label { font-size: 14px; color: #888; }
        .metric-val { font-size: 20px; font-weight: 600; }

        @keyframes breathe-idle { 0%, 100% { transform: scale(0.8); opacity: 0.5; } 50% { transform: scale(1.0); opacity: 0.8; } }
        @keyframes pulse-beat { 0% { transform: scale(1); } 10% { transform: scale(1.05); } 100% { transform: scale(1); } }
        
        .beating { animation: pulse-beat 0.4s ease-out; }
        
        /* Hide Video */
        #input-video, #roi-canvas { display: none; }
    </style>
</head>
<body>

    <video id="input-video" playsinline muted autoplay></video>
    <canvas id="roi-canvas" width="64" height="64"></canvas>
    
    <div id="universe"></div>

    <div id="app-container">
        
        <!-- 1. The Living Orb (Centerpiece) -->
        <div class="orb-container" id="orb">
            <div class="orb-glow" id="orb-glow"></div>
            <svg class="orb-ring-svg" viewBox="0 0 300 300">
                <circle cx="150" cy="150" r="140" class="orb-track"></circle>
                <circle id="orb-progress" cx="150" cy="150" r="140" class="orb-progress" stroke-dashoffset="879"></circle>
            </svg>
            
            <div class="absolute inset-0 flex flex-col items-center justify-center">
                <!-- Dynamic Content -->
                <div id="display-value" class="main-value">--</div>
                <div id="display-label" class="sub-label">START SCAN</div>
            </div>
        </div>

        <!-- 2. The Pulse Wave (Always Alive) -->
        <div class="pulse-stage">
            <canvas id="wave-canvas" width="400" height="120"></canvas>
        </div>

        <!-- 3. Dynamic Island Button -->
        <div class="island" id="action-btn">
            <span class="island-text" id="action-text">TAP TO MEASURE</span>
        </div>
    </div>

    <!-- 4. Detailed Results (Overlay) -->
    <div class="details-layer" id="details-view">
        <div class="text-center mb-10">
            <div class="text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Mental Fitness</div>
            <div class="text-5xl font-bold" id="result-score">82</div>
            <div class="text-xl text-green-400 mt-2" id="result-state">Optimal Flow</div>
        </div>
        
        <div class="metric-row">
            <span class="metric-label">Heart Rate Variability</span>
            <span class="metric-val" id="res-hrv">-- ms</span>
        </div>
        <div class="metric-row">
            <span class="metric-label">Stress Load (SNS)</span>
            <div class="flex items-center gap-2">
                <div class="w-24 h-1 bg-gray-800 rounded-full overflow-hidden">
                    <div id="res-stress-bar" class="h-full bg-orange-500 w-0"></div>
                </div>
                <span class="metric-val" id="res-stress">--%</span>
            </div>
        </div>
        <div class="metric-row">
            <span class="metric-label">Respiration Rate</span>
            <span class="metric-val" id="res-rr">-- br/min</span>
        </div>
        
        <button onclick="app.reset()" class="mt-10 w-full py-4 bg-white text-black rounded-2xl font-bold text-sm hover:bg-gray-200 transition">
            DONE
        </button>
    </div>

    <!-- 🟢 SYSTEM CORE (Signal Blending Technology) -->
    <script>
        // --- 1. Signal Blender (The Magic Sauce) ---
        // This ensures the graph NEVER looks dead.
        class SignalBlender {
            constructor() {
                this.time = 0;
                this.ghostPhase = 0;
                this.confidence = 0; // 0.0 to 1.0
                this.lastRealVal = 0;
            }

            // Input: Real signal from rPPG, and Confidence level
            blend(realSignal, snr) {
                this.time += 0.1;
                
                // Calculate Confidence (Smooth transition)
                const targetConf = Math.min(1.0, Math.max(0, (snr - 1.5) / 3)); // SNR 1.5 -> 0%, SNR 4.5 -> 100%
                this.confidence += (targetConf - this.confidence) * 0.1; // Soft ease
                
                // 1. Ghost Signal (Perfect Sine Wave - "Breathing")
                // Simulates a resting heart rate (~70bpm)
                const ghost = Math.sin(this.time * 0.8) * 0.3; 
                
                // 2. Real Signal (Normalized)
                let real = realSignal;
                // Clamp extreme noise
                if (real > 2) real = 2; if (real < -2) real = -2;

                // 3. Blend
                // Output = (Real * Conf) + (Ghost * (1-Conf))
                const output = (real * this.confidence) + (ghost * (1 - this.confidence));
                
                return {
                    val: output,
                    conf: this.confidence,
                    isLocked: this.confidence > 0.6
                };
            }
        }

        // --- 2. Medical Grade rPPG (Hidden Worker Logic) ---
        // Simplified for single-file, but keeps the POS logic
        class rPPGCore {
            constructor() {
                this.buffer = [];
                this.times = [];
                this.peaks = [];
                this.validIBIs = [];
                this.lastBPM = 70;
            }
            
            process(r, g, b, t) {
                // POS Projection
                const meanG = g, meanR = r; // Approx mean for short window
                let S1 = g - b;
                let S2 = g + b - 2*r;
                let signal = S1 + (S2/2);
                
                // Bandpass (Simple difference)
                this.buffer.push(signal);
                if(this.buffer.length > 9) this.buffer.shift();
                
                // Smooth signal for display
                let smooth = signal; // In real implementation, apply moving average here
                
                // Peak Detect Logic (Simplified for Demo)
                // In production, use the v34 logic. Here we simulate detection 
                // based on signal threshold crossing to drive the "Beat" animation
                let isBeat = false;
                if (signal > 0.5 && this.buffer[this.buffer.length-2] < 0.5) {
                    const ibi = t - this.lastPeak;
                    if (ibi > 300 && ibi < 1200) {
                        this.validIBIs.push(ibi);
                        if(this.validIBIs.length > 20) this.validIBIs.shift();
                        isBeat = true;
                    }
                    this.lastPeak = t;
                }

                // SNR Simulation (Variance of signal)
                // Real app would calculate RMS
                const snr = Math.abs(signal) * 5; 

                return { signal: signal, isBeat: isBeat, snr: snr, ibis: this.validIBIs };
            }
        }

        // --- 3. UI Controller (Jobs Style) ---
        const app = {
            state: 'idle', // idle, scanning, result
            blender: new SignalBlender(),
            rppg: new rPPGCore(),
            waveCtx: null,
            waveBuffer: new Array(100).fill(0),
            progress: 0,
            
            init() {
                this.initVisuals();
                this.initCamera();
                
                // Start the "Living" Loop immediately
                requestAnimationFrame(() => this.loop());
                
                // Interaction
                document.getElementById('action-btn').addEventListener('click', () => {
                    if(this.state === 'idle') this.startScan();
                });
            },

            startScan() {
                this.state = 'scanning';
                this.progress = 0;
                
                // UI Transformation
                document.getElementById('action-btn').style.transform = "scale(0)"; // Hide button
                document.getElementById('display-label').innerText = "BREATHE NORMALLY";
                document.getElementById('display-value').innerText = "--";
                document.getElementById('orb').classList.add('state-scanning');
                
                // Start Progress Timer
                this.scanTimer = setInterval(() => {
                    this.progress += 0.5; // Slow fill (~20s)
                    
                    // Update Ring
                    const maxOffset = 879;
                    const offset = maxOffset - (maxOffset * (this.progress / 100));
                    document.getElementById('orb-progress').style.strokeDashoffset = offset;
                    
                    // Update Text based on phase
                    const conf = this.blender.confidence;
                    if (this.progress < 20) {
                        document.getElementById('display-value').innerText = "";
                        document.getElementById('display-label').innerText = "CALIBRATING...";
                    } else if (conf > 0.5) {
                         // Show live BPM
                         const bpm = Math.round(60000 / (this.rppg.validIBIs.length > 0 ? (this.rppg.validIBIs.reduce((a,b)=>a+b)/this.rppg.validIBIs.length) : 850));
                         document.getElementById('display-value').innerText = bpm;
                         document.getElementById('display-label').innerText = "HEART RATE";
                         document.getElementById('orb').classList.add('state-locked');
                    } else {
                        document.getElementById('display-label').innerText = "ADJUSTING...";
                    }

                    if(this.progress >= 100) this.finishScan();
                }, 100);
            },

            finishScan() {
                clearInterval(this.scanTimer);
                this.state = 'result';
                
                // Calculate Score (Mocked Logic for Demo - Connect to v34 Engine here)
                const score = 80 + Math.floor(Math.random() * 15);
                
                // Show Result Layer
                document.getElementById('details-view').classList.add('show');
                document.getElementById('result-score').innerText = score;
                document.getElementById('result-state').innerText = score > 80 ? "Optimal State" : "Balanced";
                
                // Fill Details
                document.getElementById('res-hrv').innerText = Math.floor(40 + Math.random()*40) + " ms";
                document.getElementById('res-stress').innerText = Math.floor(20 + Math.random()*30) + "%";
                document.getElementById('res-stress-bar').style.width = document.getElementById('res-stress').innerText;
            },

            loop() {
                requestAnimationFrame(() => this.loop());
                
                // 1. Process Video Frame (If Active)
                // (Simplified: In real code, use requestVideoFrameCallback)
                let rawSignal = 0;
                let snr = 0;
                
                // 🟢 Mocking the Input for "Alive" feel without camera permission initially
                // When you integrate the v34 code, replace this block with real `processROI`
                const time = Date.now() / 1000;
                if (this.state === 'scanning') {
                     // Simulate "Finding Pulse"
                     rawSignal = Math.sin(time * 8) * (Math.random() > 0.5 ? 1 : 0.5); 
                     snr = Math.min(3, this.progress / 10); // SNR improves over time
                }

                // 2. Blend Signals (Ghost vs Real)
                const blended = this.blender.blend(rawSignal, snr);
                
                // 3. Update Visuals
                this.drawWave(blended.val);
                
                // Heartbeat Haptic Visual
                if (blended.val > 0.8 && this.lastVal <= 0.8) {
                    const orb = document.getElementById('orb-glow');
                    orb.style.transform = "scale(1.1)";
                    setTimeout(() => orb.style.transform = "scale(1.0)", 100);
                    if(this.state === 'scanning' && navigator.vibrate) navigator.vibrate(10);
                }
                this.lastVal = blended.val;
            },

            drawWave(val) {
                this.waveBuffer.push(val);
                this.waveBuffer.shift();
                
                if (!this.waveCtx) {
                    const c = document.getElementById('wave-canvas');
                    this.waveCtx = c.getContext('2d');
                }
                const ctx = this.waveCtx;
                const w = 400; const h = 120;
                
                ctx.clearRect(0, 0, w, h);
                
                // Gradient Line
                const grad = ctx.createLinearGradient(0, 0, w, 0);
                grad.addColorStop(0, "rgba(48, 255, 143, 0)");
                grad.addColorStop(0.5, "rgba(48, 255, 143, 0.5)");
                grad.addColorStop(1, "rgba(48, 255, 143, 1)");
                
                ctx.beginPath();
                ctx.strokeStyle = grad;
                ctx.lineWidth = 3;
                ctx.lineCap = 'round';
                
                for (let i = 0; i < this.waveBuffer.length; i++) {
                    const x = (i / this.waveBuffer.length) * w;
                    const y = (h/2) - (this.waveBuffer[i] * 30); // Scale amplitude
                    if (i===0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                }
                ctx.stroke();
            },

            initVisuals() {
                // Background Particles
                const container = document.getElementById('universe');
                const scene = new THREE.Scene();
                const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
                camera.position.z = 5;
                const renderer = new THREE.WebGLRenderer({alpha:true});
                renderer.setSize(window.innerWidth, window.innerHeight);
                container.appendChild(renderer.domElement);
                
                const geo = new THREE.BufferGeometry();
                const pos = new Float32Array(2000 * 3);
                for(let i=0; i<6000; i++) pos[i] = (Math.random()-0.5)*10;
                geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
                const mat = new THREE.PointsMaterial({size: 0.02, color: 0x30FF8F, transparent:true, opacity:0.3});
                const stars = new THREE.Points(geo, mat);
                scene.add(stars);
                
                const animate = () => {
                    requestAnimationFrame(animate);
                    stars.rotation.y += 0.0005;
                    renderer.render(scene, camera);
                };
                animate();
            },
            
            async initCamera() {
                // ... (Keep the v34 camera init logic here) ... 
                // For this demo, we rely on the simulation in the loop()
            },

            reset() {
                window.location.reload();
            }
        };

        window.onload = () => app.init();
    </script>
</body>
</html>
