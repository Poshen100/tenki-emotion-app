<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TENKI v25.9 - Real rPPG Core</title>
    
    <!-- 字體 & 庫 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Playfair+Display:ital,wght@0,400;0,700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --bg-deep: #050510;
            --plasma-cyan: #00F0FF; 
            --matrix-green: #00FF94;
            --alert-red: #FF0055;
            --glass-bg: rgba(12, 12, 18, 0.9);
        }

        body {
            background: var(--bg-deep); color: white;
            font-family: 'JetBrains Mono', monospace;
            overflow: hidden; width: 100vw; height: 100dvh;
            margin: 0; user-select: none;
        }

        /* 隱藏原生 Video，我們用 Canvas 處理 */
        #input-video { position: absolute; opacity: 0; pointer-events: none; }
        #rppg-canvas { position: absolute; top: -9999px; } 

        #universe { position: absolute; inset: 0; z-index: 1; opacity: 1; transition: opacity 1s; }
        #universe.dimmed { opacity: 0.3; filter: blur(10px); }

        /* HUD Layer */
        #hud-layer {
            position: absolute; inset: 0; z-index: 10; pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 24px; padding-top: calc(50px + env(safe-area-inset-top));
            padding-bottom: calc(40px + env(safe-area-inset-bottom));
        }
        #hud-layer.hidden-ui { opacity: 0; pointer-events: none; }

        /* Dashboard */
        #dashboard-layer {
            position: absolute; inset: 0; z-index: 50;
            background: transparent; display: flex; flex-direction: column;
            padding: 24px 20px 140px 20px; 
            padding-top: calc(50px + env(safe-area-inset-top));
            overflow-y: auto; opacity: 0; pointer-events: none;
            transform: translateY(30px); transition: all 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        #dashboard-layer.show { opacity: 1; pointer-events: auto; transform: translateY(0); }

        /* Components */
        .bento-card {
            background: var(--glass-bg); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 28px; padding: 20px; position: relative; overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6); backdrop-filter: blur(20px);
        }

        /* Integrity Bar (Top) */
        .integrity-track {
            width: 100%; height: 4px; background: rgba(255,255,255,0.1);
            border-radius: 2px; margin-top: 8px; overflow: hidden;
        }
        .integrity-fill {
            height: 100%; width: 0%; background: linear-gradient(90deg, #00F0FF, #00FF94);
            box-shadow: 0 0 10px var(--plasma-cyan); transition: width 0.1s linear;
        }

        /* Spectrum Bar (SNS vs PNS) */
        .spectrum-container {
            width: 100%; height: 24px; background: rgba(0,0,0,0.5); 
            border-radius: 12px; display: flex; position: relative; overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1); margin-top: 10px;
        }
        .spectrum-mid { position: absolute; left: 50%; top:0; bottom:0; width: 1px; background: #fff; z-index:10; opacity: 0.3; }
        .bar-sns { background: linear-gradient(90deg, #FF5500, #FF9900); height: 100%; transition: width 0.5s; display: flex; align-items: center; padding-left: 8px; font-size: 9px; color: black; font-weight: bold; }
        .bar-pns { background: linear-gradient(90deg, #00FF94, #00F0FF); height: 100%; transition: width 0.5s; display: flex; align-items: center; justify-content: flex-end; padding-right: 8px; font-size: 9px; color: black; font-weight: bold; }

        /* Scanner Laser */
        .scanner-laser {
            position: absolute; top: 0; left: 0; width: 100%; height: 2px;
            background: #00FF94; box-shadow: 0 0 10px #00FF94; opacity: 0;
            z-index: 20; pointer-events: none;
        }
        .scanner-active .scanner-laser { opacity: 1; animation: scan-down 1.5s infinite linear; }
        @keyframes scan-down { 0% { top: 0%; } 100% { top: 100%; } }

        /* Real-time PPG Graph */
        .ppg-canvas-container {
            width: 100%; height: 50px; position: relative; 
            mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
        }
        
        /* Fingerprint */
        .fingerprint-wrapper {
            width: 100px; height: 100px; border-radius: 50%;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            display: flex; justify-content: center; align-items: center; cursor: pointer;
            transition: all 0.3s;
        }
        .fingerprint-wrapper.active { 
            border-color: var(--plasma-cyan); background: rgba(0, 240, 255, 0.1); 
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
        }

        /* Dock */
        .dock {
            position: fixed; bottom: 30px; left: 20px; right: 20px; height: 64px;
            background: rgba(10,10,15,0.9); backdrop-filter: blur(20px);
            border-radius: 32px; border: 1px solid rgba(255,255,255,0.1);
            display: flex; align-items: center; justify-content: center; z-index: 100;
            transform: translateY(150px); transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        #dashboard-layer.show .dock { transform: translateY(0); }

        .orbit-container { width: 260px; height: 260px; margin: 0 auto; position: relative; display: flex; justify-content: center; align-items: center; }
        .metallic-text {
            background: linear-gradient(180deg, #fff, #888); -webkit-background-clip: text; color: transparent;
        }
    </style>
</head>
<body>

    <!-- Hidden Processing Layers -->
    <video id="input-video" playsinline></video>
    <canvas id="rppg-canvas"></canvas>

    <div id="universe"></div>

    <!-- HUD: SCANNER -->
    <div id="hud-layer">
        <div class="flex justify-between items-start">
            <div>
                <div class="text-xl font-bold tracking-[4px]">TENKI</div>
                <div class="text-[9px] text-cyan-400 tracking-widest mt-1">RPPG_HYBRID v25.9</div>
            </div>
            <div class="text-right">
                <div id="signal-status" class="text-[9px] border border-white/20 px-2 py-1 rounded text-gray-400">
                    SIGNAL: WAITING
                </div>
            </div>
        </div>

        <div class="flex flex-col items-center pb-20">
            <div id="scan-btn" class="fingerprint-wrapper">
                <i data-lucide="fingerprint" class="w-10 h-10 text-white/50 transition-colors duration-300" id="scan-icon"></i>
            </div>
            <div id="instruction" class="mt-6 text-[10px] tracking-[2px] text-gray-400 font-bold">
                HOLD TO ANALYZE
            </div>
        </div>
    </div>

    <!-- DASHBOARD: RESULTS -->
    <div id="dashboard-layer">
        <!-- Integrity Header -->
        <div class="mb-4">
            <div class="flex justify-between items-end mb-1">
                <div>
                    <div class="text-[10px] text-cyan-400 font-bold uppercase tracking-widest mb-1">REAL-TIME BIO-METRICS</div>
                    <div class="text-2xl font-bold text-white tracking-tight font-serif">Biological Coherence</div>
                </div>
                <div class="text-right">
                    <span id="integrity-val" class="text-xl font-mono text-white font-bold">0%</span>
                    <div class="text-[8px] text-gray-500 font-bold">DATA CONFIDENCE</div>
                </div>
            </div>
            <div class="integrity-track"><div id="integrity-fill" class="integrity-fill"></div></div>
        </div>

        <div class="grid grid-cols-2 gap-3">
            <!-- 1. TEI Score (Orbit) -->
            <div class="col-span-2 bento-card py-6 flex flex-col items-center bg-black/50">
                <div id="orbit-ring" class="orbit-container">
                    <svg class="absolute inset-0 w-full h-full rotate-[-90deg]">
                        <circle cx="130" cy="130" r="110" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="8"></circle>
                        <circle id="score-circle" cx="130" cy="130" r="110" fill="none" stroke="#00F0FF" stroke-width="8" stroke-dasharray="691" stroke-dashoffset="691" stroke-linecap="round" class="transition-all duration-1000"></circle>
                    </svg>
                    <div class="text-center z-10">
                        <div class="text-[9px] tracking-widest text-gray-500 mb-2 font-bold">TEI SCORE</div>
                        <div id="tei-val" class="text-8xl font-black metallic-text tracking-tighter">--</div>
                        <div id="tei-label" class="text-[9px] text-cyan-400 tracking-widest mt-2">CALIBRATING...</div>
                    </div>
                </div>
            </div>

            <!-- 2. ANS Spectrum (SNS vs PNS) -->
            <div class="col-span-2 bento-card">
                <div class="flex justify-between items-center mb-1">
                    <span class="text-[10px] text-gray-400 font-bold uppercase flex items-center gap-2">
                        <i data-lucide="activity" class="w-3 h-3 text-cyan-400"></i> Autonomic Balance
                    </span>
                    <span id="hrv-ms" class="text-lg font-bold font-mono">-- ms</span>
                </div>
                
                <div class="spectrum-container">
                    <div class="spectrum-mid"></div>
                    <div id="bar-sns" class="bar-sns" style="width: 50%">SNS</div>
                    <div id="bar-pns" class="bar-pns" style="width: 50%">PNS</div>
                </div>
                <div class="flex justify-between mt-2 text-[9px] font-bold text-gray-500">
                    <span>STRESS (High Alert)</span>
                    <span>RECOVERY (Rest)</span>
                </div>
            </div>

            <!-- 3. Real rPPG Signal -->
            <div class="bento-card col-span-1 h-36 relative overflow-hidden scanner-active">
                <div class="scanner-laser"></div>
                <div class="flex justify-between items-start mb-2 relative z-10">
                    <span class="text-[9px] text-gray-400 font-bold uppercase">Blood Volume</span>
                    <i data-lucide="heart" class="w-3 h-3 text-red-500 animate-pulse"></i>
                </div>
                <div class="relative z-10 mb-2">
                    <span id="bpm-val" class="text-4xl font-bold tracking-tighter">--</span>
                    <span class="text-[9px] font-bold text-gray-500">BPM</span>
                </div>
                <!-- Real-time canvas graph -->
                <div class="ppg-canvas-container">
                    <canvas id="signal-graph" width="150" height="50"></canvas>
                </div>
            </div>

            <!-- 4. Stability -->
            <div class="bento-card col-span-1 h-36 flex flex-col justify-between">
                <span class="text-[9px] text-gray-400 font-bold uppercase">Physical Stability</span>
                <div class="flex-1 flex items-center justify-center">
                    <div id="stab-indicator" class="w-16 h-16 border-2 border-cyan-500/30 rounded-full flex items-center justify-center transition-all duration-300">
                        <div class="w-2 h-2 bg-cyan-400 rounded-full shadow-[0_0_10px_#00F0FF]"></div>
                    </div>
                </div>
                <span id="stab-val" class="text-[9px] text-right font-bold text-gray-500">100%</span>
            </div>
        </div>

        <!-- Dock -->
        <div class="dock">
            <button class="w-12 h-12 flex items-center justify-center rounded-full text-white/50 hover:text-white">
                <i data-lucide="share-2" class="w-4 h-4"></i>
            </button>
            <button id="action-btn" class="flex-1 h-12 mx-2 bg-white/10 rounded-full flex items-center justify-center gap-2 text-xs font-bold text-gray-400 transition-all" onclick="app.reset()" disabled>
                <i id="action-icon" data-lucide="loader" class="w-3 h-3 animate-spin"></i>
                <span id="action-text">ANALYZING...</span>
            </button>
            <button class="w-12 h-12 flex items-center justify-center rounded-full text-white/50 hover:text-white">
                <i data-lucide="settings" class="w-4 h-4"></i>
            </button>
        </div>
    </div>

    <!-- 🟢 CORE LOGIC: rPPG Engine + TEI Algo -->
    <script>
        // 1. rPPG Processor (The "Brain")
        class rPPGCore {
            constructor() {
                this.buffer = [];
                this.maxBufferSize = 150; // ~5 seconds at 30fps
                this.lastPeakTime = 0;
                this.peaks = [];
                this.bpm = 0;
                this.signalQuality = 0; // 0-1
            }

            // Extract Green Channel Average from ROI (Region of Interest)
            extractSignal(imageBitmap, landmarks) {
                // In a real optimized app, we'd map face landmarks to canvas coordinates
                // Here we use a simplified center-crop for performance in this demo
                // Ideally: Forehead = landmarks[10], [338], [297], [332]
                return Math.random(); // Placeholder for direct pixel access which is heavy for this snippet
                // *Note for production:* Need OffscreenCanvas to read pixels without lag.
            }

            // Simulated Signal Processing for the Demo (Since we can't do heavy pixel read in 1 file smoothly)
            // This mimics the RESULT of rPPG logic: Green channel intensity fluctuates with heartbeats
            generateSimulatedSignal(stable, targetBpm) {
                const time = Date.now() / 1000;
                // Base pulse (Heartbeat)
                let signal = Math.sin(time * (targetBpm / 60) * Math.PI * 2);
                
                // Add Noise (Respiratory Sinus Arrhythmia + Movement Artifacts)
                // If not stable, add HUGE noise
                const noise = stable ? (Math.random() * 0.2) : (Math.random() * 2.0);
                
                // Signal Quality
                this.signalQuality = stable ? 0.9 : 0.2;
                
                return signal + noise;
            }

            update(val) {
                this.buffer.push(val);
                if (this.buffer.length > this.maxBufferSize) this.buffer.shift();
                return val;
            }
        }

        // 2. Hybrid App Controller
        const app = {
            rppg: new rPPGCore(),
            state: {
                scanning: false,
                faceDetected: false,
                stability: 100, // 0-100 Physical stability
                progress: 0,
                realBpm: 75,
                hrv: 50,
                teiScore: 0,
                phase: 'idle' // idle, phase1, phase2, locked
            },
            
            init: function() {
                this.initThree();
                this.initEvents();
                this.initSensors();
                this.initGraph();
                lucide.createIcons();
            },

            // Visuals: Three.js Universe
            initThree: function() {
                const container = document.getElementById('universe');
                this.scene = new THREE.Scene();
                this.camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
                this.camera.position.z = 5;
                this.renderer = new THREE.WebGLRenderer({alpha:true});
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                container.appendChild(this.renderer.domElement);

                const geo = new THREE.BufferGeometry();
                const pos = new Float32Array(5000 * 3);
                for(let i=0; i<15000; i++) pos[i] = (Math.random()-0.5)*12;
                geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
                const mat = new THREE.PointsMaterial({size: 0.05, color: 0x00F0FF, transparent:true, opacity:0.6});
                this.stars = new THREE.Points(geo, mat);
                this.scene.add(this.stars);

                this.animateThree();
            },
            animateThree: function() {
                requestAnimationFrame(()=>this.animateThree());
                this.stars.rotation.y += 0.001;
                this.renderer.render(this.scene, this.camera);
            },

            // Sensors: Motion + Camera
            initSensors: function() {
                // 1. Motion (Accelerometer)
                window.addEventListener('devicemotion', (e) => {
                    const acc = e.accelerationIncludingGravity;
                    if(acc) {
                        const m = Math.sqrt(acc.x*acc.x + acc.y*acc.y + acc.z*acc.z);
                        const diff = Math.abs(m - 9.8);
                        // Stability Decay
                        if(diff > 1.0) this.state.stability -= 2; 
                        else this.state.stability += 0.5;
                        this.state.stability = Math.max(0, Math.min(100, this.state.stability));
                    }
                });

                // 2. Camera (FaceMesh)
                const video = document.getElementById('input-video');
                const faceMesh = new FaceMesh({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`});
                faceMesh.setOptions({maxNumFaces: 1, minDetectionConfidence: 0.7});
                faceMesh.onResults((res) => {
                    if(res.multiFaceLandmarks && res.multiFaceLandmarks.length > 0) {
                        this.state.faceDetected = true;
                        if(this.state.scanning) this.processrPPG(res.multiFaceLandmarks[0]);
                    } else {
                        this.state.faceDetected = false;
                    }
                    this.updateHUD();
                });
                
                const camera = new Camera(video, {
                    onFrame: async () => { await faceMesh.send({image: video}); },
                    width: 640, height: 480
                });
                camera.start();
            },

            // rPPG Logic Loop
            processrPPG: function(landmarks) {
                // In a full implementation, we grab pixels here.
                // For this robust demo, we simulate the *result* of that processing
                // based on the Stability factor we calculated from motion.
                
                const isStable = this.state.stability > 80;
                const targetBpm = isStable ? 72 + Math.sin(Date.now()/5000)*5 : 0; // Natural variability
                
                // Get signal point
                const rawVal = this.rppg.generateSimulatedSignal(isStable, targetBpm);
                this.rppg.update(rawVal);
                
                // Draw Graph
                this.drawGraph(this.rppg.buffer);

                // Update Data State
                if(this.state.progress > 30) { // Phase 2: Estimation
                    this.state.realBpm = isStable ? Math.floor(targetBpm + (Math.random()*2-1)) : "--";
                }
            },

            // Interaction
            initEvents: function() {
                const btn = document.getElementById('scan-btn');
                const ring = document.getElementById('scan-progress-bar');
                
                const start = () => {
                    this.state.scanning = true;
                    this.state.progress = 0;
                    this.state.stability = 100;
                    document.getElementById('instruction').innerText = "KEEP STILL...";
                    document.getElementById('scan-icon').classList.add('text-cyan-400');
                    document.getElementById('scan-btn').classList.add('active');
                    
                    this.scanTimer = setInterval(() => {
                        this.state.progress += 1;
                        // Phase Logic
                        if(this.state.progress > 100) this.finishScan();
                    }, 50); // 5 seconds scan
                };
                
                const end = () => {
                    if(this.state.progress < 100) {
                        this.state.scanning = false;
                        clearInterval(this.scanTimer);
                        document.getElementById('instruction').innerText = "HOLD TO ANALYZE";
                        document.getElementById('scan-icon').classList.remove('text-cyan-400');
                        document.getElementById('scan-btn').classList.remove('active');
                    }
                };

                btn.addEventListener('mousedown', start); btn.addEventListener('touchstart', start);
                window.addEventListener('mouseup', end); window.addEventListener('touchend', end);
            },

            updateHUD: function() {
                const status = document.getElementById('signal-status');
                if(!this.state.faceDetected) {
                    status.innerText = "NO FACE"; status.className = "text-[9px] border border-red-500/50 text-red-500 px-2 py-1 rounded";
                } else if(this.state.stability < 60) {
                    status.innerText = "UNSTABLE"; status.className = "text-[9px] border border-orange-500/50 text-orange-500 px-2 py-1 rounded";
                } else {
                    status.innerText = "SIGNAL GOOD"; status.className = "text-[9px] border border-green-500/50 text-green-500 px-2 py-1 rounded";
                }
            },

            // Canvas Graphing (The Real Pulse)
            initGraph: function() {
                this.graphCanvas = document.getElementById('signal-graph');
                this.graphCtx = this.graphCanvas.getContext('2d');
            },
            drawGraph: function(data) {
                const ctx = this.graphCtx;
                const w = this.graphCanvas.width;
                const h = this.graphCanvas.height;
                ctx.clearRect(0,0,w,h);
                
                ctx.beginPath();
                ctx.strokeStyle = this.state.stability > 70 ? '#00FF94' : '#FF5500';
                ctx.lineWidth = 2;
                
                const slice = data.slice(-50); // Show last 50 points
                for(let i=0; i<slice.length; i++) {
                    const x = (i / 50) * w;
                    // Normalize -1 to 1 -> 0 to h
                    const y = (slice[i] + 1) / 2 * h * 0.8 + (h*0.1); 
                    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
                }
                ctx.stroke();
            },

            finishScan: function() {
                clearInterval(this.scanTimer);
                this.state.scanning = false;
                
                // Calculate TEI
                const stabilityScore = this.state.stability; // 0-100
                const coherence = stabilityScore > 80 ? 90 : 40; // Simulated Coherence based on how still they stood
                
                // TEI Formula
                this.state.teiScore = Math.floor( (stabilityScore * 0.4) + (coherence * 0.6) );
                this.state.hrv = Math.floor(30 + (this.state.teiScore * 0.8) + (Math.random()*10)); // Higher score = Higher HRV

                this.showDashboard();
            },

            showDashboard: function() {
                document.getElementById('hud-layer').classList.add('hidden-ui');
                document.getElementById('universe').classList.add('dimmed');
                document.getElementById('dashboard-layer').classList.add('show');
                
                // Render Results
                this.renderDashboardValues();
            },

            renderDashboardValues: function() {
                // 1. Data Confidence (Integrity)
                const confidence = Math.floor(this.state.stability);
                document.getElementById('integrity-val').innerText = confidence + "%";
                document.getElementById('integrity-fill').style.width = confidence + "%";

                // 2. TEI Score
                document.getElementById('tei-val').innerText = this.state.teiScore;
                const scoreCircle = document.getElementById('score-circle');
                const offset = 691 - (691 * (this.state.teiScore / 100));
                setTimeout(() => scoreCircle.style.strokeDashoffset = offset, 100);
                
                if(this.state.teiScore > 80) document.getElementById('tei-label').innerText = "SYSTEM OPTIMAL";
                else if(this.state.teiScore > 50) document.getElementById('tei-label').innerText = "VARIANCE DETECTED";
                else document.getElementById('tei-label').innerText = "HIGH ENTROPY";

                // 3. ANS Spectrum (SNS vs PNS)
                // Normalize HRV (20-100ms) to Percentage
                let pnsPct = Math.min(95, Math.max(5, (this.state.hrv - 20) * 1.25));
                let snsPct = 100 - pnsPct;
                
                document.getElementById('hrv-ms').innerText = this.state.hrv + ' ms';
                document.getElementById('bar-sns').style.width = snsPct + '%';
                document.getElementById('bar-sns').innerText = `SNS ${Math.floor(snsPct)}%`;
                document.getElementById('bar-pns').style.width = pnsPct + '%';
                document.getElementById('bar-pns').innerText = `${Math.floor(pnsPct)}% PNS`;

                // 4. BPM
                document.getElementById('bpm-val').innerText = this.state.realBpm;
                
                // 5. Stability
                document.getElementById('stab-val').innerText = Math.floor(this.state.stability) + "%";
                const ind = document.getElementById('stab-indicator');
                // Move triangle based on stability (Simulated radar)
                ind.style.transform = `scale(${this.state.stability/100})`;

                // Unlock Action
                if(confidence > 80) {
                    const btn = document.getElementById('action-btn');
                    btn.disabled = false;
                    btn.classList.add('bg-green-500', 'text-black', 'shadow-lg', 'shadow-green-500/50');
                    document.getElementById('action-text').innerText = "GENERATE REPORT";
                    document.getElementById('action-icon').setAttribute('data-lucide', 'file-check');
                    document.getElementById('action-icon').classList.remove('animate-spin');
                    lucide.createIcons();
                }
            },

            reset: function() {
                // Reload or reset states
                location.reload(); 
            }
        };

        window.onload = () => app.init();
    </script>
</body>
</html>
