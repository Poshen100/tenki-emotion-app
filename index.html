<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TENKI v26.3 - Trader Flow</title>
    
    <!-- 矽谷頂尖設計字體與庫 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* --- 視覺核心樣式 --- */
        :root {
            --bg-deep: #050510;
            --plasma-cyan: #00F0FF; 
            --matrix-green: #00FF94;
            --alert-red: #FF0055;
            --glass-bg: rgba(12, 12, 18, 0.85);
            --score-high: #00FF94;
            --score-mid: #FFD600;
            --score-low: #FF0055;
        }

        body {
            background: var(--bg-deep); color: white;
            font-family: 'Inter', sans-serif;
            overflow: hidden; width: 100vw; height: 100dvh;
            margin: 0; user-select: none; -webkit-tap-highlight-color: transparent;
        }

        /* 3D Background */
        #universe { position: absolute; inset: 0; z-index: 1; transition: opacity 1.5s ease; }
        #universe.dimmed { opacity: 0.2; filter: blur(8px); }

        /* HUD Layer */
        #hud-layer {
            position: absolute; inset: 0; z-index: 10;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 24px; padding-top: calc(50px + env(safe-area-inset-top));
            transition: opacity 0.5s;
        }
        #hud-layer.hidden-ui { opacity: 0; pointer-events: none; }

        /* Fingerprint Scanner UI */
        .fingerprint-container {
            position: relative; width: 120px; height: 120px;
            display: flex; justify-content: center; align-items: center;
        }
        .fingerprint-ring {
            position: absolute; inset: 0; border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.5s;
        }
        .fingerprint-btn {
            width: 90px; height: 90px; border-radius: 50%;
            background: rgba(255,255,255,0.05); backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; position: relative; z-index: 20;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .fingerprint-btn:active { transform: scale(0.92); }
        .fingerprint-btn.active { 
            background: rgba(0, 240, 255, 0.15); border-color: var(--plasma-cyan);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
        }

        /* Dashboard Layer - 關鍵修正：padding-bottom */
        #dashboard-layer {
            position: absolute; inset: 0; z-index: 50;
            background: transparent; display: flex; flex-direction: column;
            /* 頂部避開瀏海，底部避開 Dock (強制留白 180px) */
            padding: 20px; 
            padding-top: calc(50px + env(safe-area-inset-top));
            padding-bottom: 180px; 
            overflow-y: auto; opacity: 0; pointer-events: none;
            transform: translateY(40px); transition: all 0.8s cubic-bezier(0.19, 1, 0.22, 1);
        }
        #dashboard-layer.show { opacity: 1; pointer-events: auto; transform: translateY(0); }

        .bento-card {
            background: var(--glass-bg); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px; padding: 20px; position: relative; overflow: hidden;
            backdrop-filter: blur(40px); box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }

        /* Data Integrity Bar (Top) */
        .integrity-track { width: 100%; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; margin-top: 10px; }
        .integrity-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #00F0FF, #00FF94); transition: width 0.3s; }

        /* Score Ring */
        .score-circle-bg { fill: none; stroke: rgba(255,255,255,0.1); stroke-width: 8; }
        .score-circle-fg { 
            fill: none; stroke: var(--score-high); stroke-width: 8; stroke-linecap: round;
            stroke-dasharray: 628; stroke-dashoffset: 628; transition: stroke-dashoffset 1.5s ease-out, stroke 0.5s;
            transform: rotate(-90deg); transform-origin: 50% 50%;
        }

        /* HRV Spectrum */
        .spectrum-bar {
            width: 100%; height: 28px; background: rgba(0,0,0,0.3); border-radius: 14px;
            display: flex; position: relative; overflow: hidden; border: 1px solid rgba(255,255,255,0.1);
        }
        .spectrum-mid { position: absolute; left: 50%; top:0; bottom:0; width: 1px; background: rgba(255,255,255,0.2); z-index:5; }
        .bar-sns { background: linear-gradient(90deg, #FF5500, #FF9900); height: 100%; width: 50%; transition: width 1s; display: flex; align-items: center; padding-left: 10px; font-size: 10px; font-weight: 700; color: #000; }
        .bar-pns { background: linear-gradient(90deg, #00FF94, #00F0FF); height: 100%; width: 50%; transition: width 1s; display: flex; align-items: center; justify-content: flex-end; padding-right: 10px; font-size: 10px; font-weight: 700; color: #000; }

        /* Graph Canvas */
        .graph-container {
            width: 100%; height: 60px; position: relative;
        }

        /* Dock - Fixed at bottom */
        .dock {
            position: fixed; bottom: 30px; left: 20px; right: 20px; height: 64px;
            background: rgba(15,15,20,0.95); backdrop-filter: blur(25px);
            border-radius: 32px; border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            display: flex; align-items: center; justify-content: space-between; padding: 0 8px;
            z-index: 100; transform: translateY(150px); transition: transform 0.6s 0.2s cubic-bezier(0.19, 1, 0.22, 1);
        }
        #dashboard-layer.show .dock { transform: translateY(0); }

        .font-mono-tech { font-family: 'JetBrains Mono', monospace; }
        
        /* 呼吸光圈動畫 */
        @keyframes breathe-anim { 0%, 100% { transform: scale(0.95); opacity: 0.3; } 50% { transform: scale(1.1); opacity: 0.8; } }
    </style>
</head>
<body>

    <div id="universe"></div>

    <!-- HUD: Rapid Scan UI -->
    <div id="hud-layer">
        <div class="flex justify-between items-start px-6">
            <div>
                <div class="text-2xl font-black tracking-widest">TENKI</div>
                <div class="text-[9px] text-cyan-400 tracking-[0.2em] font-mono-tech">TRADER_FLOW v26.3</div>
            </div>
            <div id="status-badge" class="px-2 py-1 border border-white/10 rounded text-[9px] font-mono-tech text-gray-500">
                READY
            </div>
        </div>

        <div class="flex-1 flex flex-col justify-center items-center">
            <div class="fingerprint-container" id="scan-trigger">
                <div class="fingerprint-ring" id="pulse-ring"></div>
                <div class="fingerprint-btn">
                    <i data-lucide="fingerprint" class="w-8 h-8 text-white/40 transition-colors" id="scan-icon"></i>
                </div>
            </div>
            
            <div class="mt-8 text-center h-10">
                <div id="main-instruction" class="text-xs font-bold tracking-[0.15em] text-white/80">QUICK SCAN (2s)</div>
                <div id="sub-instruction" class="text-[9px] text-cyan-400/60 mt-1 font-mono-tech opacity-0 transition-opacity">ACQUIRING SIGNAL...</div>
            </div>
        </div>

        <div class="px-6 pb-6 w-full">
            <div class="w-full h-1 bg-white/10 rounded overflow-hidden">
                <div id="signal-bar" class="h-full bg-cyan-400 w-0 transition-all duration-100 ease-linear"></div>
            </div>
        </div>
    </div>

    <!-- Dashboard: Result & Refinement UI -->
    <div id="dashboard-layer">
        <!-- Integrity Header -->
        <div class="mb-4">
            <div class="flex justify-between items-end mb-2">
                <div>
                    <div class="text-[10px] text-cyan-400 font-bold uppercase tracking-widest mb-1">
                        <span id="analysis-state" class="animate-pulse">CALIBRATING...</span>
                    </div>
                    <div class="text-xl font-bold text-white font-serif">Bio-Metrics</div>
                </div>
                <div class="text-right">
                    <div class="text-[9px] text-gray-500 font-bold mb-1">ACCURACY</div>
                    <div id="confidence-txt" class="text-white font-mono-tech font-bold text-lg">20%</div>
                </div>
            </div>
            <div class="integrity-track"><div id="confidence-bar" class="integrity-fill" style="width: 20%"></div></div>
        </div>

        <div class="grid grid-cols-2 gap-3">
            
            <!-- 1. TEI Score -->
            <div class="col-span-2 bento-card py-6 flex flex-col items-center justify-center bg-black/40">
                <div class="relative w-[220px] h-[220px]">
                    <svg class="w-full h-full">
                        <circle cx="110" cy="110" r="90" class="score-circle-bg"></circle>
                        <circle id="score-ring" cx="110" cy="110" r="90" class="score-circle-fg"></circle>
                    </svg>
                    <div class="absolute inset-0 flex flex-col items-center justify-center">
                        <span class="text-[10px] font-bold tracking-[0.2em] text-gray-500 mb-2">TEI SCORE</span>
                        <span id="tei-score" class="text-8xl font-black text-white leading-none tracking-tighter">--</span>
                        <span id="tei-grade" class="text-xs font-bold text-cyan-400 mt-2 tracking-widest uppercase">Estimating...</span>
                    </div>
                </div>
            </div>

            <!-- 2. ANS Spectrum -->
            <div class="col-span-2 bento-card">
                <div class="flex justify-between items-center mb-3">
                    <span class="text-[10px] font-bold text-gray-400 uppercase flex items-center gap-2">
                        <i data-lucide="activity" class="w-3 h-3 text-cyan-400"></i> Autonomic Balance
                    </span>
                    <span id="hrv-val" class="text-sm font-mono-tech font-bold text-white">-- ms</span>
                </div>
                <div class="spectrum-bar">
                    <div class="spectrum-mid"></div>
                    <div id="bar-sns" class="bar-sns">SNS 50%</div>
                    <div id="bar-pns" class="bar-pns">50% PNS</div>
                </div>
                <div class="flex justify-between mt-2 text-[9px] font-bold text-gray-500">
                    <span>STRESS</span>
                    <span>RECOVERY</span>
                </div>
            </div>

            <!-- 3. Pulse (Bar Graph) -->
            <div class="bento-card col-span-1 h-40 flex flex-col justify-between relative overflow-hidden">
                <div class="flex justify-between items-start z-10">
                    <span class="text-[9px] font-bold text-gray-400 uppercase">Heart Rate</span>
                    <i data-lucide="heart" class="w-3 h-3 text-red-500 fill-red-500 animate-pulse"></i>
                </div>
                <div class="z-10">
                    <span id="bpm-val" class="text-4xl font-bold tracking-tighter text-white">--</span>
                    <span class="text-[9px] text-gray-500 font-bold ml-1">BPM</span>
                </div>
                <!-- 條狀圖 -->
                <div class="graph-container z-10">
                    <canvas id="pulse-canvas" width="120" height="60"></canvas>
                </div>
            </div>

            <!-- 4. Respiration -->
            <div class="bento-card col-span-1 h-40 flex flex-col justify-between relative">
                <div class="flex justify-between items-start z-10">
                    <span class="text-[9px] font-bold text-gray-400 uppercase">Respiration</span>
                    <i data-lucide="wind" class="w-3 h-3 text-green-400"></i>
                </div>
                <div class="flex-1 flex items-center justify-center">
                    <div class="relative w-16 h-16 flex items-center justify-center">
                        <div class="absolute inset-0 border-2 border-white/10 rounded-full"></div>
                        <div id="rr-circle" class="w-full h-full border-2 border-green-400 rounded-full scale-50 opacity-50 transition-all duration-[3000ms]"></div>
                        <span id="rr-val" class="absolute text-lg font-bold">--</span>
                    </div>
                </div>
                <div class="text-right z-10">
                     <span class="text-[9px] text-gray-500 font-bold">BR/MIN</span>
                </div>
            </div>

            <!-- Log -->
            <div class="col-span-2 bento-card bg-black/80 border-white/20">
                <div class="text-[9px] text-cyan-500 font-mono-tech mb-2">SYSTEM_LOG</div>
                <div id="log-msg" class="text-sm text-white/90 font-serif italic">
                    "Initial assessment complete. Refining accuracy..."
                </div>
            </div>
        </div>

        <!-- Floating Dock -->
        <div class="dock">
            <button class="w-10 h-10 flex items-center justify-center rounded-full text-white/50 hover:bg-white/10">
                <i data-lucide="share-2" class="w-4 h-4"></i>
            </button>
            <button id="reset-btn" class="flex-1 h-12 mx-3 bg-white text-black rounded-full font-bold text-xs shadow-lg shadow-white/10 active:scale-95 transition-transform" onclick="app.reset()">
                NEW SCAN
            </button>
            <button class="w-10 h-10 flex items-center justify-center rounded-full text-white/50 hover:bg-white/10">
                <i data-lucide="history" class="w-4 h-4"></i>
            </button>
        </div>
    </div>

    <!-- 🟢 SYSTEM CORE -->
    <script>
        // --- 1. TEI Engine (Scoring Logic) ---
        class TEIEngine {
            constructor() {}
            calculate(hrv, rr, stability) {
                let hrvScore = (Math.log(hrv) - 2.0) * 35;
                hrvScore = Math.min(99, Math.max(1, hrvScore));

                const optimal = 6;
                const dist = Math.abs(rr - optimal);
                let rrScore = 100 - (dist * 4); 
                if (rr > 24) rrScore -= 20; 
                rrScore = Math.min(99, Math.max(10, rrScore));

                // Formula: Balanced mix
                let total = (hrvScore * 0.4) + (rrScore * 0.4) + (stability * 0.2);
                return Math.floor(total);
            }
        }

        // --- 2. Signal Generator (Bar Graph Data Source) ---
        class rPPGSignalGenerator {
            constructor() {
                this.time = 0;
                this.buffer = [];
                this.capacity = 30; // 30 bars looks good
            }
            
            next(bpm, stressLevel) {
                this.time += 0.1;
                // Complex wave for visual interest
                let signal = Math.sin(this.time * (bpm / 60) * Math.PI * 2);
                signal += 0.5 * Math.sin(this.time * (bpm / 60) * Math.PI * 4 + 0.5); 
                const noise = stressLevel * (Math.random() - 0.5) * 0.3;
                const val = signal + noise;
                
                this.buffer.push(val);
                if(this.buffer.length > this.capacity) this.buffer.shift();
                
                return { val, buffer: this.buffer };
            }
        }

        // --- 3. App Controller (Trader Flow) ---
        const app = {
            state: {
                scanning: false,
                accumulating: false,
                progress: 0,
                confidence: 20, // Start low (Flash Scan)
                samples: 0, // Count valid beats
                results: { tei: 0, hrv: 0, rr: 0, bpm: 0 }
            },
            engine: new TEIEngine(),
            signalGen: new rPPGSignalGenerator(),
            timers: {},
            
            init() {
                this.initThree();
                this.initInteraction();
                this.initGraph();
                lucide.createIcons();
            },

            initThree() {
                const container = document.getElementById('universe');
                this.scene = new THREE.Scene();
                this.camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
                this.camera.position.z = 5;
                this.renderer = new THREE.WebGLRenderer({alpha:true});
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                container.appendChild(this.renderer.domElement);

                const geo = new THREE.BufferGeometry();
                const pos = new Float32Array(3000 * 3);
                for(let i=0; i<9000; i++) pos[i] = (Math.random()-0.5)*15;
                geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
                const mat = new THREE.PointsMaterial({size: 0.03, color: 0x00ffff, transparent:true, opacity:0.4});
                this.stars = new THREE.Points(geo, mat);
                this.scene.add(this.stars);
                this.animateThree();
            },
            animateThree() {
                requestAnimationFrame(()=>this.animateThree());
                this.stars.rotation.y += 0.0005;
                this.renderer.render(this.scene, this.camera);
            },

            // --- Interaction: Quick Scan ---
            initInteraction() {
                const trigger = document.getElementById('scan-trigger');
                
                const startScan = (e) => {
                    e.preventDefault();
                    if(this.state.scanning) return;
                    this.state.scanning = true;
                    this.state.progress = 0;
                    
                    document.getElementById('scan-icon').classList.add('text-cyan-400');
                    document.getElementById('pulse-ring').style.borderColor = '#00F0FF';
                    document.getElementById('pulse-ring').style.transform = 'scale(1.1)';
                    document.getElementById('sub-instruction').style.opacity = '1';
                    
                    // Rapid Scan (2 seconds)
                    this.timers.scan = setInterval(() => this.scanLoop(), 50); 
                };

                const stopScan = (e) => {
                    if(this.state.progress < 100) {
                        this.state.scanning = false;
                        clearInterval(this.timers.scan);
                        document.getElementById('scan-icon').classList.remove('text-cyan-400');
                        document.getElementById('pulse-ring').style.borderColor = 'rgba(255,255,255,0.1)';
                        document.getElementById('pulse-ring').style.transform = 'scale(1)';
                        document.getElementById('sub-instruction').style.opacity = '0';
                        document.getElementById('signal-bar').style.width = '0%';
                    }
                };

                trigger.addEventListener('mousedown', startScan);
                trigger.addEventListener('touchstart', startScan);
                window.addEventListener('mouseup', stopScan);
                window.addEventListener('touchend', stopScan);
            },

            scanLoop() {
                this.state.progress += 2.5; // Very fast (40 ticks = 2s)
                document.getElementById('signal-bar').style.width = this.state.progress + '%';

                if(this.state.progress >= 100) {
                    this.completeScan();
                }
            },

            completeScan() {
                clearInterval(this.timers.scan);
                
                // 1. Generate Initial "Rough" Results
                this.generateResults(0.5); // Low precision factor
                
                // 2. Switch Views
                document.getElementById('hud-layer').classList.add('hidden-ui');
                document.getElementById('universe').classList.add('dimmed');
                document.getElementById('dashboard-layer').classList.add('show');
                
                // 3. Start Continuous Refinement (The 30-sample accumulation)
                this.startRefinementProcess();
            },

            generateResults(precision) {
                // Simulate: As precision goes up, variance goes down
                const baseHRV = 70;
                const variance = (1 - precision) * 40; // High variance at start
                
                const rawHRV = Math.floor(baseHRV + (Math.random() - 0.5) * variance); 
                const rawRR = Math.floor(14 + (Math.random() - 0.5) * (variance/5)); 
                const stability = 90 + (precision * 10);
                
                const teiScore = this.engine.calculate(rawHRV, rawRR, stability);
                
                this.state.results = {
                    tei: teiScore,
                    hrv: rawHRV,
                    rr: rawRR,
                    bpm: 72 + Math.floor(Math.random()*5)
                };
            },

            // --- The "Trader Flow" Logic: Continuous Refinement ---
            startRefinementProcess() {
                this.state.accumulating = true;
                this.state.samples = 0;
                this.state.confidence = 20;

                // Render Loop (Visuals)
                this.timers.dash = setInterval(() => {
                    this.updateDashboard();
                }, 50);

                // Logic Loop (Data Accumulation)
                // Every 1 second, we "capture" a sample and refine the score
                this.timers.refine = setInterval(() => {
                    if (this.state.samples < 30) {
                        this.state.samples++;
                        this.state.confidence = Math.floor(20 + (this.state.samples / 30) * 80);
                        
                        // Refine Data (Move closer to a "True" value)
                        // In real app, this is averaging the buffer
                        this.generateResults(this.state.confidence / 100);
                        
                        // Update UI Texts for "Refining" state
                        document.getElementById('confidence-txt').innerText = this.state.confidence + "%";
                        document.getElementById('confidence-bar').style.width = this.state.confidence + "%";
                        
                        if (this.state.samples === 30) {
                            // Locked!
                            document.getElementById('analysis-state').innerText = "SYSTEM LOCKED";
                            document.getElementById('analysis-state').classList.remove('animate-pulse');
                            document.getElementById('analysis-state').style.color = "#00FF94";
                            document.getElementById('confidence-bar').style.background = "#00FF94";
                            document.getElementById('log-msg').innerText = "Data convergence complete. 30 samples locked.";
                        }
                    }
                }, 1000);
            },

            updateDashboard() {
                const { tei, hrv, rr, bpm } = this.state.results;

                // 1. Update Graphs (Visualizer Style)
                const data = this.signalGen.next(bpm, 0.1);
                this.drawBarGraph(data.buffer);

                // 2. Smoothly animate Score
                const el = document.getElementById('tei-score');
                const current = parseInt(el.innerText) || 0;
                if(current !== tei) {
                    el.innerText = current + (tei > current ? 1 : -1);
                }
                
                // Ring Color
                const ring = document.getElementById('score-ring');
                const offset = 628 - (628 * (tei / 100));
                ring.style.strokeDashoffset = offset;
                
                if(tei >= 80) ring.style.stroke = "var(--score-high)";
                else if(tei >= 60) ring.style.stroke = "var(--score-mid)";
                else ring.style.stroke = "var(--score-low)";

                // 3. Spectrum & Values
                this.animateSpectrum(hrv);
                document.getElementById('rr-val').innerText = rr;
                
                // Jitter BPM
                document.getElementById('bpm-val').innerText = bpm + (Math.random()>0.8?1:0);
            },

            animateSpectrum(hrv) {
                let pns = Math.floor((hrv / 120) * 100);
                pns = Math.max(10, Math.min(90, pns));
                const sns = 100 - pns;
                document.getElementById('hrv-val').innerText = hrv + " ms";
                document.getElementById('bar-sns').style.width = sns + '%';
                document.getElementById('bar-sns').innerText = `SNS ${sns}%`;
                document.getElementById('bar-pns').style.width = pns + '%';
                document.getElementById('bar-pns').innerText = `${pns}% PNS`;
            },

            initGraph() {
                this.canvas = document.getElementById('pulse-canvas');
                this.ctx = this.canvas.getContext('2d');
            },

            // 🟢 BAR GRAPH VISUALIZER
            drawBarGraph(data) {
                const ctx = this.ctx;
                const w = this.canvas.width;
                const h = this.canvas.height;
                const gap = 2;
                const count = data.length;
                const barW = (w / count) - gap;

                ctx.clearRect(0, 0, w, h);
                
                data.forEach((val, i) => {
                    // Normalize (-1.5 to 1.5) -> 0 to 1
                    let normalized = (val + 1.5) / 3;
                    // Ease function for aesthetics
                    let barH = normalized * h * 0.8 + 2; 
                    
                    const x = i * (barW + gap);
                    const y = h - barH;

                    // Cyberpunk Gradient
                    const grd = ctx.createLinearGradient(0, y, 0, h);
                    grd.addColorStop(0, "#00F0FF");
                    grd.addColorStop(1, "rgba(0, 240, 255, 0)");
                    
                    ctx.fillStyle = grd;
                    ctx.fillRect(x, y, barW, barH);
                });
            },

            reset() { window.location.reload(); }
        };

        window.onload = () => app.init();
    </script>
</body>
</html>
