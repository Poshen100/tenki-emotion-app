<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TENKI v25.3 - TEI PRO</title>
    
    <!-- 字體庫 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Playfair+Display:ital,wght@0,400;1,400&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- 核心引擎 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    
    <!-- UI 庫 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --bg-deep: #050510;
            --plasma-cyan: #00F0FF; 
            --risk-low: #00FF94;   /* Low Risk */
            --risk-mid: #FFD600;   /* Caution */
            --risk-high: #FF0055;  /* Warning */
            --glass-bg: rgba(15, 20, 25, 0.95);
            --glass-border: rgba(255, 255, 255, 0.08);
            --card-radius: 28px;
        }

        body {
            background: var(--bg-deep); color: white;
            font-family: 'Inter', sans-serif; overflow: hidden;
            width: 100vw; height: 100dvh; margin: 0; padding: 0;
            -webkit-tap-highlight-color: transparent; user-select: none;
        }
        .font-mono-tech { font-family: 'Space Mono', monospace; }
        .font-serif-human { font-family: 'Playfair Display', serif; }

        /* Layers */
        #universe { position: absolute; inset: 0; z-index: 1; background: radial-gradient(circle at center, #111 0%, #000 100%); transition: opacity 1s; }
        #universe.dimmed { opacity: 0.2; filter: blur(20px); }
        #input-video, #rppg-canvas { position: fixed; top: 0; left: 0; opacity: 0; pointer-events: none; }

        /* HUD Layer */
        #hud-layer {
            position: absolute; inset: 0; z-index: 10; pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 24px; padding-bottom: calc(30px + env(safe-area-inset-bottom));
            transition: opacity 0.4s;
        }
        #hud-layer.hidden-ui { opacity: 0; pointer-events: none; transform: scale(1.1); filter: blur(10px); }

        /* Scanner Button (2s Fast Scan) */
        .fingerprint-wrapper {
            position: relative; width: 100px; height: 100px;
            display: flex; justify-content: center; align-items: center;
            pointer-events: auto; cursor: pointer; border-radius: 50%;
            transition: transform 0.2s;
        }
        .fingerprint-core {
            width: 70px; height: 70px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255,255,255,0.2);
            display: flex; justify-content: center; align-items: center;
            backdrop-filter: blur(10px); position: relative; overflow: hidden; z-index: 20;
            transition: all 0.3s;
        }
        .scan-beam {
            position: absolute; top: -100%; left: 0; width: 100%; height: 50%;
            background: linear-gradient(to bottom, transparent 0%, var(--plasma-cyan) 90%, #fff 100%);
            opacity: 0; pointer-events: none; z-index: 21;
        }
        .progress-svg { position: absolute; top: -5px; left: -5px; width: 110px; height: 110px; transform: rotate(-90deg); z-index: 30; pointer-events: none; }
        .progress-circle {
            fill: none; stroke: var(--plasma-cyan); stroke-width: 3; stroke-linecap: round;
            stroke-dasharray: 308; stroke-dashoffset: 308; transition: stroke-dashoffset 0.05s linear;
            filter: drop-shadow(0 0 4px var(--plasma-cyan));
        }
        .fingerprint-wrapper.active { transform: scale(0.95); }
        .fingerprint-wrapper.active .fingerprint-core { border-color: var(--plasma-cyan); background: rgba(0, 20, 30, 0.8); }
        .fingerprint-wrapper.active .scan-beam { opacity: 1; animation: beam-scan 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
        @keyframes beam-scan { 0% { top: -100%; opacity: 0; } 100% { top: 150%; opacity: 0; } }

        /* Dashboard */
        #dashboard-layer {
            position: absolute; inset: 0; z-index: 50; background: transparent;
            display: flex; flex-direction: column; padding: 20px; 
            padding-top: calc(50px + env(safe-area-inset-top));
            overflow-y: auto; opacity: 0; pointer-events: none; transform: translateY(20px);
            transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        #dashboard-layer.show { opacity: 1; pointer-events: auto; transform: translateY(0); }

        .bento-card {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            border-radius: var(--card-radius); padding: 20px;
            backdrop-filter: blur(40px); display: flex; flex-direction: column; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); position: relative; overflow: hidden;
        }

        /* 15s Progress Bar */
        .analysis-progress-container {
            width: 100%; height: 4px; background: rgba(255,255,255,0.1);
            border-radius: 2px; overflow: hidden; margin-top: 8px; margin-bottom: 20px;
        }
        .analysis-progress-bar {
            height: 100%; background: var(--plasma-cyan); width: 0%;
            transition: width 1s linear; box-shadow: 0 0 10px var(--plasma-cyan);
        }

        /* Risk Badge */
        .risk-badge {
            padding: 4px 12px; border-radius: 99px; font-size: 10px; font-weight: 800;
            text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 6px;
            transition: all 0.5s;
        }
        .risk-badge.analyzing { background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); }
        .risk-badge.low { background: rgba(0, 255, 148, 0.15); color: #00FF94; border: 1px solid rgba(0, 255, 148, 0.3); }
        .risk-badge.mid { background: rgba(255, 214, 0, 0.15); color: #FFD600; border: 1px solid rgba(255, 214, 0, 0.3); }
        .risk-badge.high { background: rgba(255, 0, 85, 0.15); color: #FF0055; border: 1px solid rgba(255, 0, 85, 0.3); }

        /* Graph */
        .bio-graph-container {
            width: 100%; height: 50px; display: flex; align-items: flex-end; gap: 2px;
            mask-image: linear-gradient(to right, transparent, black 15%);
        }
        .bio-bar { flex: 1; background: var(--plasma-cyan); opacity: 0.6; border-radius: 1px; transition: height 0.05s linear; }

        /* DOCK */
        .dock-container {
            position: fixed; bottom: 30px; left: 20px; right: 20px; height: 64px;
            background: rgba(15, 20, 25, 0.95); backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 32px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5); transform: translateY(150px); 
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); z-index: 100;
        }
        #dashboard-layer.show .dock-container { transform: translateY(0); }
    </style>
</head>
<body>
    <video id="input-video" playsinline></video>
    <canvas id="rppg-canvas" width="100" height="100"></canvas>
    <div id="universe"></div>

    <!-- HUD (Initial 2s Scan) -->
    <div id="hud-layer">
        <div class="absolute top-10 left-0 w-full text-center">
            <div class="text-[10px] text-gray-500 font-mono-tech tracking-widest mb-1">TEI PLATFORM v25.3</div>
            <div class="text-xl font-bold text-white font-sans tracking-wider">Face ID Check</div>
        </div>

        <div class="flex flex-col items-center justify-center h-full pb-10">
            <div id="scan-trigger-wrapper" class="fingerprint-wrapper">
                <svg class="progress-svg" viewBox="0 0 110 110">
                    <circle cx="55" cy="55" r="49" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"></circle>
                    <circle id="scan-progress-bar" class="progress-circle" cx="55" cy="55" r="49"></circle>
                </svg>
                <div class="fingerprint-core">
                    <div class="scan-beam"></div>
                    <i data-lucide="scan-face" class="w-8 h-8 text-white/90"></i>
                </div>
            </div>
            <div id="instruction" class="mt-6 text-[10px] tracking-[2px] text-gray-400 font-mono-tech font-bold uppercase">
                Hold 2s to Start
            </div>
        </div>
    </div>

    <!-- Dashboard (15s Deep Scan) -->
    <div id="dashboard-layer">
        <!-- Header & Progress -->
        <div class="mb-2">
            <div class="flex justify-between items-end mb-2">
                <div>
                    <div class="text-[10px] text-gray-400 font-bold uppercase tracking-widest mb-1">Risk Assessment</div>
                    <div class="text-2xl font-serif-human italic text-white">TEI Analysis</div>
                </div>
                <div id="risk-badge" class="risk-badge analyzing">
                    <div id="risk-dot" class="w-2 h-2 rounded-full bg-white animate-pulse"></div>
                    <span id="risk-text">Scanning...</span>
                </div>
            </div>
            
            <!-- 15s Progress Bar -->
            <div class="analysis-progress-container">
                <div id="deep-scan-bar" class="analysis-progress-bar"></div>
            </div>
            <div class="flex justify-between text-[9px] text-gray-500 font-mono-tech">
                <span>DATA ACQUISITION</span>
                <span id="countdown-timer">15s</span>
            </div>
        </div>

        <!-- Metrics Grid -->
        <div class="grid grid-cols-2 gap-3">
            
            <!-- Real-Time Pulse (Big Card) -->
            <div class="col-span-2 bento-card py-5">
                <div class="flex justify-between items-center mb-4">
                    <div class="flex items-center gap-2">
                        <i data-lucide="activity" class="w-4 h-4 text-cyan-400"></i>
                        <span class="text-[10px] font-bold text-gray-400 tracking-widest">REAL-TIME SIGNAL</span>
                    </div>
                    <div class="text-right">
                        <span id="bpm-val" class="text-5xl font-bold text-white tracking-tighter">--</span>
                        <span class="text-xs text-gray-500 font-bold">BPM</span>
                    </div>
                </div>
                <div class="bio-graph-container" id="ppg-graph"></div>
            </div>

            <!-- HRV (Risk Index) -->
            <div class="bento-card h-32 justify-between">
                <div class="text-[10px] text-gray-400 font-bold uppercase">Health Risk (HRV)</div>
                <div>
                    <div id="hrv-val" class="text-3xl font-bold text-white">--</div>
                    <div id="hrv-status" class="text-[10px] text-gray-400 mt-1">Calibrating...</div>
                </div>
                <div class="w-full bg-white/10 h-1 mt-2 rounded-full overflow-hidden">
                    <div id="hrv-bar" class="h-full bg-gray-500 transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>

            <!-- Posture (Ergonomics) -->
            <div class="bento-card h-32 justify-between">
                <div class="text-[10px] text-gray-400 font-bold uppercase">Ergonomics</div>
                <div class="flex-1 flex items-center justify-center relative my-2">
                    <div class="w-full h-[1px] bg-white/10 absolute"></div>
                    <div class="h-full w-[1px] bg-white/10 absolute"></div>
                    <div id="posture-dot" class="w-3 h-3 bg-white rounded-full shadow-[0_0_10px_white] transition-all duration-300"></div>
                </div>
                <div id="posture-text" class="text-[9px] text-center text-gray-400">CHECKING...</div>
            </div>

            <!-- TEI Score (Emotion) -->
            <div class="col-span-2 bento-card flex-row items-center justify-between py-4">
                <div>
                    <div class="text-[10px] text-gray-400 font-bold uppercase mb-1">TEI Score (Emotion)</div>
                    <div class="text-xs text-gray-500">Based on Micro-expressions</div>
                </div>
                <div class="text-2xl font-bold text-white" id="tei-score">--</div>
            </div>
        </div>

        <!-- Dock (Action) -->
        <div class="dock-container">
            <button id="main-action-btn" class="w-full h-full flex items-center justify-center gap-2 text-sm font-bold text-white uppercase tracking-wider" onclick="app.reset()" disabled>
                <i data-lucide="loader" class="w-4 h-4 animate-spin" id="btn-icon"></i>
                <span id="btn-text">Analyzing...</span>
            </button>
        </div>
    </div>

    <!-- WORKER (v25.2 Arrhythmia Safe Core) -->
    <script id="worker-script" type="javascript/worker">
        let buffer = [];
        const BUFFER_SIZE = 240; 
        let hrvHistory = [];
        
        self.onmessage = function(e) {
            const { val, type } = e.data;
            if (type === 'reset') { buffer = []; hrvHistory = []; return; }

            buffer.push(val);
            if (buffer.length > BUFFER_SIZE) buffer.shift();
            if (buffer.length < 60) { self.postMessage({ status: 'buffering' }); return; }

            // Detrending
            const detrended = [];
            const windowSize = 15;
            for(let i = 0; i < buffer.length; i++) {
                let sum = 0, count = 0;
                for(let j = Math.max(0, i-windowSize); j < Math.min(buffer.length, i+windowSize); j++) { sum += buffer[j]; count++; }
                detrended.push(buffer[i] - (sum / count));
            }

            // Peak Detection
            let min = 0, max = 0;
            detrended.forEach(v => { if(v<min) min=v; if(v>max) max=v; });
            const threshold = max * 0.55; 
            const peaks = [];
            for(let i = 2; i < detrended.length - 2; i++) {
                const v = detrended[i];
                if(v > threshold && v > detrended[i-1] && v > detrended[i-2] && v > detrended[i+1] && v > detrended[i+2]) {
                    if (peaks.length === 0 || (i - peaks[peaks.length-1]) > 9) peaks.push(i);
                }
            }

            // Calc
            let bpm = 0, finalHrv = 0;
            if (peaks.length > 4) {
                const rrIntervals = [];
                for(let i = 1; i < peaks.length; i++) {
                    const diff = peaks[i] - peaks[i-1];
                    if(diff > 8 && diff < 50) rrIntervals.push(diff);
                }
                if(rrIntervals.length > 3) {
                    const sortedRR = [...rrIntervals].sort((a,b)=>a-b);
                    const medianRR = sortedRR[Math.floor(sortedRR.length/2)];
                    const validRR = rrIntervals.filter(rr => Math.abs(rr-medianRR) < (medianRR*0.25));
                    const calcRR = validRR.length > 2 ? validRR : rrIntervals;

                    let totalDiff = 0; calcRR.forEach(d => totalDiff+=d);
                    bpm = Math.round(60 / ((totalDiff/calcRR.length)/30));

                    let sumSq = 0;
                    for(let i=0; i<calcRR.length-1; i++) {
                        const d = (calcRR[i]*33.3) - (calcRR[i+1]*33.3);
                        sumSq += d*d;
                    }
                    const rawHrv = Math.sqrt(sumSq / (calcRR.length-1));
                    hrvHistory.push(rawHrv);
                    if(hrvHistory.length > 5) hrvHistory.shift();
                    let hSum = 0; hrvHistory.forEach(h => hSum += h);
                    finalHrv = Math.round(hSum / hrvHistory.length);
                }
            }

            // Raw Graph
            const lastVal = detrended[detrended.length-1];
            const range = max - min || 1;
            const graphVal = Math.max(0, Math.min(100, ((lastVal - min) / range) * 100));

            self.postMessage({ 
                status: 'active', 
                bpm: Math.min(180, Math.max(40, bpm)), 
                hrv: Math.min(120, finalHrv), 
                raw: graphVal 
            });
        };
    </script>

    <!-- MAIN APP LOGIC -->
    <script>
        lucide.createIcons();
        const workerBlob = new Blob([document.getElementById('worker-script').textContent], {type: "text/javascript"});
        const worker = new Worker(window.URL.createObjectURL(workerBlob));
        
        const app = {
            state: { isScanning: false, isDeepScanning: false, bpm: 0, hrv: 0, graphData: new Array(40).fill(50), posture: {x:0, y:0} },
            timers: { scan: null, deep: null },
            
            init: function() {
                this.initThree();
                this.initWorker();
                this.initEvents();
                // Init Graph UI
                const container = document.getElementById('ppg-graph');
                for(let i=0; i<40; i++) {
                    const d = document.createElement('div');
                    d.className = 'bio-bar'; d.style.height = '10%';
                    container.appendChild(d);
                }
            },

            initThree: function() {
                const container = document.getElementById('universe');
                this.scene = new THREE.Scene();
                this.camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
                this.camera.position.z = 5;
                this.renderer = new THREE.WebGLRenderer({ alpha: true });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                container.appendChild(this.renderer.domElement);
                // Particles
                const geo = new THREE.BufferGeometry();
                const pos = new Float32Array(3000*3);
                for(let i=0; i<3000*3; i++) pos[i] = (Math.random()-0.5)*10;
                geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
                const mat = new THREE.PointsMaterial({ size: 0.05, color: 0x00F0FF, transparent: true, opacity: 0.5 });
                this.cloud = new THREE.Points(geo, mat);
                this.scene.add(this.cloud);
                this.animate();
            },

            animate: function() {
                requestAnimationFrame(() => this.animate());
                this.cloud.rotation.y += 0.001;
                this.renderer.render(this.scene, this.camera);
            },

            initWorker: function() {
                worker.onmessage = (e) => {
                    if (!this.state.isDeepScanning && !this.state.isScanning) return; // Ignore if stopped

                    const { status, bpm, hrv, raw } = e.data;
                    
                    if (status === 'active') {
                        // Update Data
                        if (bpm > 45) {
                            this.state.bpm += (bpm - this.state.bpm) * 0.1;
                            document.getElementById('bpm-val').innerText = Math.round(this.state.bpm);
                        }
                        if (hrv > 0) {
                            this.state.hrv = hrv;
                            document.getElementById('hrv-val').innerText = hrv + "ms";
                            document.getElementById('hrv-bar').style.width = Math.min(100, (hrv/100)*100) + '%';
                            
                            // Dynamic Risk Text during scan
                            let status = "Analyzing...";
                            let color = "gray";
                            if(hrv < 30) { status = "High Stress"; color = "#FF0055"; }
                            else if(hrv < 50) { status = "Moderate Load"; color = "#FFD600"; }
                            else { status = "Optimal State"; color = "#00FF94"; }
                            document.getElementById('hrv-status').innerText = status;
                            document.getElementById('hrv-bar').style.backgroundColor = color;
                        }

                        // Graph
                        this.state.graphData.shift();
                        this.state.graphData.push(raw);
                        const bars = document.querySelectorAll('.bio-bar');
                        bars.forEach((b, i) => {
                            b.style.height = this.state.graphData[i] + '%';
                            b.style.opacity = this.state.graphData[i] > 60 ? 1 : 0.4;
                        });
                    }
                };
            },

            startSensors: async function() {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 240, frameRate: 30 } });
                    const video = document.getElementById('input-video');
                    video.srcObject = stream;
                    await video.play();

                    const canvas = document.getElementById('rppg-canvas');
                    const ctx = canvas.getContext('2d', { willReadFrequently: true });
                    const faceMesh = new FaceMesh({locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`});
                    faceMesh.setOptions({maxNumFaces: 1, minDetectionConfidence: 0.5});
                    
                    faceMesh.onResults(res => {
                        if (res.multiFaceLandmarks && res.multiFaceLandmarks.length > 0) {
                            const lm = res.multiFaceLandmarks[0];
                            
                            // Posture
                            const nx = (lm[1].x - 0.5) * 50; 
                            const ny = (lm[1].y - 0.5) * 50;
                            const dot = document.getElementById('posture-dot');
                            if(dot) dot.style.transform = `translate(${nx}px, ${ny}px)`;
                            
                            const isCenter = Math.abs(nx) < 5 && Math.abs(ny) < 5;
                            document.getElementById('posture-text').innerText = isCenter ? "PERFECT ALIGNMENT" : "ADJUST POSTURE";
                            document.getElementById('posture-text').style.color = isCenter ? "#00FF94" : "gray";

                            // TEI Score (Proxy)
                            const blink = Math.abs(lm[159].y - lm[145].y) < 0.012;
                            if(this.state.isDeepScanning) {
                                // Simple mock update for TEI score
                                let score = 70 + (this.state.hrv/4) - (Math.abs(nx)/5);
                                document.getElementById('tei-score').innerText = Math.floor(Math.min(100, Math.max(0, score)));
                            }

                            // rPPG Extraction
                            const width = video.videoWidth; const height = video.videoHeight;
                            const fx = Math.floor(lm[10].x * width); const fy = Math.floor(lm[10].y * height);
                            if (this.state.isScanning || this.state.isDeepScanning) {
                                try {
                                    ctx.drawImage(video, fx - 5, fy + 5, 10, 10, 0, 0, 10, 10);
                                    const data = ctx.getImageData(0, 0, 10, 10).data;
                                    let gSum = 0; for(let i=0; i<data.length; i+=4) gSum+=data[i+1];
                                    worker.postMessage({ type: 'data', val: gSum / 25 });
                                } catch(e) {}
                            }
                        }
                    });

                    const camera = new Camera(video, { onFrame: async () => { await faceMesh.send({image: video}); }, width: 320, height: 240 });
                    camera.start();
                    this.state.isSensorActive = true;
                } catch(e) { console.error(e); }
            },

            initEvents: function() {
                const btn = document.getElementById('scan-trigger-wrapper');
                const ring = document.getElementById('scan-progress-bar');
                
                // 2s Fast Scan
                const start = (e) => {
                    e.preventDefault();
                    if(!this.state.isSensorActive) { this.startSensors(); document.getElementById('instruction').innerText = "CAMERA READY"; return; }
                    
                    this.state.isScanning = true;
                    worker.postMessage({ type: 'reset' });
                    btn.classList.add('active');
                    document.getElementById('instruction').innerText = "CONNECTING...";
                    if(navigator.vibrate) navigator.vibrate(50);
                    
                    let p = 0;
                    // 2000ms / 40ms = 50 steps
                    this.timers.scan = setInterval(() => {
                        p += 2;
                        ring.style.strokeDashoffset = 308 - ((p/100)*308);
                        if(p >= 100) this.finishInitialScan();
                    }, 40);
                };

                const end = (e) => {
                    if (this.state.isScanning && !this.state.isDeepScanning) {
                        this.state.isScanning = false;
                        clearInterval(this.timers.scan);
                        btn.classList.remove('active');
                        ring.style.strokeDashoffset = 308;
                        document.getElementById('instruction').innerText = "HOLD 2S TO START";
                        worker.postMessage({ type: 'reset' });
                    }
                };

                btn.addEventListener('mousedown', start); btn.addEventListener('touchstart', start);
                window.addEventListener('mouseup', end); window.addEventListener('touchend', end);
            },

            finishInitialScan: function() {
                clearInterval(this.timers.scan);
                if(navigator.vibrate) navigator.vibrate([50, 50]);
                
                // Transition to Dashboard
                document.getElementById('hud-layer').classList.add('hidden-ui');
                document.getElementById('universe').classList.add('dimmed');
                
                setTimeout(() => {
                    document.getElementById('dashboard-layer').classList.add('show');
                    this.startDeepAnalysis();
                }, 400);
            },

            startDeepAnalysis: function() {
                this.state.isDeepScanning = true;
                const bar = document.getElementById('deep-scan-bar');
                const timerText = document.getElementById('countdown-timer');
                
                // Start 15s Timer
                let timeLeft = 15;
                bar.style.width = "100%"; // CSS transition handles smooth fill
                
                this.timers.deep = setInterval(() => {
                    timeLeft--;
                    timerText.innerText = timeLeft + "s";
                    if(timeLeft <= 0) this.finalizeSession();
                }, 1000);
            },

            finalizeSession: function() {
                clearInterval(this.timers.deep);
                this.state.isDeepScanning = false;
                this.state.isScanning = false; // Stop sensor reading loop
                
                // 1. Calculate Risk
                const hrv = this.state.hrv;
                let riskLevel = "low";
                let riskLabel = "LOW RISK";
                
                if(hrv < 30) { riskLevel = "high"; riskLabel = "HIGH RISK"; }
                else if(hrv < 50) { riskLevel = "mid"; riskLabel = "CAUTION"; }
                
                // 2. Update UI
                const badge = document.getElementById('risk-badge');
                badge.className = `risk-badge ${riskLevel}`;
                badge.innerHTML = `<i data-lucide="shield-alert" class="w-3 h-3"></i> ${riskLabel}`;
                lucide.createIcons();

                document.getElementById('countdown-timer').innerText = "COMPLETE";
                document.getElementById('deep-scan-bar').style.backgroundColor = getComputedStyle(document.documentElement).getPropertyValue(`--risk-${riskLevel}`);
                
                // 3. Enable Reset Button
                const btn = document.getElementById('main-action-btn');
                btn.disabled = false;
                document.getElementById('btn-text').innerText = "START NEW SCAN";
                document.getElementById('btn-icon').setAttribute('data-lucide', 'rotate-ccw');
                document.getElementById('btn-icon').classList.remove('animate-spin');
                lucide.createIcons();
                
                if(navigator.vibrate) navigator.vibrate([100, 50, 100]);
            },

            reset: function() {
                location.reload(); // Simple reload for fresh session
            }
        };

        window.onload = () => app.init();
    </script>
</body>
</html>
