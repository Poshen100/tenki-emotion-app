<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TENKI v25.7 - Hybrid Core</title>
    
    <!-- 字體庫 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- 核心引擎 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    
    <!-- UI 庫 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --bg-deep: #050510;
            --plasma-cyan: #00F0FF; 
            --void-purple: #7000FF;
            --alert-orange: #FF5500;
            --matrix-green: #00FF94;
            
            /* 新版儀表板需要的狀態色 */
            --state-stable: #00FF94;   /* 80-99 */
            --state-control: #FFD600;  /* 60-79 */
            --state-volatile: #FF8800; /* 40-59 */
            --state-risk: #FF0055;     /* 1-39 */

            --glass-bg: rgba(10, 10, 20, 0.85);
            --glass-border: rgba(255, 255, 255, 0.12);
            --card-radius: 24px;
        }

        body {
            background: var(--bg-deep);
            color: white;
            font-family: 'Space Mono', monospace;
            overflow: hidden;
            width: 100vw; height: 100dvh;
            margin: 0; padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .font-sans-bold { font-family: 'Inter', sans-serif; font-weight: 800; }
        .font-mono-tech { font-family: 'JetBrains Mono', monospace; }
        .font-serif-human { font-family: 'Playfair Display', serif; }

        /* 隱私層 & 背景層 */
        #input-video, #light-analysis-canvas, #rppg-processing-canvas { position: fixed; top: -9999px; left: -9999px; opacity: 0; pointer-events: none; }
        
        #universe {
            position: absolute; inset: 0; z-index: 1;
            background: radial-gradient(circle at center, #111 0%, #000 100%);
            transition: opacity 1s ease, filter 1s ease;
        }
        #universe.dimmed { opacity: 0.2; filter: blur(15px); }

        /* HUD 層 */
        #hud-layer {
            position: absolute; inset: 0; z-index: 10;
            pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 24px; padding-bottom: calc(30px + env(safe-area-inset-bottom));
            transition: opacity 0.5s ease;
        }
        #hud-layer.hidden-ui { opacity: 0; pointer-events: none; transform: scale(1.05); filter: blur(10px); }

        /* 環境與對齊 UI (保留原始樣式) */
        .env-readout { font-size: 9px; letter-spacing: 1px; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; margin-bottom: 8px; }
        .env-item { display: flex; align-items: center; gap: 6px; color: #666; transition: color 0.3s; }
        .env-item.good { color: var(--matrix-green); }
        .env-item.warn { color: var(--alert-orange); }
        .env-bar { width: 30px; height: 3px; background: rgba(255,255,255,0.1); border-radius: 1px; overflow: hidden; }
        .env-fill { height: 100%; background: currentColor; transition: width 0.3s; }

        #align-hint-capsule {
            position: absolute; top: 15%; left: 50%; 
            transform: translateX(-50%) translateY(-20px) scale(0.95);
            background: rgba(20, 20, 25, 0.75);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            padding: 10px 20px; border-radius: 99px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex; align-items: center; gap: 12px;
            opacity: 0; pointer-events: none; 
            transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            z-index: 100; overflow: hidden;
            box-shadow: 0 4px 24px rgba(0,0,0,0.4);
        }
        #align-hint-capsule.show { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); pointer-events: auto; }
        #align-hint-capsule.status-error { border-color: rgba(239, 68, 68, 0.5); box-shadow: 0 0 15px rgba(239, 68, 68, 0.2); }
        #align-hint-capsule.status-warn { border-color: rgba(234, 179, 8, 0.5); box-shadow: 0 0 15px rgba(234, 179, 8, 0.2); }
        #align-hint-capsule.status-good { border-color: rgba(35, 243, 212, 0.6); box-shadow: 0 0 20px rgba(35, 243, 212, 0.3); }

        .audio-bar { width: 4px; height: 20px; background: rgba(255,255,255,0.2); margin: 0 1px; transition: height 0.05s ease-out; border-radius: 2px; }

        /* 指紋掃描器 (保留原始樣式) */
        .fingerprint-wrapper {
            position: relative; width: 110px; height: 110px;
            display: flex; justify-content: center; align-items: center;
            pointer-events: auto; cursor: pointer; border-radius: 50%;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .fingerprint-core {
            width: 80px; height: 80px; border-radius: 50%;
            background: rgba(10, 10, 15, 0.6); border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex; justify-content: center; align-items: center;
            backdrop-filter: blur(12px); position: relative; overflow: hidden; z-index: 20;
            box-shadow: 0 0 20px rgba(0,0,0,0.5); transition: all 0.4s;
        }
        .scan-beam {
            position: absolute; top: -100%; left: 0; width: 100%; height: 50%;
            background: linear-gradient(to bottom, transparent 0%, rgba(0, 240, 255, 0.4) 90%, rgba(255, 255, 255, 0.8) 100%);
            opacity: 0; pointer-events: none; z-index: 21;
        }
        .ripple-ring {
            position: absolute; top: 50%; left: 50%; width: 100%; height: 100%;
            border-radius: 50%; border: 1px solid var(--plasma-cyan);
            transform: translate(-50%, -50%) scale(0.8); opacity: 0; pointer-events: none; z-index: 1;
        }
        .progress-svg { position: absolute; top: -5px; left: -5px; width: 120px; height: 120px; transform: rotate(-90deg); z-index: 30; pointer-events: none; }
        .progress-circle {
            fill: none; stroke: var(--plasma-cyan); stroke-width: 3; stroke-linecap: round;
            stroke-dasharray: 339; stroke-dashoffset: 339; transition: stroke-dashoffset 0.05s linear;
            filter: drop-shadow(0 0 6px var(--plasma-cyan));
        }
        .fingerprint-wrapper.active { transform: scale(0.95); }
        .fingerprint-wrapper.active .fingerprint-core { border-color: rgba(0, 240, 255, 0.5); background: rgba(0, 10, 20, 0.9); }
        .fingerprint-wrapper.active .scan-beam { opacity: 1; animation: beam-scan 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
        .fingerprint-wrapper.active .ripple-ring:nth-child(1) { animation: ripple-expand 1.5s linear infinite; }
        .fingerprint-wrapper.active .ripple-ring:nth-child(2) { animation: ripple-expand 1.5s linear infinite; animation-delay: 0.5s; }
        @keyframes beam-scan { 0% { top: -100%; opacity: 0; } 50% { opacity: 1; } 100% { top: 150%; opacity: 0; } }
        @keyframes ripple-expand { 0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.8; border-width: 2px; } 100% { transform: translate(-50%, -50%) scale(2.2); opacity: 0; border-width: 0px; } }

        /* ========================================= */
        /* 新版 DASHBOARD (rPPG Accumulation Style)   */
        /* ========================================= */
        #dashboard-layer {
            position: absolute; inset: 0; z-index: 50;
            background: transparent;
            display: flex; flex-direction: column;
            padding: 20px; padding-top: calc(50px + env(safe-area-inset-top));
            overflow-y: auto; opacity: 0; pointer-events: none;
            transform: translateY(20px);
            transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        #dashboard-layer.show { opacity: 1; pointer-events: auto; transform: translateY(0); }

        .bento-card {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            border-radius: var(--card-radius); padding: 16px;
            backdrop-filter: blur(24px); display: flex; flex-direction: column; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.4); position: relative; overflow: hidden;
        }

        /* rPPG Accumulation Bars */
        .resonance-bar-container { width: 100%; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; margin-top: 8px; margin-bottom: 20px; }
        .resonance-fill { height: 100%; background: linear-gradient(90deg, #00F0FF, #00FF94); width: 0%; transition: width 0.3s ease; box-shadow: 0 0 10px var(--plasma-cyan); }
        
        /* ANS Spectrum */
        .ans-spectrum { width: 100%; height: 6px; background: #222; border-radius: 3px; display: flex; overflow: hidden; margin-top: 8px; }
        .ans-sns { background: var(--state-volatile); width: 10%; transition: width 0.5s; opacity: 0.8; }
        .ans-pns { background: var(--state-stable); width: 90%; transition: width 0.5s; opacity: 0.8; }

        /* Radar */
        .radar-container { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; position: relative; }
        .radar-svg { width: 100px; height: 100px; overflow: visible; }
        .radar-bg { fill: rgba(255,255,255,0.05); stroke: rgba(255,255,255,0.1); stroke-width: 1; }
        .radar-poly { fill: rgba(0, 240, 255, 0.2); stroke: var(--plasma-cyan); stroke-width: 2; transition: all 0.5s ease; filter: drop-shadow(0 0 8px rgba(0,240,255,0.3)); }

        /* Pulse Graph */
        .bio-graph-container { width: 100%; height: 40px; display: flex; align-items: flex-end; gap: 2px; mask-image: linear-gradient(to right, transparent, black 15%); }
        .bio-bar { flex: 1; background: var(--state-stable); opacity: 0.6; border-radius: 1px; transition: height 0.05s linear; }

        /* Action Dock */
        .dock-container {
            position: fixed; bottom: 30px; left: 20px; right: 20px; height: 64px;
            background: rgba(20, 20, 30, 0.95); backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 32px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6); transform: translateY(150px); 
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); z-index: 100;
        }
        #dashboard-layer.show .dock-container { transform: translateY(0); }
    </style>

    <!-- WORKER: rPPG 運算核心 (新增的) -->
    <script id="worker-script" type="javascript/worker">
        let buffer = []; const BUFFER_SIZE = 240; let hrvHistory = [];
        self.onmessage = function(e) {
            const { val, type } = e.data;
            if (type === 'reset') { buffer = []; hrvHistory = []; return; }
            buffer.push(val); if(buffer.length > BUFFER_SIZE) buffer.shift();
            if(buffer.length < 60) { self.postMessage({ status: 'buffering' }); return; }
            const detrended = []; const windowSize = 15;
            for(let i=0; i<buffer.length; i++) {
                let sum=0, count=0;
                for(let j=Math.max(0, i-windowSize); j<Math.min(buffer.length, i+windowSize); j++) { sum+=buffer[j]; count++; }
                detrended.push(buffer[i]-(sum/count));
            }
            let min=0, max=0; detrended.forEach(v=>{ if(v<min)min=v; if(v>max)max=v; });
            const threshold = max*0.55; const peaks = []; let newBeat = false;
            for(let i=2; i<detrended.length-2; i++) {
                if(detrended[i]>threshold && detrended[i]>detrended[i-1] && detrended[i]>detrended[i+1]) {
                    if(peaks.length===0 || (i-peaks[peaks.length-1])>9) {
                        peaks.push(i); if(i > buffer.length-5) newBeat = true;
                    }
                }
            }
            let bpm=0, finalHrv=0;
            if(peaks.length > 4) {
                const rr=[]; for(let i=1; i<peaks.length; i++) { let d=peaks[i]-peaks[i-1]; if(d>8 && d<50) rr.push(d); }
                if(rr.length>3) {
                    let td=0; rr.forEach(d=>td+=d); bpm=Math.round(60/((td/rr.length)/30));
                    let sq=0; for(let i=0; i<rr.length-1; i++) { let d=(rr[i]*33.3)-(rr[i+1]*33.3); sq+=d*d; }
                    const rawH=Math.sqrt(sq/(rr.length-1));
                    hrvHistory.push(rawH); if(hrvHistory.length>5) hrvHistory.shift();
                    let hSum=0; hrvHistory.forEach(h=>hSum+=h); finalHrv=Math.round(hSum/hrvHistory.length);
                }
            }
            const lastVal = detrended[detrended.length-1]; const range=max-min||1;
            const gVal = Math.max(0, Math.min(100, ((lastVal-min)/range)*100));
            self.postMessage({ status: 'active', bpm: Math.min(180, Math.max(40, bpm)), hrv: Math.min(120, finalHrv), raw: gVal, newBeat: newBeat });
        };
    </script>

    <!-- ENGINE (保留原版 TenkiEngine) -->
    <script>
        class BaselineManager {
            constructor() { this.data = this.load() || { samples_count: 0, daily_streak: 1 }; }
            load() { const stored = localStorage.getItem('tenki_baseline_v2'); return stored ? JSON.parse(stored) : null; }
            save() { localStorage.setItem('tenki_baseline_v2', JSON.stringify(this.data)); }
            recordSession() { this.data.samples_count++; this.save(); return this.data.samples_count; }
        }

        const TenkiEngine = {
            calculatePole: function(sampleBuffer) {
                if (!sampleBuffer || sampleBuffer.length === 0) return { score: 50, stability: 0 };
                const count = sampleBuffer.length;
                let sumHead = 0; sampleBuffer.forEach(s => { sumHead += (Math.abs(s.headRot.x) + Math.abs(s.headRot.y)); });
                const meanHead = sumHead / count;
                let varianceHead = 0; sampleBuffer.forEach(s => { const diff = (Math.abs(s.headRot.x) + Math.abs(s.headRot.y)) - meanHead; varianceHead += diff * diff; });
                const stdDevHead = Math.sqrt(varianceHead / count);
                const headStability = Math.max(0, 1 - (stdDevHead * 4));
                const finalScore = Math.floor(60 + (headStability * 30));
                return { score: Math.max(10, Math.min(99, finalScore)), stability: headStability };
            }
        };
        const baselineMgr = new BaselineManager();
    </script>

    <!-- MAIN APP SCRIPT -->
    <script>
        lucide.createIcons();

        // 1. Live Dashboard Controller (負責新版儀表板邏輯)
        const LiveDashboard = {
            state: { isActive: false, bpm: 0, hrv: 0, validBeatsCount: 0, targetBeats: 20, posture: {x:0, y:0}, graphData: new Array(40).fill(50), engineResult: null },
            worker: null, ctx: null,

            init: function() {
                const workerBlob = new Blob([document.getElementById('worker-script').textContent], {type: "text/javascript"});
                this.worker = new Worker(window.URL.createObjectURL(workerBlob));
                this.initWorker();
                const c = document.getElementById('ppg-graph');
                for(let i=0; i<40; i++) { const d=document.createElement('div'); d.className='bio-bar'; d.style.height='10%'; c.appendChild(d); }
                const cvs = document.getElementById('rppg-processing-canvas');
                this.ctx = cvs.getContext('2d', { willReadFrequently: true });
            },

            initWorker: function() {
                this.worker.onmessage = (e) => {
                    if (!this.state.isActive) return;
                    const { status, bpm, hrv, raw, newBeat } = e.data;
                    if (status === 'active') {
                        if (newBeat && bpm > 40 && this.state.validBeatsCount < this.state.targetBeats) {
                            this.state.validBeatsCount++;
                            this.updateProgress();
                            if(navigator.vibrate) navigator.vibrate(10);
                        }
                        if (bpm > 40) {
                            this.state.bpm += (bpm - this.state.bpm) * 0.1;
                            document.getElementById('bpm-val').innerText = Math.round(this.state.bpm);
                        }
                        if (hrv > 0) {
                            this.state.hrv = hrv;
                            document.getElementById('hrv-val').innerText = hrv + "ms";
                        }
                        this.state.graphData.shift(); this.state.graphData.push(raw);
                        const bars = document.querySelectorAll('.bio-bar');
                        bars.forEach((b, i) => { b.style.height = this.state.graphData[i] + '%'; b.style.opacity = this.state.graphData[i]>60?1:0.4; });
                        
                        // Radar Update (Hybrid: TenkiEngine Stability + New rPPG)
                        this.updateRadar(hrv);
                    }
                };
            },

            processFrame: function(video, landmarks) {
                if(!this.state.isActive) return;
                // rPPG Extraction
                if(landmarks && this.ctx) {
                    try {
                        this.state.posture.x = (landmarks[1].x - 0.5) * 50; 
                        const fx = Math.floor(landmarks[10].x * video.videoWidth); 
                        const fy = Math.floor(landmarks[10].y * video.videoHeight);
                        this.ctx.drawImage(video, fx - 5, fy + 5, 10, 10, 0, 0, 10, 10);
                        const data = this.ctx.getImageData(0, 0, 10, 10).data;
                        let gSum = 0; for(let i=0; i<data.length; i+=4) gSum+=data[i+1];
                        this.worker.postMessage({ type: 'data', val: gSum/25 });
                    } catch(e) {}
                }
            },

            updateRadar: function(hrv) {
                const rec = Math.min(100, (hrv / 100) * 100); 
                document.getElementById('ans-pns').style.width = rec + "%";
                document.getElementById('ans-sns').style.width = (100 - rec) + "%";
                
                // 這裡結合 TenkiEngine 算出的 Stability
                const baseStab = this.state.engineResult ? (this.state.engineResult.stability * 100) : 50;
                const posture = Math.max(0, 100 - (Math.abs(this.state.posture.x)*2));
                
                const p1y = 10 + ((100-baseStab) * 0.4);
                const p2x = 90 - ((100-posture) * 0.2); const p2y = 80 - ((100-posture) * 0.2);
                const p3x = 10 + ((100-rec) * 0.2); const p3y = 80 - ((100-rec) * 0.2);
                document.getElementById('radar-poly').setAttribute('points', `50,${p1y} ${p2x},${p2y} ${p3x},${p3y}`);
            },

            updateProgress: function() {
                const pct = (this.state.validBeatsCount / this.state.targetBeats) * 100;
                document.getElementById('resonance-fill').style.width = pct + "%";
                document.getElementById('confidence-score').innerText = Math.floor(pct) + "%";
                if(this.state.validBeatsCount >= this.state.targetBeats) this.finalizeSession();
            },

            finalizeSession: function() {
                document.getElementById('scan-status').innerText = "COMPLETE";
                document.getElementById('live-dot').classList.remove('animate-pulse');
                document.getElementById('resonance-fill').style.background = "#fff";
                
                // Final Score = TenkiEngine Score (Stability) + HRV Bonus
                const baseScore = this.state.engineResult ? this.state.engineResult.score : 60;
                const hrvBonus = this.state.hrv > 50 ? 10 : 0;
                const score = Math.min(99, baseScore + hrvBonus);
                document.getElementById('tei-score').innerText = score;

                // UI Behavior
                const phraseEl = document.getElementById('ai-phrase');
                const btn = document.getElementById('dynamic-action-btn');
                const btnText = document.getElementById('btn-text');
                const btnIcon = document.getElementById('btn-icon');
                
                btn.disabled = false;
                btnIcon.classList.remove('animate-spin');
                btn.className = "flex-1 h-12 rounded-full font-bold text-xs flex items-center justify-center gap-2 transition-all shadow-lg";

                if (score >= 80) {
                    phraseEl.innerText = "Status Stable"; phraseEl.style.color = "var(--state-stable)";
                    btn.classList.add('bg-[#00FF94]', 'text-black', 'shadow-[#00FF94]/30');
                    btnText.innerText = "DECISION FLOW READY"; btnIcon.setAttribute('data-lucide', 'arrow-right-circle');
                } else if (score >= 60) {
                    phraseEl.innerText = "Status Controllable"; phraseEl.style.color = "var(--state-control)";
                    btn.classList.add('bg-[#FFD600]', 'text-black', 'shadow-[#FFD600]/30');
                    btnText.innerText = "TIMED MODE ACTIVE"; btnIcon.setAttribute('data-lucide', 'timer');
                } else {
                    phraseEl.innerText = "Status Volatile"; phraseEl.style.color = "var(--state-volatile)";
                    btn.classList.add('bg-[#FF8800]', 'text-black', 'shadow-[#FF8800]/30');
                    btnText.innerText = "QUALITY REDUCED"; btnIcon.setAttribute('data-lucide', 'alert-circle');
                }
                lucide.createIcons();
                if(navigator.vibrate) navigator.vibrate([100, 50, 100]);
            },

            start: function(engineResult) {
                this.state.isActive = true;
                this.state.engineResult = engineResult;
                this.state.validBeatsCount = 0;
                this.worker.postMessage({ type: 'reset' });
                document.getElementById('resonance-fill').style.width = "0%";
                document.getElementById('btn-text').innerText = "ACCUMULATING DATA...";
                document.getElementById('dynamic-action-btn').disabled = true;
                document.getElementById('scan-status').innerText = "ANALYZING...";
            },
            
            stop: function() { this.state.isActive = false; }
        };

        // 2. Main App (保留原始約 1100 行邏輯的核心結構)
        const app = {
            config: { particleCount: 8000, particleSize: 0.08 },
            state: { 
                isFaceDetected: false, isScanning: false, isSensorActive: false,
                mouthOpen: 0, headRot: {x:0, y:0}, energy: 0, audioData: 0,
                scanBuffer: [], envLux: 0, deviceMotion: 0 
            },
            audioCtx: null, analyser: null, dataArray: null, stream: null, lightCtx: null,

            init: function() {
                LiveDashboard.init(); // 啟動新版儀表板控制器
                this.initThree();
                this.initEvents();
                this.initEnvironment();
            },

            // --- Environment Sensors (保留) ---
            initEnvironment: function() {
                const c = document.getElementById('light-analysis-canvas');
                if(c) this.lightCtx = c.getContext('2d', { willReadFrequently: true });
                window.addEventListener('devicemotion', (event) => {
                    if (event.accelerationIncludingGravity) {
                        const { x, y, z } = event.accelerationIncludingGravity;
                        const m = Math.sqrt(x*x + y*y + z*z);
                        const diff = Math.abs(m - 9.8);
                        this.state.deviceMotion = diff * 0.1;
                    }
                });
            },
            updateEnvironment: function() {
                if(!this.state.isSensorActive) {
                    const time = Date.now() * 0.001; this.updateEnvUI(60 + Math.sin(time)*10, 0.02); return;
                }
                if (this.lightCtx && document.getElementById('input-video').readyState === 4 && Math.random() > 0.9) {
                    const v = document.getElementById('input-video');
                    this.lightCtx.drawImage(v, 0, 0, 50, 50);
                    const data = this.lightCtx.getImageData(0,0,50,50).data;
                    let colorSum = 0; for(let x = 0; x < data.length; x+=4) colorSum += Math.floor((data[x]+data[x+1]+data[x+2])/3);
                    this.state.envLux = Math.min(100, ( (colorSum / 2500) / 200) * 100); 
                }
                let instability = this.state.deviceMotion + ((Math.abs(this.state.headRot.x) + Math.abs(this.state.headRot.y)) * 0.05);
                this.updateEnvUI(this.state.envLux, instability);
            },
            updateEnvUI: function(lux, shake) {
                const luxBar = document.getElementById('env-lux-bar');
                const stabBar = document.getElementById('env-stab-bar');
                if(luxBar) luxBar.style.width = lux + '%';
                if(stabBar) stabBar.style.width = Math.max(0, 100 - (shake * 100)) + '%';
            },

            // --- Three.js Visuals (保留) ---
            initThree: function() {
                const container = document.getElementById('universe');
                this.scene = new THREE.Scene();
                this.camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
                this.camera.position.z = 5;
                this.renderer = new THREE.WebGLRenderer({ alpha: true, antialias: false });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                container.appendChild(this.renderer.domElement);

                const geometry = new THREE.BufferGeometry();
                const positions = new Float32Array(this.config.particleCount * 3);
                const originals = new Float32Array(this.config.particleCount * 3);
                const colors = new Float32Array(this.config.particleCount * 3);
                const randoms = new Float32Array(this.config.particleCount);
                const phi = Math.PI * (3. - Math.sqrt(5.));
                const topColor = new THREE.Color(0xFF66CC); const midColor = new THREE.Color(0x9966FF); const botColor = new THREE.Color(0x00CCFF);

                for (let i = 0; i < this.config.particleCount; i++) {
                    const y = 1 - (i / (this.config.particleCount - 1)) * 2;
                    const r = Math.sqrt(1 - y * y) * 2.5; const theta = phi * i;
                    const idx = i * 3;
                    positions[idx] = Math.cos(theta)*r; positions[idx+1] = y*2.5; positions[idx+2] = Math.sin(theta)*r;
                    originals[idx] = positions[idx]; originals[idx+1] = positions[idx+1]; originals[idx+2] = positions[idx+2];
                    randoms[i] = Math.random();
                    const normalizedY = (y + 1) / 2; 
                    const mixedColor = new THREE.Color();
                    if (normalizedY > 0.5) mixedColor.copy(midColor).lerp(topColor, (normalizedY - 0.5) * 2);
                    else mixedColor.copy(botColor).lerp(midColor, normalizedY * 2);
                    colors[idx] = mixedColor.r; colors[idx+1] = mixedColor.g; colors[idx+2] = mixedColor.b;
                }
                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                geometry.setAttribute('originalPosition', new THREE.BufferAttribute(originals, 3));
                geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
                geometry.setAttribute('random', new THREE.BufferAttribute(randoms, 1));
                
                const canvas = document.createElement('canvas'); canvas.width=32; canvas.height=32;
                const ctx = canvas.getContext('2d');
                const grad = ctx.createRadialGradient(16,16,0,16,16,16);
                grad.addColorStop(0, 'rgba(255,255,255,1)'); grad.addColorStop(0.4, 'rgba(255,255,255,0.8)'); grad.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = grad; ctx.fillRect(0,0,32,32);
                const tex = new THREE.Texture(canvas); tex.needsUpdate = true;

                this.material = new THREE.PointsMaterial({ size: this.config.particleSize, map: tex, transparent: true, opacity: 0.9, vertexColors: true, blending: THREE.AdditiveBlending, depthWrite: false });
                this.cloud = new THREE.Points(geometry, this.material);
                this.scene.add(this.cloud);
                this.animate();
            },

            // --- Sensors ---
            startSensors: async function() {
                const hintEl = document.getElementById('instruction');
                hintEl.innerText = "SENSORS ACTIVE...";
                try {
                    this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    this.analyser = this.audioCtx.createAnalyser(); this.analyser.fftSize = 64;
                    this.stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
                    const source = this.audioCtx.createMediaStreamSource(this.stream); source.connect(this.analyser);
                    this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);
                    
                    const video = document.getElementById('input-video');
                    video.srcObject = this.stream;
                    const faceMesh = new FaceMesh({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`});
                    faceMesh.setOptions({maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.6});
                    faceMesh.onResults((res) => this.processData(res, video));
                    const camera = new Camera(video, { onFrame: async () => await faceMesh.send({image: video}), width: 640, height: 480 });
                    camera.start();

                    this.state.isSensorActive = true;
                } catch (e) { console.error(e); hintEl.innerText = "USE MOUSE MODE"; }
            },

            updateAudio: function() {
                if (!this.state.isSensorActive || !this.analyser) {
                    const time = Date.now() * 0.001; this.state.audioData = 30 + Math.sin(time * 0.8) * 15;
                    const bars = document.querySelectorAll('.audio-bar');
                    bars.forEach((bar, i) => { bar.style.height = (5 + Math.sin(time * 2 + i) * 5) + 'px'; });
                    return;
                }
                this.analyser.getByteFrequencyData(this.dataArray);
                let sum = 0; for(let i = 0; i < this.dataArray.length; i++) sum += this.dataArray[i];
                this.state.audioData = sum / this.dataArray.length;
                const bars = document.querySelectorAll('.audio-bar');
                bars.forEach((bar, i) => { bar.style.height = Math.max(2, (this.dataArray[i * 4] / 255) * 20) + 'px'; });
            },

            processData: function(results, video) {
                if(!this.state.isSensorActive) return;
                const landmarks = results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0 ? results.multiFaceLandmarks[0] : null;
                this.updateAlignment(landmarks);

                if (landmarks) {
                    this.state.isFaceDetected = true;
                    document.getElementById('connection-status').innerText = "VISION: ACTIVE"; document.getElementById('connection-status').style.color = "#00F0FF";
                    if(!this.state.isScanning && !LiveDashboard.state.isActive) { document.getElementById('instruction').innerText = "HOLD TO SCAN"; document.getElementById('instruction').style.color = "white"; }
                    
                    this.state.headRot.x = (landmarks[1].y - 0.5) * 2;
                    this.state.headRot.y = (landmarks[1].x - 0.5) * 2;
                    
                    // TenkiEngine 數據採集
                    if (this.state.isScanning) {
                        this.state.scanBuffer.push({ headRot: { x: this.state.headRot.x, y: this.state.headRot.y } });
                    }
                    
                    // LiveDashboard 數據流注入 (當掃描完成後)
                    if (LiveDashboard.state.isActive) {
                        LiveDashboard.processFrame(video, landmarks);
                    }
                }
            },

            updateAlignment: function(landmarks) {
                const capsule = document.getElementById('align-hint-capsule');
                const textBox = document.getElementById('hint-text');
                const iconBox = document.getElementById('hint-icon-box');
                // 如果儀表板開啟中，不顯示對齊提示
                if (LiveDashboard.state.isActive) { capsule.classList.remove('show'); return; }
                
                let state = 'searching'; let msg = "FIND FACE"; 
                if (landmarks) {
                    const noseX = landmarks[1].x;
                    if (noseX < 0.35) { msg = "MOVE RIGHT →"; } else if (noseX > 0.65) { msg = "← MOVE LEFT"; } else { msg = "READY TO SCAN"; state='good'; }
                }
                if (textBox.innerText !== msg) {
                    textBox.innerText = msg;
                    if(state === 'good') {
                        iconBox.className = "w-6 h-6 rounded-full flex items-center justify-center bg-cyan-500/20";
                        capsule.className = "status-good show";
                    } else {
                        iconBox.className = "w-6 h-6 rounded-full flex items-center justify-center bg-red-500/20";
                        capsule.className = "status-warn show";
                    }
                }
                if (!capsule.classList.contains('show')) capsule.classList.add('show');
            },

            animate: function() {
                requestAnimationFrame(() => this.animate());
                this.updateAudio();
                this.updateEnvironment();
                
                const time = Date.now() * 0.001;
                this.cloud.rotation.y += 0.002 + (this.state.headRot.y * 0.05);
                this.cloud.rotation.x += (this.state.headRot.x * 0.05);
                
                // 粒子特效
                const positions = this.cloud.geometry.attributes.position.array;
                const originals = this.cloud.geometry.attributes.originalPosition.array;
                const randoms = this.cloud.geometry.attributes.random.array;
                const pulse = Math.sin(time * 2) * (0.2 + (this.state.audioData/255)*0.8);
                for (let i = 0; i < this.config.particleCount; i++) {
                    const idx = i * 3;
                    const expansion = 1 + pulse * randoms[i] * 0.5;
                    positions[idx] = originals[idx] * expansion;
                    positions[idx+1] = originals[idx+1] * expansion;
                    positions[idx+2] = originals[idx+2] * expansion;
                }
                this.cloud.geometry.attributes.position.needsUpdate = true;
                this.renderer.render(this.scene, this.camera);
            },

            initEvents: function() {
                const btnWrapper = document.getElementById('scan-trigger-wrapper');
                const ringPath = document.getElementById('scan-progress-bar');
                const start = (e) => {
                    e.preventDefault();
                    if (!this.audioCtx) { this.startSensors(); return; }
                    this.state.isScanning = true; this.state.scanBuffer = [];
                    btnWrapper.classList.add('active');
                    document.getElementById('instruction').innerText = "KEEP STEADY...";
                    document.getElementById('instruction').style.color = "#00F0FF";
                    if(navigator.vibrate) navigator.vibrate(50);
                    
                    ringPath.style.strokeDashoffset = 339;
                    let p=0;
                    this.scanInterval = setInterval(() => {
                        p+=2; ringPath.style.strokeDashoffset = 339 - ((p/100)*339);
                        if(p>=100) this.finishScan();
                    }, 40);
                };
                const end = (e) => {
                    if(!this.state.isScanning) return;
                    this.state.isScanning = false; clearInterval(this.scanInterval);
                    btnWrapper.classList.remove('active');
                    ringPath.style.strokeDashoffset = 339;
                    document.getElementById('instruction').innerText = "HOLD TO SYNC";
                    document.getElementById('instruction').style.color = "#9CA3AF";
                };
                btnWrapper.addEventListener('mousedown', start); btnWrapper.addEventListener('touchstart', start);
                window.addEventListener('mouseup', end); window.addEventListener('touchend', end);
            },

            finishScan: function() {
                clearInterval(this.scanInterval);
                this.state.isScanning = false;
                if(navigator.vibrate) navigator.vibrate([50, 50, 100]);

                // 核心邏輯橋接：將 TenkiEngine 的計算結果傳遞給 LiveDashboard
                const engineResult = TenkiEngine.calculatePole(this.state.scanBuffer);
                baselineMgr.recordSession();

                // UI 切換：隱藏 HUD，顯示 Dashboard
                document.getElementById('hud-layer').classList.add('hidden-ui');
                document.getElementById('align-hint-capsule').classList.remove('show');
                document.getElementById('universe').classList.add('dimmed');
                
                setTimeout(() => { 
                    document.getElementById('dashboard-layer').classList.add('show'); 
                    LiveDashboard.start(engineResult); // 啟動 rPPG 累積模式
                }, 400);
            },

            reset: function() {
                LiveDashboard.stop();
                document.getElementById('dashboard-layer').classList.remove('show');
                document.getElementById('hud-layer').classList.remove('hidden-ui');
                document.getElementById('universe').classList.remove('dimmed');
                document.getElementById('scan-trigger-wrapper').classList.remove('active');
                document.getElementById('scan-progress-bar').style.strokeDashoffset = 339;
                document.getElementById('instruction').innerText = "HOLD TO SYNC";
                document.getElementById('instruction').style.color = "#9CA3AF";
            }
        };

        window.onload = () => app.init();
        window.onresize = () => {
            app.camera.aspect = window.innerWidth / window.innerHeight;
            app.camera.updateProjectionMatrix();
            app.renderer.setSize(window.innerWidth, window.innerHeight);
        };
    </script>
</body>
</html>
