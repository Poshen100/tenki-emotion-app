<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <link rel="apple-touch-icon" href="pwa-512x512.png">
    <title>TENKI Core</title>
    <link rel="stylesheet" href="styles.css">

    <!-- Three.js for stardust soul animation (v25.8.2 preserved) -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"
        crossorigin="anonymous"></script>

    <!-- MediaPipe FaceMesh (optional — rPPG ROI extraction with landmarks) -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"
        crossorigin="anonymous" async></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"
        crossorigin="anonymous" async></script>
</head>
<body>

    <!-- ═══════════════════════════════════════════
         STARDUST SOUL — Three.js 8000-particle sphere
         Persistent background behind all pages
         ═══════════════════════════════════════════ -->
    <div id="universe"></div>

    <!-- ═══════════════════════════════════════════
         LANDING PAGE
         ═══════════════════════════════════════════ -->
    <div id="landing">
        <canvas id="landing-particles"></canvas>
        <div class="landing-logo">TENKI</div>
        <div class="landing-sub">Bio-Decision Intelligence</div>
        <button id="start-btn">Tap to Begin</button>
        <div class="landing-hint">需要前鏡頭權限 · 請在安靜環境中使用</div>
    </div>

    <!-- ═══════════════════════════════════════════
         CAMERA (hidden — rPPG processing only)
         ═══════════════════════════════════════════ -->
    <video id="camera" playsinline autoplay muted></video>
    <canvas id="rppg-canvas"></canvas>

    <!-- ═══════════════════════════════════════════
         RESULTS PAGE (built dynamically by results-renderer.js)
         ═══════════════════════════════════════════ -->
    <div id="results-page" class="hidden"></div>

    <!-- Sound toggle -->
    <button id="sound-toggle">🔊</button>

    <!-- ═══════════════════════════════════════════
         SCRIPTS (order matters)
         ═══════════════════════════════════════════ -->
    <!-- Core engines (preserved — do not modify) -->
    <script src="tenki-engine.js"></script>
    <script src="rpgg.js"></script>
    <script src="expression.js"></script>
    <script src="hints.js"></script>
    <script src="engine.js"></script>

    <!-- PHASE 0 MAX modules -->
    <script src="baseline-sim.js"></script>
    <script src="audio-engine.js"></script>
    <script src="haptics.js"></script>
    <script src="sparkline.js"></script>
    <script src="results-renderer.js"></script>
    <script src="scan-ux.js"></script>

    <!-- Stardust soul animation (Three.js, must load after THREE) -->
    <script src="stardust.js"></script>

    <!-- App flow controller (must be last) -->
    <script src="app.js"></script>

</body>
</html>
