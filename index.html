<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <title>TENKI Core</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Landing -->
  <div id="landing">
    <canvas id="landing-particles"></canvas>
    <div class="landing-logo">TENKI</div>
    <div class="landing-sub">Bio-Decision Intelligence</div>
    <button id="start-btn">Tap to Begin</button>
    <div class="landing-hint">需要前鏡頭權限 · 請在安靜環境中使用</div>
  </div>

  <!-- Camera (hidden, for rPPG processing) -->
  <video id="camera" playsinline autoplay muted></video>
  <canvas id="rppg-canvas" style="display:none"></canvas>

  <!-- Results Page (initially hidden) -->
  <div id="results-page" class="hidden">
    <!-- 所有 v4.2 元件在此由 results-renderer.js 動態建立 -->
  </div>

  <!-- Audio/Haptics 控制 -->
  <div id="sound-toggle" class="sound-btn">🔊</div>

  <script src="tenki-engine.js"></script>
  <script src="rpgg.js"></script>
  <script src="expression.js"></script>
  <script src="hints.js"></script>
  <script src="baseline-sim.js"></script>
  <script src="audio-engine.js"></script>
  <script src="haptics.js"></script>
  <script src="sparkline.js"></script>
  <script src="results-renderer.js"></script>
  <script src="scan-ux.js"></script>
  <script src="app.js"></script>
</body>
</html>
