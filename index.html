<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TENKI v25.7 - Compliance Core</title>
    
    <!-- 字體庫 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- 核心引擎 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    
    <!-- UI 庫 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --bg-deep: #030305;
            --plasma-cyan: #00F0FF; 
            --state-stable: #00FF94;   /* 80-99 */
            --state-control: #FFD600;  /* 60-79 */
            --state-volatile: #FF8800; /* 40-59 */
            --state-risk: #FF0055;     /* 1-39 */
            --glass-bg: rgba(18, 18, 24, 0.95);
            --glass-border: rgba(255, 255, 255, 0.12);
            --card-radius: 24px;
        }

        body {
            background: var(--bg-deep); color: white;
            font-family: 'Inter', sans-serif; overflow: hidden;
            width: 100vw; height: 100dvh; margin: 0; padding: 0;
            -webkit-tap-highlight-color: transparent; user-select: none;
        }
        .font-mono-tech { font-family: 'JetBrains Mono', monospace; }

        /* Layers */
        #universe { position: absolute; inset: 0; z-index: 1; background: radial-gradient(circle at center, #0a0a10 0%, #000 100%); transition: opacity 1s; }
        #universe.dimmed { opacity: 0.1; filter: blur(20px); }
        #input-video, #rppg-canvas { position: fixed; top: 0; left: 0; opacity: 0; pointer-events: none; }

        /* HUD Layer */
        #hud-layer {
            position: absolute; inset: 0; z-index: 10; pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 24px; padding-bottom: calc(30px + env(safe-area-inset-bottom));
            transition: opacity 0.4s;
        }
        #hud-layer.hidden-ui { opacity: 0; pointer-events: none; transform: scale(1.1); filter: blur(10px); }

        /* Scanner */
        .fingerprint-wrapper {
            position: relative; width: 100px; height: 100px;
            display: flex; justify-content: center; align-items: center;
            pointer-events: auto; cursor: pointer; border-radius: 50%;
            transition: transform 0.2s;
        }
        .fingerprint-core {
            width: 70px; height: 70px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255,255,255,0.1);
            display: flex; justify-content: center; align-items: center;
            backdrop-filter: blur(10px); position: relative; overflow: hidden; z-index: 20;
            transition: all 0.3s;
        }
        .scan-beam {
            position: absolute; top: -100%; left: 0; width: 100%; height: 50%;
            background: linear-gradient(to bottom, transparent 0%, var(--plasma-cyan) 90%, #fff 100%);
            opacity: 0; pointer-events: none; z-index: 21;
        }
        .progress-svg { position: absolute; top: -5px; left: -5px; width: 110px; height: 110px; transform: rotate(-90deg); z-index: 30; pointer-events: none; }
        .progress-circle {
            fill: none; stroke: var(--plasma-cyan); stroke-width: 3; stroke-linecap: round;
            stroke-dasharray: 308; stroke-dashoffset: 308; transition: stroke-dashoffset 0.05s linear;
            filter: drop-shadow(0 0 4px var(--plasma-cyan));
        }
        .fingerprint-wrapper.active { transform: scale(0.95); }
        .fingerprint-wrapper.active .fingerprint-core { border-color: var(--plasma-cyan); background: rgba(0, 20, 30, 0.8); }
        .fingerprint-wrapper.active .scan-beam { opacity: 1; animation: beam-scan 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
        @keyframes beam-scan { 0% { top: -100%; opacity: 0; } 100% { top: 150%; opacity: 0; } }

        /* Dashboard */
        #dashboard-layer {
            position: absolute; inset: 0; z-index: 50; background: transparent;
            display: flex; flex-direction: column; padding: 20px; 
            padding-top: calc(50px + env(safe-area-inset-top));
            overflow-y: auto; opacity: 0; pointer-events: none; transform: translateY(20px);
            transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        #dashboard-layer.show { opacity: 1; pointer-events: auto; transform: translateY(0); }

        .bento-card {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            border-radius: var(--card-radius); padding: 16px;
            backdrop-filter: blur(40px); display: flex; flex-direction: column; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.4); position: relative; overflow: hidden;
        }

        /* Signal Bar */
        .resonance-bar-container {
            width: 100%; height: 4px; background: rgba(255,255,255,0.1);
            border-radius: 2px; overflow: hidden; margin-top: 8px; margin-bottom: 20px;
        }
        .resonance-fill {
            height: 100%; background: linear-gradient(90deg, #00F0FF, #00FF94); 
            width: 0%; transition: width 0.3s ease; box-shadow: 0 0 10px var(--plasma-cyan);
        }
        .resonance-fill.beat-catch { filter: brightness(2.0); }

        /* ANS Spectrum */
        .ans-spectrum {
            width: 100%; height: 6px; background: #222; border-radius: 3px; display: flex; overflow: hidden; margin-top: 8px;
        }
        .ans-sns { background: var(--state-volatile); width: 10%; transition: width 0.5s; opacity: 0.8; }
        .ans-pns { background: var(--state-stable); width: 90%; transition: width 0.5s; opacity: 0.8; }

        /* Radar */
        .radar-container {
            width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; position: relative;
        }
        .radar-svg { width: 100px; height: 100px; overflow: visible; }
        .radar-bg { fill: rgba(255,255,255,0.05); stroke: rgba(255,255,255,0.1); stroke-width: 1; }
        .radar-poly { 
            fill: rgba(0, 240, 255, 0.2); stroke: var(--plasma-cyan); stroke-width: 2; 
            transition: all 0.5s ease; filter: drop-shadow(0 0 8px rgba(0,240,255,0.3));
        }

        /* Pulse Graph */
        .bio-graph-container {
            width: 100%; height: 40px; display: flex; align-items: flex-end; gap: 2px;
            mask-image: linear-gradient(to right, transparent, black 15%);
        }
        .bio-bar { flex: 1; background: var(--state-stable); opacity: 0.6; border-radius: 1px; transition: height 0.05s linear; }

        /* Status Badge (AI Behavior Layer) */
        .status-badge {
            display: inline-flex; align-items: center; gap: 6px; px-3; py-1;
            padding: 4px 10px; border-radius: 99px;
            font-size: 10px; font-weight: 800; letter-spacing: 0.5px;
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.1);
            color: #ccc;
        }

        /* DOCK */
        .dock-container {
            position: fixed; bottom: 30px; left: 20px; right: 20px; height: 64px;
            background: rgba(20, 20, 30, 0.95); backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 32px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6); transform: translateY(150px); 
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); z-index: 100;
        }
        #dashboard-layer.show .dock-container { transform: translateY(0); }
    </style>
</head>
<body>
    <video id="input-video" playsinline></video>
    <canvas id="rppg-canvas" width="100" height="100"></canvas>
    <div id="universe"></div>

    <!-- HUD -->
    <div id="hud-layer">
        <div class="absolute top-10 left-0 w-full text-center">
            <div class="text-[10px] text-gray-500 font-mono-tech tracking-widest mb-1">SYSTEM_25.7</div>
            <div class="text-xl font-bold text-white tracking-wider">Identity Check</div>
        </div>

        <div class="flex flex-col items-center justify-center h-full pb-10">
            <div id="scan-trigger-wrapper" class="fingerprint-wrapper">
                <svg class="progress-svg" viewBox="0 0 110 110">
                    <circle cx="55" cy="55" r="49" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"></circle>
                    <circle id="scan-progress-bar" class="progress-circle" cx="55" cy="55" r="49"></circle>
                </svg>
                <div class="fingerprint-core">
                    <div class="scan-beam"></div>
                    <i data-lucide="scan-face" class="w-8 h-8 text-white/90"></i>
                </div>
            </div>
            <div id="instruction" class="mt-6 text-[10px] tracking-[2px] text-gray-400 font-mono-tech font-bold uppercase">
                Hold 2s to Sync
            </div>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard-layer">
        <!-- Header -->
        <div class="mb-2">
            <div class="flex justify-between items-end mb-2">
                <div>
                    <div class="text-[10px] text-gray-400 font-bold uppercase tracking-widest mb-1">System State</div>
                    <div class="text-2xl font-bold text-white tracking-tight">Bio-Metrics</div>
                </div>
                <div class="flex items-center gap-2">
                    <div id="live-dot" class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></div>
                    <span id="scan-status" class="text-[10px] font-bold text-cyan-400 tracking-wider">SCANNING...</span>
                </div>
            </div>
            <div class="resonance-bar-container">
                <div id="resonance-fill" class="resonance-fill"></div>
            </div>
            <div class="flex justify-between text-[9px] text-gray-500 font-mono-tech">
                <span>DATA INTEGRITY</span>
                <span id="confidence-score">0%</span>
            </div>
        </div>

        <!-- Metrics Grid -->
        <div class="grid grid-cols-2 gap-3">
            
            <!-- 1. Cardio Load (HRV) -->
            <div class="col-span-2 bento-card">
                <div class="flex justify-between items-center mb-2">
                    <div class="text-[10px] text-gray-400 font-bold uppercase tracking-wider flex items-center gap-1">
                        <i data-lucide="activity" class="w-3 h-3"></i> HRV (Load)
                    </div>
                    <div id="hrv-val" class="text-xl font-bold text-white font-mono-tech">--ms</div>
                </div>
                <div class="flex justify-between text-[9px] font-bold text-gray-500 mb-1">
                    <span>ACTIVE</span>
                    <span>RESTING</span>
                </div>
                <div class="ans-spectrum">
                    <div id="ans-sns" class="ans-sns"></div>
                    <div id="ans-pns" class="ans-pns"></div>
                </div>
            </div>

            <!-- 2. Heart Rate -->
            <div class="bento-card justify-between h-36">
                <div class="flex justify-between items-start">
                    <span class="text-[10px] text-gray-400 font-bold uppercase">Rate</span>
                    <i data-lucide="heart" class="w-4 h-4 text-gray-500"></i>
                </div>
                <div>
                    <span id="bpm-val" class="text-4xl font-bold text-white tracking-tighter">--</span>
                    <span class="text-xs text-gray-500 font-bold">BPM</span>
                </div>
                <div class="bio-graph-container" id="ppg-graph"></div>
            </div>

            <!-- 3. Radar (Focus/Posture) -->
            <div class="bento-card justify-between h-36 relative">
                <div class="text-[10px] text-gray-400 font-bold uppercase z-10">Stability</div>
                <div class="radar-container absolute inset-0">
                    <svg class="radar-svg" viewBox="0 0 100 100">
                        <polygon points="50,10 90,80 10,80" class="radar-bg" />
                        <polygon id="radar-poly" points="50,50 50,50 50,50" class="radar-poly" />
                    </svg>
                    <span class="absolute top-2 text-[8px] text-gray-500 font-bold">FOCUS</span>
                    <span class="absolute bottom-2 right-2 text-[8px] text-gray-500 font-bold">POS</span>
                    <span class="absolute bottom-2 left-2 text-[8px] text-gray-500 font-bold">VAR</span>
                </div>
            </div>

            <!-- 4. System Score (Compliant AI Output) -->
            <div class="col-span-2 bento-card py-4 bg-gradient-to-r from-[#111] to-[#151520]">
                <div class="flex justify-between items-center">
                    <div>
                        <div class="text-[10px] text-gray-400 font-bold uppercase mb-1">System Score</div>
                        <!-- AI Phrase Location -->
                        <div id="ai-phrase" class="text-xs text-white font-bold">Observing...</div>
                    </div>
                    <div class="text-right">
                        <div class="text-3xl font-bold text-white leading-none" id="tei-score">--</div>
                        <div class="text-[9px] text-gray-500 mt-1">/ 99</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Dock (Action Loop) -->
        <div class="dock-container flex gap-3 px-4">
            <button class="w-12 h-12 flex items-center justify-center rounded-full bg-white/5 border border-white/10 text-white hover:bg-white/10">
                <i data-lucide="share-2" class="w-5 h-5"></i>
            </button>
            
            <!-- Main Button (Status Dependent) -->
            <button id="dynamic-action-btn" class="flex-1 h-12 rounded-full bg-white/10 border border-white/10 text-gray-400 font-bold text-xs flex items-center justify-center gap-2 transition-all" disabled>
                <i data-lucide="loader" class="w-4 h-4 animate-spin" id="btn-icon"></i>
                <span id="btn-text">PROCESSING...</span>
            </button>
        </div>
    </div>

    <!-- WORKER (Robust Core v25.2) -->
    <script id="worker-script" type="javascript/worker">
        let buffer = []; const BUFFER_SIZE = 240; let hrvHistory = [];
        self.onmessage = function(e) {
            const { val, type } = e.data;
            if (type === 'reset') { buffer = []; hrvHistory = []; return; }
            buffer.push(val); if(buffer.length > BUFFER_SIZE) buffer.shift();
            if(buffer.length < 60) { self.postMessage({ status: 'buffering' }); return; }

            const detrended = []; const windowSize = 15;
            for(let i=0; i<buffer.length; i++) {
                let sum=0, count=0;
                for(let j=Math.max(0, i-windowSize); j<Math.min(buffer.length, i+windowSize); j++) { sum+=buffer[j]; count++; }
                detrended.push(buffer[i]-(sum/count));
            }

            let min=0, max=0; detrended.forEach(v=>{ if(v<min)min=v; if(v>max)max=v; });
            const threshold = max*0.55; const peaks = []; let newBeat = false;
            for(let i=2; i<detrended.length-2; i++) {
                if(detrended[i]>threshold && detrended[i]>detrended[i-1] && detrended[i]>detrended[i+1]) {
                    if(peaks.length===0 || (i-peaks[peaks.length-1])>9) {
                        peaks.push(i); if(i > buffer.length-5) newBeat = true;
                    }
                }
            }

            let bpm=0, finalHrv=0;
            if(peaks.length > 4) {
                const rr=[]; for(let i=1; i<peaks.length; i++) { let d=peaks[i]-peaks[i-1]; if(d>8 && d<50) rr.push(d); }
                if(rr.length>3) {
                    const sorted=[...rr].sort((a,b)=>a-b); const med=sorted[Math.floor(sorted.length/2)];
                    const valid=rr.filter(r=>Math.abs(r-med)<(med*0.25)); const calc=valid.length>2?valid:rr;
                    
                    let td=0; calc.forEach(d=>td+=d); bpm=Math.round(60/((td/calc.length)/30));
                    let sq=0; for(let i=0; i<calc.length-1; i++) { let d=(calc[i]*33.3)-(calc[i+1]*33.3); sq+=d*d; }
                    
                    const rawH=Math.sqrt(sq/(calc.length-1));
                    hrvHistory.push(rawH); if(hrvHistory.length>5) hrvHistory.shift();
                    let hSum=0; hrvHistory.forEach(h=>hSum+=h); finalHrv=Math.round(hSum/hrvHistory.length);
                }
            }
            const lastVal = detrended[detrended.length-1]; const range=max-min||1;
            const gVal = Math.max(0, Math.min(100, ((lastVal-min)/range)*100));
            self.postMessage({ status: 'active', bpm: Math.min(180, Math.max(40, bpm)), hrv: Math.min(120, finalHrv), raw: gVal, newBeat: newBeat });
        };
    </script>

    <!-- APP LOGIC -->
    <script>
        lucide.createIcons();
        const workerBlob = new Blob([document.getElementById('worker-script').textContent], {type: "text/javascript"});
        const worker = new Worker(window.URL.createObjectURL(workerBlob));
        
        const app = {
            state: { isScanning: false, isDeepScanning: false, bpm: 0, hrv: 0, validBeatsCount: 0, targetBeats: 20, posture: {x:0, y:0}, graphData: new Array(40).fill(50) },
            timers: { scan: null },
            
            init: function() {
                this.initThree(); this.initWorker(); this.initEvents();
                const c = document.getElementById('ppg-graph');
                for(let i=0; i<40; i++) { const d=document.createElement('div'); d.className='bio-bar'; d.style.height='10%'; c.appendChild(d); }
            },

            initThree: function() {
                const c = document.getElementById('universe');
                this.scene = new THREE.Scene();
                this.camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
                this.camera.position.z = 5;
                this.renderer = new THREE.WebGLRenderer({ alpha: true });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                c.appendChild(this.renderer.domElement);
                const geo = new THREE.BufferGeometry(); const pos = new Float32Array(3000*3);
                for(let i=0; i<3000*3; i++) pos[i] = (Math.random()-0.5)*10;
                geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
                const mat = new THREE.PointsMaterial({ size: 0.05, color: 0x00F0FF, transparent: true, opacity: 0.5 });
                this.cloud = new THREE.Points(geo, mat);
                this.scene.add(this.cloud);
                this.animate();
            },
            animate: function() { requestAnimationFrame(()=>this.animate()); this.cloud.rotation.y+=0.001; this.renderer.render(this.scene, this.camera); },

            initWorker: function() {
                worker.onmessage = (e) => {
                    if (!this.state.isDeepScanning) return;
                    const { status, bpm, hrv, raw, newBeat } = e.data;
                    
                    if (status === 'active') {
                        // Dynamic Confidence
                        if (newBeat && bpm > 40 && this.state.validBeatsCount < this.state.targetBeats) {
                            this.state.validBeatsCount++;
                            this.updateProgress();
                            if(navigator.vibrate) navigator.vibrate(10);
                        }

                        if (bpm > 40) {
                            this.state.bpm += (bpm - this.state.bpm) * 0.1;
                            document.getElementById('bpm-val').innerText = Math.round(this.state.bpm);
                        }
                        if (hrv > 0) {
                            this.state.hrv = hrv;
                            document.getElementById('hrv-val').innerText = hrv + "ms";
                            this.updateVisuals(hrv);
                        }

                        this.state.graphData.shift(); this.state.graphData.push(raw);
                        const bars = document.querySelectorAll('.bio-bar');
                        bars.forEach((b, i) => { 
                            b.style.height = this.state.graphData[i] + '%'; 
                            b.style.opacity = this.state.graphData[i]>60?1:0.4; 
                        });
                    }
                };
            },

            updateVisuals: function(hrv) {
                const rec = Math.min(100, (hrv / 100) * 100); const str = 100 - rec;
                document.getElementById('ans-pns').style.width = rec + "%";
                document.getElementById('ans-sns').style.width = str + "%";
                
                const focus = 90; const posture = Math.max(0, 100 - (Math.abs(this.state.posture.x)*2)); const calm = rec;
                const p1y = 10 + ((100-focus) * 0.4);
                const p2x = 90 - ((100-posture) * 0.2); const p2y = 80 - ((100-posture) * 0.2);
                const p3x = 10 + ((100-calm) * 0.2); const p3y = 80 - ((100-calm) * 0.2);
                document.getElementById('radar-poly').setAttribute('points', `50,${p1y} ${p2x},${p2y} ${p3x},${p3y}`);
            },

            updateProgress: function() {
                const pct = (this.state.validBeatsCount / this.state.targetBeats) * 100;
                document.getElementById('resonance-fill').style.width = pct + "%";
                document.getElementById('confidence-score').innerText = Math.floor(pct) + "%";
                if(this.state.validBeatsCount >= this.state.targetBeats) this.finalizeSession();
            },

            finalizeSession: function() {
                this.state.isDeepScanning = false;
                document.getElementById('scan-status').innerText = "COMPLETE";
                document.getElementById('live-dot').classList.remove('animate-pulse');
                document.getElementById('resonance-fill').style.background = "#fff";
                
                // --- SCORE CALCULATION (1-99) ---
                // Based on HRV(60%) + Stability(40%)
                const score = Math.min(99, Math.max(1, Math.floor((this.state.hrv * 0.6) + 30)));
                document.getElementById('tei-score').innerText = score;

                // --- AI BEHAVIOR LAYER (COMPLIANCE EDITION) ---
                const phraseEl = document.getElementById('ai-phrase');
                const btn = document.getElementById('dynamic-action-btn');
                const btnText = document.getElementById('btn-text');
                const btnIcon = document.getElementById('btn-icon');
                
                // Clear loading state
                btn.disabled = false;
                btnIcon.classList.remove('animate-spin');
                btn.className = "flex-1 h-12 rounded-full font-bold text-xs flex items-center justify-center gap-2 transition-all shadow-lg";

                // Tier Logic
                if (score >= 80) { // 80-99 Stable
                    phraseEl.innerText = "Status Stable";
                    phraseEl.style.color = "var(--state-stable)";
                    btn.classList.add('bg-[#00FF94]', 'text-black', 'shadow-[#00FF94]/30');
                    btnText.innerText = "DECISION FLOW READY";
                    btnIcon.setAttribute('data-lucide', 'arrow-right-circle');
                } else if (score >= 60) { // 60-79 Controllable
                    phraseEl.innerText = "Status Controllable";
                    phraseEl.style.color = "var(--state-control)";
                    btn.classList.add('bg-[#FFD600]', 'text-black', 'shadow-[#FFD600]/30');
                    btnText.innerText = "TIMED MODE ACTIVE";
                    btnIcon.setAttribute('data-lucide', 'timer');
                } else if (score >= 40) { // 40-59 Volatile
                    phraseEl.innerText = "Status Volatile";
                    phraseEl.style.color = "var(--state-volatile)";
                    btn.classList.add('bg-[#FF8800]', 'text-black', 'shadow-[#FF8800]/30');
                    btnText.innerText = "QUALITY REDUCED";
                    btnIcon.setAttribute('data-lucide', 'alert-circle');
                } else { // 1-39 Risk
                    phraseEl.innerText = "Risk Elevated";
                    phraseEl.style.color = "var(--state-risk)";
                    btn.classList.add('bg-[#FF0055]', 'text-white', 'shadow-[#FF0055]/30');
                    btnText.innerText = "FUNCTION LIMITED";
                    btnIcon.setAttribute('data-lucide', 'shield-ban');
                }
                
                lucide.createIcons();
                if(navigator.vibrate) navigator.vibrate([100, 50, 100]);
            },

            startSensors: async function() {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 240, frameRate: 30 } });
                    const video = document.getElementById('input-video');
                    video.srcObject = stream;
                    await video.play();
                    const canvas = document.getElementById('rppg-canvas');
                    const ctx = canvas.getContext('2d', { willReadFrequently: true });
                    const faceMesh = new FaceMesh({locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`});
                    faceMesh.setOptions({maxNumFaces: 1, minDetectionConfidence: 0.5});
                    faceMesh.onResults(res => {
                        if (res.multiFaceLandmarks && res.multiFaceLandmarks.length > 0) {
                            const lm = res.multiFaceLandmarks[0];
                            this.state.posture.x = (lm[1].x - 0.5) * 50; 
                            const fx = Math.floor(lm[10].x * video.videoWidth); 
                            const fy = Math.floor(lm[10].y * video.videoHeight);
                            if (this.state.isDeepScanning || this.state.isScanning) {
                                try {
                                    ctx.drawImage(video, fx - 5, fy + 5, 10, 10, 0, 0, 10, 10);
                                    const data = ctx.getImageData(0, 0, 10, 10).data;
                                    let gSum = 0; for(let i=0; i<data.length; i+=4) gSum+=data[i+1];
                                    worker.postMessage({ type: 'data', val: gSum/25 });
                                } catch(e) {}
                            }
                        }
                    });
                    const camera = new Camera(video, { onFrame: async () => { await faceMesh.send({image: video}); }, width: 320, height: 240 });
                    camera.start();
                } catch(e) {}
            },

            initEvents: function() {
                const btn = document.getElementById('scan-trigger-wrapper');
                const ring = document.getElementById('scan-progress-bar');
                const start = (e) => {
                    e.preventDefault();
                    if(!this.state.isDeepScanning && !this.state.isScanning) {
                        this.startSensors(); 
                        this.state.isScanning = true;
                        worker.postMessage({ type: 'reset' });
                        btn.classList.add('active');
                        document.getElementById('instruction').innerText = "CONNECTING...";
                        if(navigator.vibrate) navigator.vibrate(50);
                        let p = 0;
                        this.timers.scan = setInterval(() => {
                            p += 2; ring.style.strokeDashoffset = 308 - ((p/100)*308);
                            if(p >= 100) { clearInterval(this.timers.scan); this.finishInitialScan(); }
                        }, 40);
                    }
                };
                btn.addEventListener('mousedown', start); btn.addEventListener('touchstart', start);
            },

            finishInitialScan: function() {
                if(navigator.vibrate) navigator.vibrate([50, 50]);
                document.getElementById('hud-layer').classList.add('hidden-ui');
                document.getElementById('universe').classList.add('dimmed');
                setTimeout(() => {
                    document.getElementById('dashboard-layer').classList.add('show');
                    this.state.isDeepScanning = true;
                    this.state.validBeatsCount = 0;
                }, 400);
            },
            reset: function() { location.reload(); }
        };
        window.onload = () => app.init();
    </script>
</body>
</html>
