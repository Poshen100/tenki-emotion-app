<script>
    // 🟢 1. Advanced Signal Processing Core (Medical Grade Logic)
    class rPPGAnalyzer {
        constructor() {
            // Configuration
            this.fps = 30;
            this.bufferSize = 256; // Power of 2 for potential FFT, ~8.5 sec window
            
            // Data Buffers
            this.rawSignal = []; // Raw Green Channel average
            this.times = [];     // Timestamps
            this.filteredSignal = []; 
            this.peaks = [];     // Detected peaks (timestamps)
            this.ibis = [];      // Inter-Beat Intervals (ms)
            
            // Smoothing
            this.lastAvg = 0;
        }

        // Input: Average Green Value (0-255) & Timestamp
        push(value, time) {
            this.rawSignal.push(value);
            this.times.push(time);
            
            if (this.rawSignal.length > this.bufferSize) {
                this.rawSignal.shift();
                this.times.shift();
            }
            
            // Only convert signal if we have enough data
            if (this.rawSignal.length >= 30) {
                return this.analyze();
            }
            return { bpm: 0, hrv: 0, rr: 0, signal: 0 };
        }

        analyze() {
            // Step A: Detrending (Remove DC offset / slow movements)
            // Simple method: signal[i] - mean(signal)
            let sum = this.rawSignal.reduce((a, b) => a + b, 0);
            let mean = sum / this.rawSignal.length;
            
            // Step B: Bandpass Filtering (Simple Moving Average simulation)
            // In pure JS without heavy libraries, we smooth the signal to remove high freq noise
            let latestRaw = this.rawSignal[this.rawSignal.length - 1];
            let detrended = latestRaw - mean;
            
            // Invert signal (Higher blood volume = darker image = lower green value)
            // We want peaks to represent heartbeats.
            let signal = -detrended; 

            // Simple Peak Detection (Zero-Crossing / Threshold)
            // If signal crosses from negative to positive and is steep enough
            let isPeak = false;
            let len = this.rawSignal.length;
            if (len > 3) {
                let prev = -(this.rawSignal[len-2] - mean);
                if (prev < 0 && signal > 0 && signal > 0.5) { // 0.5 is noise threshold
                    this.registerPeak(this.times[len-1]);
                    isPeak = true;
                }
            }

            return {
                bpm: this.calculateBPM(),
                hrv: this.calculateRMSSD(),
                rr: this.calculateRR(), // Derived from RSA
                signal: signal // For visualization graph
            };
        }

        registerPeak(timestamp) {
            // Debounce: Human heart can't beat faster than 220bpm (approx 270ms gap)
            if (this.peaks.length > 0) {
                let lastPeak = this.peaks[this.peaks.length - 1];
                let diff = timestamp - lastPeak;
                if (diff < 270) return; // Ignore noise peak
            }
            
            this.peaks.push(timestamp);
            if (this.peaks.length > 30) this.peaks.shift(); // Keep last 30 beats
            
            // Calculate IBI
            if (this.peaks.length >= 2) {
                let ibi = timestamp - this.peaks[this.peaks.length - 2];
                this.ibis.push(ibi);
                if (this.ibis.length > 30) this.ibis.shift(); // Keep last 30 intervals for HRV
            }
        }

        calculateBPM() {
            if (this.ibis.length < 3) return 0;
            // Average the last 5 IBIs for stable BPM
            let recentIBIs = this.ibis.slice(-5);
            let avgIBI = recentIBIs.reduce((a, b) => a + b, 0) / recentIBIs.length;
            return Math.round(60000 / avgIBI);
        }

        calculateRMSSD() {
            if (this.ibis.length < 10) return 0; // Need stable data for HRV
            
            let sumSqDiff = 0;
            for (let i = 0; i < this.ibis.length - 1; i++) {
                let diff = this.ibis[i+1] - this.ibis[i];
                sumSqDiff += diff * diff;
            }
            let rmssd = Math.sqrt(sumSqDiff / (this.ibis.length - 1));
            return Math.round(rmssd);
        }

        calculateRR() {
            // RSA Method: Analyze the fluctuation of IBI lengths
            // When we inhale, IBI shortens. Exhale, IBI lengthens.
            // We count "cycles" of IBI increasing/decreasing.
            if (this.ibis.length < 10) return 0;

            let peaksInIBI = 0;
            // Simple trend change detector
            for (let i = 1; i < this.ibis.length - 1; i++) {
                // If current IBI is larger than prev and next (Local Maxima in heart rhythm)
                if (this.ibis[i] > this.ibis[i-1] && this.ibis[i] > this.ibis[i+1]) {
                    peaksInIBI++;
                }
            }
            
            // Calculate duration of collected IBIs
            let durationSeconds = (this.peaks[this.peaks.length-1] - this.peaks[0]) / 1000;
            if (durationSeconds <= 0) return 0;

            // Breathing Rate = (Breath Cycles / Duration) * 60
            let rr = (peaksInIBI / durationSeconds) * 60;
            return Math.round(rr);
        }
    }

    // 🟢 2. TEI Algorithm (Scientific Weighting)
    class TEIEngine {
        calculate(hrv, rr, stability) {
            // 1. HRV Score (0-40 pts)
            // 20ms is poor, 100ms is athlete. Logarithmic scale.
            if(hrv < 10) hrv = 10;
            let hrvScore = (Math.log(hrv) - 2.3) * 30; 
            hrvScore = Math.max(5, Math.min(40, hrvScore));

            // 2. RR Score (0-40 pts)
            // 6-10 is optimal (Coherence). >20 is stress.
            let rrScore = 0;
            if (rr > 0) {
                const dist = Math.abs(rr - 8); // 8 is midpoint of optimal
                rrScore = 40 - (dist * 3);
                if (rr > 24) rrScore -= 10;
            }
            rrScore = Math.max(5, Math.min(40, rrScore));

            // 3. Stability Score (0-20 pts)
            let stabScore = stability * 0.2;

            // Total
            return Math.floor(hrvScore + rrScore + stabScore);
        }
    }

    // 🟢 3. App Controller (The Glue)
    const app = {
        state: { 
            scanning: false, cameraReady: false, faceFound: false,
            accumulating: false, samples: 0, confidence: 0,
            results: { tei: 0, hrv: 0, rr: 0, bpm: 0 } 
        },
        analyzer: new rPPGAnalyzer(),
        engine: new TEIEngine(),
        roiCtx: null, video: null, timers: {},
        graphBuffer: [], // For visualization only

        init() {
            this.initThree();
            this.initDragDock();
            this.initGraphs();
            this.initCamera(); 
            this.initInteraction();
            lucide.createIcons();
        },

        async initCamera() {
            const video = document.getElementById('input-video');
            this.video = video;
            // 64x64 is enough for averaging colors, saves CPU
            this.roiCtx = document.getElementById('roi-canvas').getContext('2d', {willReadFrequently: true});
            
            try {
                const faceMesh = new FaceMesh({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`});
                // High accuracy mode for better stabilization
                faceMesh.setOptions({maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.7, minTrackingConfidence: 0.7});
                faceMesh.onResults((res) => this.onFaceResults(res));

                const camera = new Camera(video, {
                    onFrame: async () => { await faceMesh.send({image: video}); },
                    width: 320, height: 240 // Lower res processing is fine for rPPG and faster
                });
                await camera.start();
                this.state.cameraReady = true;
                document.getElementById('camera-loading').classList.remove('active');
            } catch (e) {
                console.error(e);
                alert("Camera Access Required via HTTPS");
            }
        },

        onFaceResults(results) {
            if(results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                this.state.faceFound = true;
                document.getElementById('status-badge').innerText = "FACE LOCKED";
                document.getElementById('status-badge').style.color = "#00FF94";
                
                // Only process if scanning or accumulating
                if(this.state.scanning || this.state.accumulating) {
                    // Extract Forehead ROI (Landmarks 10, 338, 297, 332 form a central forehead patch)
                    // Simplified: Just grab center of bounding box of forehead
                    const landmarks = results.multiFaceLandmarks[0];
                    this.processSignal(results.image, landmarks);
                }
            } else {
                this.state.faceFound = false;
                document.getElementById('status-badge').innerText = "WAITING FOR FACE";
                document.getElementById('status-badge').style.color = "gray";
            }
        },

        processSignal(image, landmarks) {
            // Extract Green Channel Mean
            const w = this.roiCtx.canvas.width;
            const h = this.roiCtx.canvas.height;
            this.roiCtx.drawImage(this.video, 0, 0, w, h);
            
            // Sample a 10x10 area from center (Assuming aligned face)
            // Real implementation maps landmarks to canvas coordinates
            const frame = this.roiCtx.getImageData(w/2 - 5, h/2 - 40, 10, 10);
            const data = frame.data;
            let greenSum = 0;
            for(let i=0; i<data.length; i+=4) greenSum += data[i+1];
            const avgGreen = greenSum / (data.length/4);

            // Feed to Analyzer
            const result = this.analyzer.push(avgGreen, Date.now());

            // Real-time Updates
            if(this.state.accumulating) {
                // Update Graph
                this.updateRealtimeGraph(result.signal);
                
                // Update Stats if valid
                if (result.bpm > 40 && result.bpm < 200) this.state.results.bpm = result.bpm;
                if (result.hrv > 0) this.state.results.hrv = result.hrv;
                if (result.rr > 0) this.state.results.rr = result.rr;
                
                // TEI is dynamic
                this.state.results.tei = this.engine.calculate(
                    this.state.results.hrv, 
                    this.state.results.rr, 
                    this.state.stability
                );
            }
            
            // Signal Quality Bar (Visual Feedback)
            if(this.state.scanning) {
                // Visualize intensity changes
                const intensity = Math.min(100, Math.abs(result.signal) * 50);
                document.getElementById('signal-bar').style.width = intensity + '%';
            }
        },

        // --- UI & Interaction Flows (The Trader Flow) ---
        initInteraction() {
            const trigger = document.getElementById('scan-trigger');
            
            const startScan = (e) => {
                e.preventDefault();
                if(!this.state.cameraReady || !this.state.faceFound) return;
                
                this.state.scanning = true;
                this.state.progress = 0;
                this.state.stability = 100; // Reset stability
                
                // UI
                document.getElementById('scan-icon').classList.add('text-cyan-400');
                document.getElementById('pulse-ring').style.borderColor = '#00F0FF';
                document.getElementById('pulse-ring').style.transform = 'scale(1.1)';
                
                // Rapid Scan (2s)
                this.timers.scan = setInterval(() => {
                    this.state.progress += 2.5; // 2 seconds
                    if(this.state.progress >= 100) this.completeScan();
                }, 50);
            };

            const stopScan = (e) => {
                if(this.state.progress < 100) {
                    this.state.scanning = false;
                    clearInterval(this.timers.scan);
                    // Reset UI
                    document.getElementById('scan-icon').classList.remove('text-cyan-400');
                    document.getElementById('pulse-ring').style.borderColor = 'rgba(255,255,255,0.1)';
                    document.getElementById('pulse-ring').style.transform = 'scale(1)';
                    document.getElementById('signal-bar').style.width = '0%';
                }
            };

            trigger.addEventListener('mousedown', startScan);
            trigger.addEventListener('touchstart', startScan);
            window.addEventListener('mouseup', stopScan);
            window.addEventListener('touchend', stopScan);
        },

        completeScan() {
            clearInterval(this.timers.scan);
            // Switch to Dashboard
            document.getElementById('hud-layer').classList.add('hidden-ui');
            document.getElementById('universe').classList.add('dimmed');
            document.getElementById('dashboard-layer').classList.add('show');
            document.getElementById('floating-dock').style.opacity = '1';
            document.getElementById('floating-dock').style.pointerEvents = 'auto';
            
            // Start Continuous Refinement Loop
            this.startRefinement();
        },

        startRefinement() {
            this.state.accumulating = true;
            this.state.samples = 0;
            this.state.confidence = 20;

            // 100ms update loop for UI (Data is updated in onFaceResults)
            this.timers.ui = setInterval(() => {
                this.updateDashboard();
                
                // Confidence builder logic (Simulated growth based on collected valid IBIs)
                const validSamples = this.analyzer.ibis.length;
                this.state.confidence = Math.min(100, Math.floor((validSamples / 30) * 100)); // 30 samples = 100%
                
                document.getElementById('confidence-txt').innerText = this.state.confidence + "%";
                document.getElementById('confidence-bar').style.width = this.state.confidence + "%";

                if (this.state.confidence >= 100) {
                    document.getElementById('analysis-state').innerText = "SYSTEM LOCKED";
                    document.getElementById('analysis-state').classList.remove('animate-pulse');
                    document.getElementById('analysis-state').style.color = "#00FF94";
                    document.getElementById('confidence-bar').style.background = "#00FF94";
                }
            }, 100);
        },

        updateDashboard() {
            const { tei, hrv, rr, bpm } = this.state.results;
            
            // TEI
            const el = document.getElementById('tei-score');
            const ring = document.getElementById('score-ring');
            el.innerText = tei;
            const offset = 628 - (628 * (tei / 100));
            ring.style.strokeDashoffset = offset;
            
            if(tei>=80) ring.style.stroke="var(--score-high)";
            else if(tei>=60) ring.style.stroke="var(--score-mid)";
            else ring.style.stroke="var(--score-low)";

            // Spectrum
            let pns = Math.floor((hrv/120)*100); pns = Math.max(10, Math.min(90, pns));
            const sns = 100 - pns;
            document.getElementById('hrv-val').innerText = hrv + " ms";
            document.getElementById('bar-pns').style.width = pns + '%';
            document.getElementById('bar-pns').innerText = pns + '% PNS';
            document.getElementById('bar-sns').style.width = sns + '%';
            document.getElementById('bar-sns').innerText = sns + '% SNS';

            // Values
            document.getElementById('rr-val').innerText = rr;
            document.getElementById('bpm-val').innerText = bpm;
            
            this.drawBreathGraph(rr);
        },

        updateRealtimeGraph(val) {
            // Push normalized signal to buffer for Bar Graph
            // Signal usually oscillates around 0
            let norm = (val + 2) / 4; // Normalize roughly
            norm = Math.max(0, Math.min(1, norm));
            
            this.graphBuffer.push(norm);
            if(this.graphBuffer.length > 40) this.graphBuffer.shift();
            
            this.drawPulseGraph(this.graphBuffer);
        },

        // --- Graphics Helpers (Copied from v26.4) ---
        initGraphs() {
            this.pulseCanvas = document.getElementById('pulse-canvas');
            this.pulseCtx = this.pulseCanvas.getContext('2d');
            this.breathCanvas = document.getElementById('breath-canvas');
            this.breathCtx = this.breathCanvas.getContext('2d');
            this.breathTime = 0;
        },
        drawPulseGraph(data) {
            const ctx = this.pulseCtx;
            const w = this.pulseCanvas.width; const h = this.pulseCanvas.height;
            const gap = 2; const barW = (w / 40) - gap;
            ctx.clearRect(0,0,w,h);
            data.forEach((val, i) => {
                let barH = val * h * 0.8 + 2; 
                const x = i * (barW + gap); const y = h - barH;
                const grd = ctx.createLinearGradient(0, y, 0, h);
                grd.addColorStop(0, "#00F0FF"); grd.addColorStop(1, "rgba(0,240,255,0)");
                ctx.fillStyle = grd; ctx.fillRect(x, y, barW, barH);
            });
        },
        drawBreathGraph(rr) {
            const ctx = this.breathCtx;
            const w = this.breathCanvas.width; const h = this.breathCanvas.height;
            ctx.clearRect(0,0,w,h);
            const displayRR = (rr > 0) ? rr : 12;
            const speed = (displayRR/60)*0.15; 
            this.breathTime += speed;
            
            ctx.beginPath(); ctx.strokeStyle = "#00FF94"; ctx.lineWidth = 2;
            for(let x=0; x<w; x++) {
                const y = (h/2) + Math.sin(x*0.05 + this.breathTime)*(h/3);
                if(x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
            }
            ctx.stroke();
            
            ctx.beginPath(); ctx.strokeStyle = "rgba(255,255,255,0.3)"; ctx.lineWidth = 1;
            for(let x=0; x<w; x++) {
                const y = (h/2) + Math.sin(x*0.05 + this.breathTime - 1)*(h/3);
                if(x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
            }
            ctx.stroke();
        },
        
        // Background and Drag Logic (Keep same as v26.4)
        initThree() { /* Same as v26.4 - Paticle System */ 
            const container = document.getElementById('universe');
            this.scene = new THREE.Scene();
            this.camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            this.camera.position.z = 5;
            this.renderer = new THREE.WebGLRenderer({alpha:true});
            this.renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(this.renderer.domElement);
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(3000 * 3);
            for(let i=0; i<9000; i++) pos[i] = (Math.random()-0.5)*15;
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            const mat = new THREE.PointsMaterial({size: 0.03, color: 0x00ffff, transparent:true, opacity:0.4});
            this.stars = new THREE.Points(geo, mat);
            this.scene.add(this.stars);
            this.animateThree();
        },
        animateThree() {
            requestAnimationFrame(()=>this.animateThree());
            this.stars.rotation.y += 0.0005;
            this.renderer.render(this.scene, this.camera);
        },
        initDragDock() {
            const dock = document.getElementById('floating-dock');
            let isDragging = false, startX, startY, initialLeft, initialBottom;
            const getPos = (e) => e.touches ? e.touches[0] : e;
            const startDrag = (e) => {
                if(e.target.closest('button')) return;
                isDragging = true;
                const pos = getPos(e);
                startX = pos.clientX; startY = pos.clientY;
                const rect = dock.getBoundingClientRect();
                initialLeft = rect.left; initialBottom = window.innerHeight - rect.bottom;
                dock.style.transition = 'none';
            };
            const drag = (e) => {
                if(!isDragging) return;
                e.preventDefault();
                const pos = getPos(e);
                const dx = pos.clientX - startX;
                const dy = pos.clientY - startY;
                let newLeft = initialLeft + dx;
                let newBottom = initialBottom - dy;
                if(newBottom < 10) newBottom = 10;
                if(newBottom > window.innerHeight-80) newBottom = window.innerHeight-80;
                if(newLeft < 10) newLeft = 10;
                if(newLeft > window.innerWidth - dock.offsetWidth - 10) newLeft = window.innerWidth - dock.offsetWidth - 10;
                dock.style.left = newLeft + 'px'; dock.style.bottom = newBottom + 'px'; dock.style.marginLeft = '0'; dock.style.transform = 'none';
            };
            const endDrag = () => { isDragging = false; dock.style.transition = 'all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)'; };
            dock.addEventListener('mousedown', startDrag); dock.addEventListener('touchstart', startDrag, {passive:false});
            window.addEventListener('mousemove', drag); window.addEventListener('touchmove', drag, {passive:false});
            window.addEventListener('mouseup', endDrag); window.addEventListener('touchend', endDrag);
        },

        reset() { window.location.reload(); }
    };

    window.onload = () => app.init();
</script>
